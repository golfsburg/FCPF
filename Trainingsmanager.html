/* ---------- Setup ---------- */
let lanes=[],interval=cfg.defInterval,N=4,cycle=16,backCache=new Map();
function setup(){
  const nL=cfg.laneOpt?+q('sLanes').value:1;interval=+q('sInt').value;
  lanes=cfg.laneX(nL).map((x0,li)=>{const L=cfg.build(x0);L.li=li;L.run=buildPath(L.runPts);L.Q=L.queue;
    const e=pathPos(L.run,L.run.T);L.backPts=[{x:e.x,y:e.y,v:L.backPts[0].v||2.6}].concat(L.backPts.filter(b=>Math.hypot(b.x-e.x,b.y-e.y)>.05));return L;});
  // Rückweg ohne Endpunkt bauen, um Dauer abzuschätzen
  const est=buildPath(lanes[0].backPts.concat([polyAt(lanes[0].Q,1.3*3)]));
  const runMax=lanes[0].run.T/0.92+(cfg.shot?0.7:0)+est.T;
  N=Math.max(3,Math.ceil((runMax+interval*0.8)/interval));cycle=N*interval;backCache=new Map();
}
const SP=1.3; // Abstand in der Startreihe
function qPos(L,f){return polyAt(L.Q,Math.max(0,f)*SP);}
function runInfo(L,i,T){
  const first=i*interval;if(T<first)return{wait:true,f:(first-T)/interval};
  const k=Math.floor((T-first)/cycle),s=first+k*cycle,tau=T-s;
  const fac=.92+.16*hash(i*31+k*17+L.li*7+3);
  const runEnd=L.run.T/fac,bStart=runEnd+(cfg.shot?0.7:0);
  const key=L.li+':'+i+':'+k;let B=backCache.get(key);
  if(!B){B=buildPath(L.backPts.map(p=>Object.assign({},p)).concat([{x:0,y:0}]));
    // Endpunkt: Platz in der Startreihe zum Zeitpunkt der Ankunft
    let end=qPos(L,(cycle-(bStart+B.T))/interval);
    for(let it=0;it<2;it++){B=buildPath(L.backPts.concat([end]));end=qPos(L,(cycle-(bStart+B.T))/interval);}
    B=buildPath(L.backPts.concat([end]));B.end=end;backCache.set(key,B);if(backCache.size>400)backCache.clear();}
  return{wait:false,k,s,tau,fac,runEnd,bStart,B,bEnd:bStart+B.T,shotDone:runEnd+.55};
}
function posAt(L,i,T){
  const r=runInfo(L,i,T);
  if(r.wait)return qPos(L,r.f);
  if(r.tau<r.runEnd)return pathPos(L.run,r.tau*r.fac);
  if(r.tau<r.bStart)return pathPos(L.run,L.run.T);
  if(r.tau<r.bEnd)return pathPos(r.B,r.tau-r.bStart);
  return qPos(L,(r.s+cycle-T)/interval);
}
function dirAt(L,i,T,fallback){const v=sub(posAt(L,i,T+.08),posAt(L,i,T-.08));return len(v)>.02?norm(v):fallback;}

/* ---------- Zustand ---------- */
let T=0,playing=false,last=0,speed=1,showText=true,showCourse=true,showFocus=true,raf=0,alive=true,showWays=true,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;
const lastDir={};
function featured(){ // zuletzt gestarteter Spieler der ersten Bahn
  const L=lanes[0];let best=null;
  let newest=null;
  for(let i=0;i<N;i++){const r=runInfo(L,i,T);if(r.wait)continue;
    if(!newest||r.s>newest.r.s)newest={i,r};
    if(r.tau<r.bStart+1.6&&(!best||r.s<best.r.s))best={i,r};}
  return best||newest;
}
function phaseOf(r){ // Phase (Index in cfg.phases) eines Laufs
  if(r.tau>=r.bStart)return cfg.backPh;
  if(cfg.shot&&r.tau>=r.runEnd)return cfg.shotPh;
  const tt=r.tau*r.fac;let ph=lanes[0].run.ph[0].ph;lanes[0].run.ph.forEach(p=>{if(tt>=p.t)ph=p.ph;});return ph;
}
function phaseStartTau(r,ph){
  if(ph===cfg.backPh)return r.bStart;if(cfg.shot&&ph===cfg.shotPh)return r.runEnd;
  const e=lanes[0].run.ph.find(p=>p.ph===ph);return e?e.t/r.fac:0;
}
function timeOf(r){return cfg.timeMark?(lanes[0].run.mark[cfg.timeMark]||lanes[0].run.T)/r.fac:r.runEnd;}
function bestTime(){let best=null;
  lanes.forEach(L=>{for(let i=0;i<N;i++){const first=i*interval;if(T<first)continue;
    const kmax=Math.floor((T-first)/cycle);for(let k=Math.max(0,kmax-3);k<=kmax;k++){const r=runInfo(L,i,first+k*cycle+.001);
      if(first+k*cycle+timeOf(r)<=T){const t=timeOf(r);if(!best||t<best.t)best={t,i,li:L.li};}}}});
  return best;}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.82)',a=1}=o;
  const fs=clamp(K*.55,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
const Hx={
  get K(){return K},ctx,tag,
  grass(x1,y1,x2,y2){ctx.fillStyle='#2a7d3b';ctx.fillRect(0,0,CW,CH);const n=10,h=(y2-y1)*K;
    for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(x1*K,y1*K+i*h/n,(x2-x1)*K,h/n+1);}
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.strokeRect(x1*K,y1*K,(x2-x1)*K,(y2-y1)*K);},
  cone(x,y,col='#ff8a1f',s=1){const X=x*K,Y=y*K,r=clamp(K*.4,4.5,8)*s;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.9,Y+r*.65);ctx.lineTo(X-r*.9,Y+r*.65);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();},
  pole(x,y){const X=x*K,Y=y*K,r=clamp(K*.28,3.5,6);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+3,Y+3,r*1.3,r,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.strokeStyle='#1a1a1a';ctx.lineWidth=Math.max(1.5,r*.45);ctx.beginPath();ctx.arc(X,Y,r*.55,0,7);ctx.stroke();},
  dummy(x,y,a=0){ctx.save();ctx.translate(x*K,y*K);ctx.rotate(a);const w=1.8*K,h=Math.max(5,.55*K);
    ctx.fillStyle='rgba(0,0,0,.3)';rr(-w/2+2,-h/2+3,w,h,h/2);ctx.fill();ctx.fillStyle='#ff7a1a';rr(-w/2,-h/2,w,h,h/2);ctx.fill();
    ctx.strokeStyle='#7a2e00';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();},
  miniGoal(x,y,w){const x1=(x-w/2)*K,x2=(x+w/2)*K,Y=y*K,b=(y-1)*K;ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x1,b,x2-x1,Y-b);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;for(let xx=x-w/2+.5;xx<x+w/2;xx+=.5){ctx.beginPath();ctx.moveTo(xx*K,b);ctx.lineTo(xx*K,Y);ctx.stroke();}
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,Y);ctx.lineTo(x1,b);ctx.lineTo(x2,b);ctx.lineTo(x2,Y);ctx.stroke();ctx.lineCap='butt';},
  balls(x,y,n=3){for(let i=0;i<n;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((x+i*.6)*K,(y+(i%2)*.4)*K,Math.max(3,K*.28),0,7);ctx.fill();}}
};
function pathStroke(P,o){const {col='#fff',a=.25,w=2,dash=null,wavy=false}=o;
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();
  let dist=0;P.S.forEach((s,i)=>{let x=s.x,y=s.y;if(wavy&&i>0&&i<P.S.length-1){const pv=P.S[i-1],nx=P.S[i+1],d=norm(sub(nx,pv));dist+=len(sub(s,pv));const k=Math.sin(dist/1.2*Math.PI*2)*.22;x+=-d.y*k;y+=d.x*k;}
    i?ctx.lineTo(x*K,y*K):ctx.moveTo(x*K,y*K);});ctx.stroke();ctx.restore();}
function player(p,lbl,face,o={}){
  const {ring=null,a=1}=o;const X=p.x*K,Y=p.y*K,r=clamp(K*.75,8,14);
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(X+Math.cos(face)*(r+6),Y+Math.sin(face)*(r+6));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=o.fill||'#c8ef4a';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  ctx.fillStyle='#16210a';ctx.font=`800 ${r*(lbl.length>1?.75:1)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);ctx.restore();
}
function ball(p,a=1){const X=p.x*K,Y=p.y*K,r=clamp(K*.34,4,7);ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();ctx.restore();}
function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  cfg.drawField(Hx,lanes);
  if(showCourse)lanes.forEach(L=>{pathStroke(L.run,{a:.32,wavy:true});
    if(cfg.shot)pathStroke({S:[pathPos(L.run,L.run.T),L.shotTo]},{col:'#ffd34d',a:.35,dash:[5,6]});
    pathStroke(buildPath(L.backPts.concat([qPos(L,N-1)])),{a:.22,dash:[2,6],w:1.6});});
  if(showWays){const F0=featured();if(F0&&!F0.r.wait&&F0.r.tau<F0.r.runEnd){const L=lanes[0],tt=F0.r.tau*F0.r.fac;let te=L.run.T;
    L.run.ph.forEach(p=>{if(p.t>tt+.01&&p.t<te)te=p.t;});const pts=L.run.S.filter(s=>s.t>=tt&&s.t<=te);
    if(pts.length>1){ctx.save();ctx.strokeStyle='#ffd34d';ctx.globalAlpha=.85;ctx.lineWidth=Math.max(2,K*.12);ctx.setLineDash([6,5]);ctx.lineCap='round';
      ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x*K,p.y*K):ctx.moveTo(p.x*K,p.y*K));ctx.stroke();ctx.restore();}}}
  const F=featured();
  lanes.forEach(L=>{
    for(let i=0;i<N;i++){
      const p=posAt(L,i,T),r=runInfo(L,i,T),qd=norm(sub(L.Q[0],L.Q[1]));
      const d=dirAt(L,i,T,lastDir[L.li+':'+i]||qd);lastDir[L.li+':'+i]=d;
      const waiting=r.wait||r.tau>=r.bEnd;const face=waiting?ang(qd):ang(d);
      const isF=showFocus&&L.li===0&&F&&F.i===i;
      const lbl=(lanes.length>1?(L.li?'B':'A'):'')+(i+1);
      // Ball
      let bp=null,ba=1;
      if(!r.wait&&r.tau<r.runEnd)bp=add(p,d,.7);
      else if(cfg.shot&&!r.wait&&r.tau<r.runEnd+2.6){const sp=add(pathPos(L.run,L.run.T),dirAt(L,i,r.s+r.runEnd-.1,qd),.7);
        const u=clamp((r.tau-r.runEnd)/.55,0,1);bp=lp(sp,L.shotTo,1-Math.pow(1-u,2));ba=r.tau>r.runEnd+1.8?(r.runEnd+2.6-r.tau)/.8:1;}
      else if(cfg.backBall)bp=add(p,waiting?qd:d,.7);
      player(p,lbl,face,{ring:isF?'#ffd34d':null,a:waiting&&!isF?.85:1});
      if(bp)ball(bp,ba);
      // Stoppuhr
      if(!r.wait){const tt=timeOf(r);
        if(r.tau<tt&&(isF||lanes.length>1))tag({x:p.x,y:p.y-1.6},'⏱ '+fmt(r.tau),{bg:'rgba(10,16,24,.85)'});
        else if(r.tau>=tt&&r.tau<tt+2.4&&(isF||lanes.length>1))tag({x:p.x,y:p.y-1.6},'✓ '+fmt(tt)+' s',{c:'#111',bg:'#ffd34d'});
        if(isF&&cfg.cue){const ph=phaseOf(r),cu=cfg.cue[ph];if(cu&&r.tau<r.bStart)tag({x:p.x,y:p.y+1.7},cu,{c:'#111',bg:'rgba(255,255,255,.92)'});}
        if(cfg.shot&&r.tau>=r.runEnd+.5&&r.tau<r.runEnd+1.6&&(isF||lanes.length>1))tag(add(L.shotTo,{x:0,y:2}),'⚽ TOR!',{c:'#111',bg:'#ffd34d'});}
    }
  });
}

/* ---------- UI ---------- */
const PH=cfg.phases;
const steps=q('steps');
PH.forEach((p,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=(i+1)+' · '+p.label;c.dataset.i=i;
  c.onclick=()=>{playing=false;jumpTo(i)};steps.appendChild(c);});
function jumpTo(ph){const F=featured();if(!F){T=0;return;}setT(F.r.s+phaseStartTau(F.r,ph)+.02);}
let lastKey='';
function updateUI(){
  const F=featured();let ph=0,st='',ti,tx;
  if(F){ph=phaseOf(F.r);const P=PH[ph];ti=P.title;tx=P.text;
    st='Spieler '+(lanes.length>1?'A':'')+(F.i+1)+' · Schritt '+(ph+1)+' von '+PH.length;}
  const b=bestTime();
  if(!playing&&T===0){st='Parcours';ti=cfg.title;tx='▶ Abspielen startet den Parcours. Die Spieler starten im Takt nacheinander, jeder mit Stoppuhr.';}
  const extra=b?' · Bestzeit: '+(lanes.length>1?(b.li?'B':'A'):'')+(b.i+1)+' mit '+fmt(b.t)+' s':'';
  const key=st+ti+tx+extra;
  if(key!==lastKey){lastKey=key;q('ovStep').textContent=st+extra;q('ovTitle').textContent=ti;q('ovText').textContent=tx;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',!!F&&ci===ph&&(playing||T>0));c.classList.toggle('done',!!F&&ci<ph);});}
  q('ov').classList.toggle('hidden',!showText);
  q('bPlay').textContent=playing?'⏸ Pause':'▶ Abspielen';
}
function setT(t){T=Math.max(0,t);}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
q('bPlay').onclick=()=>{playing=!playing;};
q('bRestart').onclick=()=>{setT(0);playing=true;};
q('bPrev').onclick=()=>{playing=false;const F=featured();if(!F){setT(0);return;}const ph=phaseOf(F.r),st=phaseStartTau(F.r,ph);
  if(F.r.tau-st>.4)jumpTo(ph);else if(ph>0)jumpTo(ph-1);else setT(Math.max(0,F.r.s-interval+.02));};
q('bNext').onclick=()=>{playing=false;const F=featured();if(!F){setT(.02);return;}const ph=phaseOf(F.r);
  if(ph<PH.length-1)jumpTo(ph+1);else setT(F.r.s+interval+.02);};
q('sSpeed').onchange=e=>speed=+e.target.value;
q('sInt').onchange=()=>{setup();setT(0);};
if(cfg.laneOpt)q('sLanes').onchange=()=>{setup();setT(0);};
exOpts(root,['all','runs','text','ann'],o=>{showText=o.text;showCourse=o.all;showWays=o.runs;showAnn=o.ann;});
q('cFocus').onchange=e=>showFocus=e.target.checked;
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if(e.key==='r'||e.key==='R')q('bRestart').click();
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
setup();resize();raf=requestAnimationFrame(frame);
root._sim={setT,get T(){return T},get N(){return N},get cycle(){return cycle},featured,posAt:(li,i,t)=>posAt(lanes[li],i,t),lanes:()=>lanes};
root._export=()=>{
  const L0=lanes[0],r0=runInfo(L0,0,.001);
  const ts=PH.map((p,i)=>Math.max(0,phaseStartTau(r0,i)-(i?.02:0))).concat([r0.bEnd]);
  const rec={lines:[],items:[]};
  const Hrec={get K(){return 1},ctx:{},
    grass:(x1,y1,x2,y2)=>rec.lines.push({t:'rect',x:x1,y:y1,w:x2-x1,h:y2-y1}),
    cone:(x,y,col,s)=>rec.items.push({kind:'cone',x,y,c:col||'#ff8a1f'}),
    pole:(x,y)=>rec.items.push({kind:'pole',x,y}),
    dummy:(x,y,a)=>rec.items.push({kind:'dummy',x,y,a:Math.round((a||0)*180/Math.PI)}),
    miniGoal:(x,y,w)=>rec.items.push({kind:'goal',x,y,w,d:1}),
    balls:()=>{},tag:(p,txt)=>rec.lines.push({t:'text',x:p.x,y:p.y,text:txt})};
  try{cfg.drawField(Hrec,lanes);}catch(e){}
  const acts=[];lanes.forEach(L=>{for(let i=0;i<N;i++)acts.push({k:L.li+':'+i,name:(lanes.length>1?(L.li?'B':'A'):'')+(i+1)});});
  function ball(t){const r=runInfo(L0,0,t),p=posAt(L0,0,t);if(r.wait)return null;
    const d=norm(sub(posAt(L0,0,t+.08),posAt(L0,0,t-.08)));
    if(r.tau<r.runEnd)return add(p,d,.7);
    if(cfg.shot&&r.tau<r.runEnd+.55){const sp=add(pathPos(L0.run,L0.run.T),d,.7),u=clamp((r.tau-r.runEnd)/.55,0,1);return lp(sp,L0.shotTo,1-Math.pow(1-u,2));}
    if(cfg.shot&&r.tau<r.bStart+.01)return L0.shotTo;
    return cfg.backBall?add(p,d,.7):(cfg.shot?L0.shotTo:null);}
  return ttMk({Wm:W,Hm:H,lines:rec.lines,items:rec.items,actors:acts,times:ts,
    pos:(k,t)=>{const [li,i]=k.split(':').map(Number);return posAt(lanes[li],i,t);},
    ball,holderNear:1.2,
    notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];return p.title+': '+p.text;})});};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();
};
}

const q=n=>root.querySelector('[data-r="'+n+'"]');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const perp=v=>({x:-v.y,y:v.x});
const ang=v=>Math.atan2(v.y,v.x);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const quad=(a,k,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*k.x+t*t*b.x,y:u*u*a.y+2*u*t*k.y+t*t*b.y}};
const cub=(a,c1,c2,b,t)=>{const u=1-t;return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}};

const ACT=Object.assign({},V.own,V.opp);
const isOpp=k=>k in V.opp;
const LBL={TW:'TW',IL:'IL',IR:'IR',LV:'LV',RV:'RV',Z6:'6',Z8:'8',S1:'S1',S2:'S2'};
/* Läufe & Ballführungen (Ballführung = Lauf mit Ball) */
const runs=[];
V.runs.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1},o||{})));
V.carries.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1,carry:1},o||{})));
runs.sort((a,b)=>a.t0-b.t0);
{const cur={};Object.keys(ACT).forEach(k=>cur[k]=ACT[k]);runs.forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
function runPt(r,t){if(r.c1)return cub(r.from,r.c1,r.c2,r.to,t);if(r.k)return quad(r.from,r.k,r.to,t);return lp(r.from,r.to,t);}
function actorPos(k,T){let p=ACT[k];
  for(const r of runs){if(r.w!==k)continue;if(T<=r.t0)break;if(T<r.t1)return runPt(r,ease(seg(T,r.t0,r.t1)));p=r.to;}
  return p;}
function runningAt(k,T){return runs.find(r=>r.w===k&&T>r.t0&&T<r.t1)}
function foot(k,T){const p=actorPos(k,T),v=sub(actorPos(k,T+.05),actorPos(k,T-.05));return add(p,len(v)>.01?norm(v):{x:0,y:-1},.8);}
/* Ball-Ereignisse */
const passes=V.passes.map(([f,to,t0,t1,lbl,o])=>{const pt=typeof to!=='string',a=actorPos(f,t0),b=pt?to:actorPos(to,t1);
  return Object.assign({type:'pass',f,to:pt?null:to,t0,t1,lbl,s:add(a,norm(sub(b,a)),.8),e:pt?b:add(b,norm(sub(a,b)),.9)},o||{});});
const events=passes.concat(runs.filter(r=>r.carry).map(r=>({type:'carry',w:r.w,t0:r.t0,t1:r.t1}))).sort((a,b)=>a.t0-b.t0);
const evStart=ev=>ev.type==='pass'?ev.s:foot(ev.w,ev.t0+.06);
const evEnd=ev=>ev.type==='pass'?ev.e:foot(ev.w,ev.t1-.06);
function ballAt(T){
  if(T<events[0].t0){const s=evStart(events[0]);return T<.6?V.ball:lp(V.ball,s,ease(seg(T,.6,events[0].t0)));}
  let i=0;for(let k=0;k<events.length;k++)if(T>=events[k].t0)i=k;
  const ev=events[i];
  if(T<ev.t1)return ev.type==='pass'?lp(ev.s,ev.e,ev.lob?seg(T,ev.t0,ev.t1):1-Math.pow(1-seg(T,ev.t0,ev.t1),1.35)):foot(ev.w,T);
  const n=events[i+1];if(n)return lp(evEnd(ev),evStart(n),ease(seg(T,ev.t1,n.t0)));
  return evEnd(ev);}
function liftAt(T){const p=passes.find(p=>p.lob&&T>=p.t0&&T<p.t1);return p?Math.sin(Math.PI*seg(T,p.t0,p.t1)):0;}
function holderAt(T){let h='TW';for(const ev of events){if(T<ev.t0)break;if(ev.type==='pass')h=T>=ev.t1?ev.to:null;else if(T<=ev.t1||h===ev.w)h=ev.w;}return h;}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowHead(X,Y,an,w){const h=Math.max(8,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}

function player(p,lbl,face,o={}){const {fill='#c8ef4a',txt='#16210a',ring=null,a=1}=o;

/* ---------- UI ---------- */
const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=(i>0&&i<PH.length-1?i+' · ':'')+p.label;c.dataset.i=i;
  c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
let lastKey=-1;
function updateUI(){const i=phaseIdx(T),p=PH[i];
  if(i!==lastKey){lastKey=i;q('ovStep').textContent=V.name+(i>0&&i<PH.length-1?' · Schritt '+i+' von '+(PH.length-2):'');
    q('ovTitle').textContent=p.title;q('ovText').textContent=p.text;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});}
  q('ov').classList.toggle('hidden',!showText);q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}
function frame(ts){if(!alive)return;if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}last=ts;draw();updateUI();raf=requestAnimationFrame(frame);}
q('bPlay').onclick=()=>{if(T>=TEND){setT(0);playing=true;return}playing=!playing;};
q('bRestart').onclick=()=>{setT(0);playing=true;};
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
exOpts(root,['opp','all','runs','text','ann','names'],o=>{showText=o.text;showOpp=o.opp;showRuns=o.all;showWays=o.runs;showAnn=o.ann;showNames=o.names;});
root.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v!==vk&&SPZ_VARIANTS[v]&&typeof openExercise==='function')openExercise('spielzug-'+v.toLowerCase());});
function onKey(e){if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();else if(e.key==='r'||e.key==='R')q('bRestart').click();}
document.addEventListener('keydown',onKey);
function resize(){CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);}
let ro=null;if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);resize();raf=requestAnimationFrame(frame);
root._sim={setT,holderAt,ballAt,actorPos};
root._export=()=>ttFromSpielzug(vk);
return function destroy(){alive=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',onKey);window.removeEventListener('resize',resize);if(ro)ro.disconnect();};
}

/* ---------- Einlesen: Export v2 (alte Taktiktafel) und Format v3 ---------- */
function ttNormalize(d){
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Unbekanntes Format. Erwartet wird ein Spielzug der Taktiktafel ({"v":…, "frames":[…]}).');
  const num=v=>typeof v==='number'?v:parseFloat(v);
  const okP=p=>p&&isFinite(num(p.x))&&isFinite(num(p.y));
  const toPt=b=>b&&isFinite(num(b.x))&&isFinite(num(b.y))?{x:num(b.x),y:num(b.y)}:null;
  const normP=p=>({id:p.id!=null?p.id:(p.name+'|'+p.team),x:num(p.x),y:num(p.y),name:p.name==null?'':String(p.name),num:p.num==null?'':String(p.num),team:p.team||'home',tp:p.tp||undefined});
  const base={age:d.age||'',form:d.form||'',hCol:d.hCol||'#c8ef4a',aCol:d.aCol||'#e5484d',gCol:d.gCol||'#7b3fe4',W:TT_FW,H:TT_FH,
    items:Array.isArray(d.items)?d.items.filter(okP):[]};
  const isV3=Array.isArray(d.frames)&&d.frames.length&&d.frames[0]&&!Array.isArray(d.frames[0])&&Array.isArray(d.frames[0].players);
  if(isV3){
    const frames=d.frames.map(f=>({players:(f.players||[]).filter(okP).map(normP),ball:toPt(f.ball),ballSrc:f.holder==null&&!!toPt(f.ball)}));
    let last=null;frames.forEach(f=>{if(f.ball)last=f.ball;else if(!f.ballSrc)f.ball=last;});
    Object.assign(base,{W:+d.W||TT_FW,H:+d.H||TT_FH,pitch:d.pitch==='none'?'none':'full',lines:Array.isArray(d.lines)?d.lines:[]});
    return Object.assign(base,{v:3,frames,anns:d.frames.map(f=>Array.isArray(f.anns)?f.anns:[]),
      notes:d.frames.map(f=>f.note||''),holders:d.frames.map(f=>f.holder==null?null:f.holder),autoHolder:null});
  }
  const raw=Array.isArray(d.frames)&&d.frames.length?d.frames:(Array.isArray(d.players)?[d.players]:null);
  if(!raw)throw new Error('Im Spielzug fehlen die Spieler ("frames" bzw. "players").');
  const frames=raw.map((f,i)=>{
    let pl=Array.isArray(f)?f:(f&&Array.isArray(f.players)?f.players:[]);
    let ball=f&&!Array.isArray(f)?toPt(f.ball||f._b):null;
    if(!ball&&f&&f._b)ball=toPt(f._b);
    const bp=pl.find(p=>p&&(p.team==='ball'||p.type==='ball'));if(bp){ball=toPt(bp);pl=pl.filter(p=>p!==bp);}
    if(!ball){const arr=d.balls||d.ballFrames;if(Array.isArray(arr))ball=toPt(arr[i]);}
    return{players:pl.filter(okP).map(normP),ball,ballSrc:!!ball};

  if(!frames.some(f=>f.ballSrc)&&top){let best=null,bd=1e9;
    frames[0].players.forEach(p=>{const dd=Math.hypot(p.x-top.x,p.y-top.y);if(dd<bd){bd=dd;best=p;}});if(best&&bd<90)autoHolder=best.id;}
  let last=top;frames.forEach(f=>{if(f.ball)last=f.ball;else f.ball=last;});
  return Object.assign(base,{v:2,hCol:d.hCol||'#2a8a2a',aCol:d.aCol||'#c0392b',gCol:d.gCol||'#f39c12',frames,
    anns:Array.isArray(d.anns)?d.anns:[],notes:[],holders:[],autoHolder});

function ttParse(txt){

/* Ballbesitz je Schritt: festgelegt > Ball frei im Schritt > vom vorigen Schritt übernommen */

  return{v:3,W:M.W||TT_FW,H:M.H||TT_FH,pitch:M.pitch||'full',lines:ttClone(M.lines||[]),age:M.age||'U14',form:M.form||'',hCol:M.hCol,aCol:M.aCol,gCol:M.gCol||'#7b3fe4',items:ttClone(M.items||[]),
    frames:M.frames.map((f,k)=>({players:f.players.map(p=>Object.assign({},p,{id:mapId(p.id),num:p.num===''?'':(isFinite(+p.num)?+p.num:p.num)})),

function ttNotify(){ttSyncExercises();TT.listeners.slice().forEach(f=>{try{f()}catch(e){}});}
function ttLocalLoad(){TT.mode='local';try{TT.plays=JSON.parse(store('ttPlays')||'[]')||[];}catch(e){TT.plays=[];}ttNotify();}

async function ttSave(p){
  p=Object.assign({},p);const id=p.id||ttNewId();delete p.id;
  if(TT.mode==='db'){await TT.db.collection('plays').doc(id).set(p);}
  else if(TT.mode==='gh'){await ghSaveItem('plays',id,p);}
  else{const i=TT.plays.findIndex(x=>x.id===id);const rec=Object.assign({id},p);if(i>=0)TT.plays[i]=rec;else TT.plays.push(rec);ttLocalPersist();ttNotify();}
  return id;
}

  else if(TT.mode==='gh'){await ghRemoveItem('plays',id);}
  else{TT.plays=TT.plays.filter(p=>p.id!==id);ttLocalPersist();ttNotify();}
}
async function ttInit(){
  let db=null;

      TT.plays=s.docs.map(x=>Object.assign({id:x.id},x.data()||{})).sort((a,b)=>(a.created||0)-(b.created||0));ttNotify();},

}

/* ---------- Abspieler ---------- */
function ttPlayer(host,opts){
  opts=opts||{};
  host.innerHTML=`
  <div class="stage tall"><canvas data-t="cv"></canvas></div>
  <div class="ov below" data-t="ov"><div class="ovStep" data-t="ovStep"></div><div class="ovText" data-t="ovText"></div></div>
  ${TT_LEGEND}
  <div class="steps" data-t="steps"></div>
  <div class="bar">
    <button data-t="bRestart">⟲ Neu</button>
    <button data-t="bPrev">◀ Schritt</button>
    <button data-t="bPlay" class="primary">▶ Abspielen</button>
    <button data-t="bNext">Schritt ▶</button>
    <label>Tempo <select data-t="sSpeed"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label>
  </div>
  <input type="range" data-t="rT" min="0" max="0" step="0.01" value="0" aria-label="Zeitleiste">
  <div class="bar">
    <label><input type="checkbox" data-t="cOpp" checked> Gegner</label>
    <label title="Alle Wege des ganzen Spielzugs blass im Hintergrund"><input type="checkbox" data-t="cAll" checked> Gesamtablauf vorab zeigen</label>
    <label title="Die Wege bis zum nächsten Schritt"><input type="checkbox" data-t="cRuns" checked> Wege vorab zeigen</label>
    <label><input type="checkbox" data-t="cText" checked> Text</label>
    <label><input type="checkbox" data-t="cAnn" checked> Zeichnungen</label>
    <label><input type="checkbox" data-t="cName"> Namen statt Nummern</label>
  </div>
  <div class="kbd">Tastatur: Leertaste = Play/Pause · ← → = Schritt · R = Neustart</div>`;
  const q=n=>host.querySelector('[data-t="'+n+'"]');
  const cv=q('cv'),ctx=cv.getContext('2d'),R=ttRenderer(ctx);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  let D=null,notes=[],T=0,playing=false,speed=1,raf=0,last=0,alive=true,maps=[],userH=[],eff=[],teamOf=new Map();
  let holdUntil=0,resumeAt=false;
  const N=()=>D?D.frames.length:1;
  function setData(d,nt,hs){
    const keepT=D&&d&&D.frames.length===d.frames.length;
    D=d;notes=nt||d.notes||[];userH=Array.isArray(hs)?hs.slice():(d.holders||[]);
    maps=D.frames.map(f=>{const m=new Map();f.players.forEach(p=>m.set(p.id,p));return m;});
    teamOf=new Map();D.frames.forEach(f=>f.players.forEach(p=>{if(!teamOf.has(p.id))teamOf.set(p.id,p.team);}));
    eff=ttEffHolders(D,userH);
    q('rT').max=Math.max(0,N()-1);
    if(!keepT){T=0;playing=false;resumeAt=false;}
    buildSteps();resize();
  }
  function buildSteps(){
    const el=q('steps');el.innerHTML='';
    for(let i=0;i<N();i++){const c=document.createElement('span');c.className='chip';c.textContent=i===0?'Ausgangslage':'Schritt '+i;
      c.onclick=()=>{playing=false;resumeAt=false;T=i;updateUI();};el.appendChild(c);}
  }
  function posAt(id,T){
    const k=Math.min(Math.floor(T),N()-1),u=T-k;
    const a=maps[k].get(id),b=k+1<N()?maps[k+1].get(id):null;
    if(!a)return null;if(!b||u<=0)return a;
    const e=ease(clamp((u-.15)/.85,0,1));return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e)};
  }
  const foot=(id,pos)=>ttFoot(teamOf.get(id),pos);
  function ballFrame(k){const h=eff[k];if(h!=null){const p=maps[k].get(h);if(p)return foot(h,p);}return D.frames[k].ball;}
  function ballMove(k){
    if(k+1>=N())return null;const a=ballFrame(k),b=ballFrame(k+1);if(!a||!b)return null;
    if(Math.hypot(b.x-a.x,b.y-a.y)<6)return null;
    return eff[k]!=null&&eff[k]===eff[k+1]?'carry':'pass';
  }
  function ballAt(T){
    const k=Math.min(Math.floor(T),N()-1),u=T-k;
    const a=ballFrame(k),b=k+1<N()?ballFrame(k+1):null;
    if(!a)return b;if(!b||u<=0)return a;
    const mv=ballMove(k);
    if(mv==='carry'){const pos=posAt(eff[k],T);return pos?foot(eff[k],pos):a;}
    const e=mv==='pass'?1-Math.pow(1-clamp((u-.2)/.6,0,1),1.6):ease(clamp((u-.15)/.85,0,1));
    return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e)};
  }
  function holderAtT(T){
    const k=Math.min(Math.floor(T),N()-1),u=T-k;
    if(k+1>=N()||u<=.2)return eff[k];
    const mv=ballMove(k);if(mv==='carry')return eff[k];
    if(mv==='pass')return u>=.8?eff[k+1]:null;
    return u<.5?eff[k]:eff[k+1];
  }
  const colOf=p=>p.team==='gk'?D.gCol:p.team==='away'?D.aCol:D.hCol;
  function draw(){
    if(!D)return;ctx.clearRect(0,0,cv.width,cv.height);R.field(D);
    (D.items||[]).forEach(it=>R.item(it));
    const opp=q('cOpp').checked,k=Math.min(Math.floor(T),N()-1),nxt=k+1<N()?k+1:-1;
    const vis=p=>opp||p.team!=='away';
    /* Wege von Schritt j zu j+1; f = Deckkraft-Faktor */
    function moves(j,f){if(j+1>=N())return;
      /* hat der Schritt eigene Zeichnungen, zeigen sie die Wege der eigenen Mannschaft und des Balls */
      const drawn=q('cAnn').checked&&(D.anns[j]||[]).some(a=>a&&a.type!=='zone');
      D.frames[j].players.forEach(p=>{if(!vis(p)||drawn&&p.team!=='away')return;const b=maps[j+1].get(p.id);if(!b)return;
        if(Math.hypot(b.x-p.x,b.y-p.y)<8||eff[j]===p.id&&ballMove(j)==='carry')return;
        R.poly([{x:p.x,y:p.y},{x:b.x,y:b.y}],p.team==='away'?'rgba(255,170,170,.85)':'#7fd1ff',{dash:true,a:.75*f});});
      const mv=drawn?null:ballMove(j);
      if(mv==='pass')R.poly([ballFrame(j),ballFrame(j+1)],'#ffffff',{a:.9*f});
      else if(mv==='carry'){const a=maps[j].get(eff[j]),b=maps[j+1].get(eff[j]);if(a&&b)R.poly([foot(eff[j],a),foot(eff[j],b)],'#ffffff',{wave:true,a:.9*f});}}
    const showAll=q('cAll').checked,showAnn=q('cAnn').checked;
    if(showAll){for(let j=0;j<N()-1;j++){if(j===k&&q('cRuns').checked)continue;moves(j,.3);
      if(showAnn&&j!==k)(D.anns[j]||[]).forEach(a=>R.ann(a,{a:.3}));}}
    if(showAnn)(D.anns[k]||[]).forEach(a=>R.ann(a));
    if(q('cRuns').checked&&nxt>=0)moves(k,1);
    const hold=holderAtT(T);
    const all=new Map();D.frames.forEach(f=>f.players.forEach(p=>{if(!all.has(p.id))all.set(p.id,p);}));
    const order=[...all.values()];
    order.filter(p=>p.team==='away').concat(order.filter(p=>p.team!=='away')).forEach(p=>{if(!vis(p))return;
      const pos=posAt(p.id,T);if(!pos)return;const pp=maps[k].get(p.id)||p;
      R.player(pp,pos,{col:colOf(pp),hold:hold!=null&&p.id===hold,showName:q('cName').checked,photo:ttPhotoFor(pp)});});
    const b=ballAt(T);if(b)R.ball(b);
  }
  function updateUI(){
    const k=Math.min(Math.floor(T+1e-6),N()-1);
    q('rT').value=T;
    [...q('steps').children].forEach((c,i)=>{c.className='chip'+(i===k?' on':i<k?' done':'');});
    q('ovStep').textContent=(k===0?'Ausgangslage':'Schritt '+k)+' von '+(N()-1);
    const n=(notes[k]||'').trim();q('ovText').textContent=n||(N()<2?'Dieser Spielzug hat nur eine Aufstellung. Lege in der Taktiktafel weitere Schritte an.':'');
    q('bPlay').textContent=(playing||resumeAt)?'⏸ Pause':(T>=N()-1&&N()>1?'⟲ Nochmal':'▶ Abspielen');
    draw();
  }
  function frame(ts){
    if(!alive)return;
    const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
    if(playing){const prev=Math.floor(T);T+=dt*speed/1.9;
      if(T>=N()-1){T=N()-1;playing=false;}
      else if(Math.floor(T)!==prev&&q('cText').checked&&notes[Math.floor(T)]&&notes[Math.floor(T)].trim()){T=Math.floor(T);holdUntil=ts+1400/speed;playing=false;resumeAt=true;}
      updateUI();}
    else if(resumeAt&&ts>=holdUntil){resumeAt=false;playing=true;T+=0.0001;}
    raf=requestAnimationFrame(frame);
  }
  function step(d){playing=false;resumeAt=false;T=clamp(Math.floor(T+1e-6)+d,0,N()-1);updateUI();}
  q('bPlay').onclick=()=>{if(playing||resumeAt){playing=false;resumeAt=false;}else{if(T>=N()-1)T=0;playing=N()>1;}updateUI();};
  q('bPrev').onclick=()=>step(-1);q('bNext').onclick=()=>step(1);
  q('bRestart').onclick=()=>{resumeAt=false;T=0;playing=N()>1;updateUI();};
  q('sSpeed').onchange=e=>{speed=+e.target.value;};
  q('rT').oninput=e=>{playing=false;resumeAt=false;T=+e.target.value;updateUI();};
  /* Auswahl je Browser merken */
  const OPTS=['cOpp','cAll','cRuns','cText','cAnn','cName'];
  try{const o=JSON.parse(store('ttOpts')||'null');if(o)OPTS.forEach(n=>{if(typeof o[n]==='boolean')q(n).checked=o[n];});}catch(e){}
  function applyText(){const on=q('cText').checked;q('ov').hidden=!on;q('ov').classList.toggle('hidden',!on);}
  applyText();
  OPTS.forEach(n=>q(n).onchange=()=>{const o={};OPTS.forEach(m=>o[m]=q(m).checked);store('ttOpts',JSON.stringify(o));applyText();draw();});
  function onKey(e){
    if(!host.isConnected||host.offsetParent===null||/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||''))return;
    if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
    else if(e.key==='ArrowRight'){e.preventDefault();step(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
    else if(e.key==='r'||e.key==='R')q('bRestart').click();
  }
  function resize(){
    if(!D)return;const w=cv.parentElement.clientWidth||400,dpr=window.devicePixelRatio||1;
    const FW=D.W||TT_FW,FH=D.H||TT_FH;cv.style.height=(w*FH/FW)+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(w*FH/FW*dpr);R.setScale(cv.width/FW);updateUI();
  }
  const onPhoto=()=>{if(D)draw();};TT.photoListeners.push(onPhoto);
  document.addEventListener('keydown',onKey);window.addEventListener('resize',resize);
  let ro=null;try{ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}catch(e){}
  raf=requestAnimationFrame(frame);
  if(opts.data)setData(opts.data);
  return{setData,resize,destroy(){TT.photoListeners=TT.photoListeners.filter(f=>f!==onPhoto);alive=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',onKey);window.removeEventListener('resize',resize);if(ro)ro.disconnect();}};
}

    const roles=TT_ROLES[k]||[],ros=ttRoster(E.age),F=cur();
    const allRoles=new Set(Object.values(TT_ROLES).flat());
    const own=F.players.filter(p=>p.team!=='away').sort((a,b)=>(a.team==='gk'?-1:0)-(b.team==='gk'?-1:0)||(+a.num||99)-(+b.num||99));
    fd.h.forEach((xy,i)=>{let p=own[i];
      if(!p){p={id:nextId(),name:'',num:i+1,team:i===0?'gk':'home'};E.frames.forEach(f=>f.players.push(Object.assign({},p,{x:xy[0],y:xy[1]})));p=findP(F,p.id);}
      p.x=xy[0];p.y=xy[1];if(!p.name||allRoles.has(p.name)||/^S\d+$/.test(p.name)){const nm=ros[p.num]||roles[i]||p.name;E.frames.forEach(f=>{const x=findP(f,p.id);if(x)x.name=nm;});}});
    const opp=F.players.filter(p=>p.team==='away').sort((a,b)=>(+a.num||99)-(+b.num||99));
    (fd.a||[]).forEach((xy,i)=>{if(opp[i]){opp[i].x=xy[0];opp[i].y=xy[1];}});
    renderForms();changed();
  }

  /* ---- Feld-Interaktion ---- */
  function toField(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/r.width*FW(),y:(cy-r.top)/r.height*FH()};}
  function hit(pt){
    const F=cur(),b=ballPos(F);
    if(Math.hypot(b.x-pt.x,b.y-pt.y)<16)return{kind:'ball'};
    for(let i=F.players.length-1;i>=0;i--){const p=F.players[i];if(Math.hypot(p.x-pt.x,p.y-pt.y)<26)return{kind:'player',id:p.id};}
    for(let i=E.items.length-1;i>=0;i--){const it=E.items[i];if(Math.hypot(it.x-pt.x,it.y-pt.y)<(it.kind==='goal'||it.kind==='dummy'?34:22))return{kind:'item',id:it.id};}
    return null;
  }
  function annHit(pt){const L=cur().anns;
    for(let i=L.length-1;i>=0;i--){const a=L[i];
      if(a.type==='zone'){if(pt.x>=a.x-10&&pt.x<=a.x+a.w+10&&pt.y>=a.y-10&&pt.y<=a.y+a.h+10)return i;continue;}
      const dx=a.x2-a.x1,dy=a.y2-a.y1,l2=dx*dx+dy*dy;if(l2<1)continue;
      const t=clamp(((pt.x-a.x1)*dx+(pt.y-a.y1)*dy)/l2,0,1);if(Math.hypot(pt.x-(a.x1+t*dx),pt.y-(a.y1+t*dy))<18)return i;}
    return -1;}
  function eraseAt(pt){
    const ai=annHit(pt);if(ai>=0){push();cur().anns.splice(ai,1);changed();return;}
    const h=hit(pt);if(!h||h.kind==='ball')return;push();
    if(h.kind==='item')E.items=E.items.filter(i=>i.id!==h.id);
    else{const F=cur(),p=findP(F,h.id);E.frames.forEach(f=>{if(f.holder===h.id){const x=findP(f,h.id);f.ball=x?ttFoot(x.team,x):null;f.holder=null;}f.players=f.players.filter(x=>x.id!==h.id);});}
    sel=null;changed();
  }
  function addPlayer(pt,team){push();const F=cur(),id=nextId();
    const n=Math.max(0,...F.players.filter(p=>(p.team==='away')===(team==='away')).map(p=>+p.num||0))+1;
    const np={id,x:pt.x,y:pt.y,name:team==='away'?'G'+n:'',num:n,team};
    E.frames.forEach((f,i)=>{if(i>=cf)f.players.push(Object.assign({},np));});sel={kind:'player',id};changed();}
  const DRAW=['run','pass','dribble','shot','zone'],PLACE=['cone','dummy','pole','goal'];
  function down(pt){
    if(previewOn)return false;
    if(mode==='move'){
      const h=hit(pt);
      if(h){act={kind:'drag',h,start:pt,moved:false};return true;}
      const now=Date.now();
      if(lastTap&&now-lastTap.t<380&&Math.hypot(pt.x-lastTap.x,pt.y-lastTap.y)<40){lastTap=null;addPlayer(clampPt(pt),'home');return true;}
      lastTap={t:now,x:pt.x,y:pt.y};if(sel){sel=null;renderSel();draw();}return false;
    }
    if(DRAW.includes(mode)){let a={x:pt.x,y:pt.y};
      if(mode!=='zone'){const h=hit(pt);if(h&&h.kind==='player'){const p=findP(cur(),h.id);a={x:p.x,y:p.y};}else if(h&&h.kind==='ball')a=ballPos(cur());}
      act={kind:'draw',type:mode,a,b:a};draw();return true;}
    if(PLACE.includes(mode)){act={kind:'place',pt};return true;}
    if(mode==='erase'){eraseAt(pt);return true;}
    return false;
  }
  function move(pt){
    if(!act)return;
    if(act.kind==='drag'){
      if(!act.moved&&Math.hypot(pt.x-act.start.x,pt.y-act.start.y)<5)return;
      if(!act.moved){push();act.moved=true;}
      const c=clampPt(pt),F=cur();
      if(act.h.kind==='player'){const p=findP(F,act.h.id);if(p){p.x=c.x;p.y=c.y;}}
      else if(act.h.kind==='ball'){F.holder=null;F.ball=c;}
      else{const it=E.items.find(i=>i.id===act.h.id);if(it){it.x=c.x;it.y=c.y;}}
      draw();
    }else if(act.kind==='draw'){act.b=pt;draw();}
  }
  function up(pt){
    if(!act)return;const a=act;act=null;
    if(a.kind==='drag'){
      if(!a.moved){sel={kind:a.h.kind,id:a.h.id};renderSel();draw();return;}
      if(a.h.kind==='ball'){const F=cur();let best=null,bd=34;
        F.players.forEach(p=>{const d=Math.hypot(p.x-F.ball.x,p.y-F.ball.y);if(d<bd){bd=d;best=p;}});
        if(best){F.holder=best.id;F.ball=null;}}
      changed();return;
    }
    if(a.kind==='draw'){const b=pt||a.b;
      if(Math.hypot(b.x-a.a.x,b.y-a.a.y)<14){draw();return;}
      push();const ann=a.type==='zone'?{type:'zone',x:Math.min(a.a.x,b.x),y:Math.min(a.a.y,b.y),w:Math.abs(b.x-a.a.x),h:Math.abs(b.y-a.a.y)}
        :{type:a.type,x1:Math.round(a.a.x),y1:Math.round(a.a.y),x2:Math.round(b.x),y2:Math.round(b.y)};
      cur().anns.push(ann);changed();return;}
    if(a.kind==='place'){const p=clampPt(pt||a.pt);push();
      const it={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:mode,x:Math.round(p.x),y:Math.round(p.y),a:mode==='dummy'?0:0};
      if(mode==='cone')it.c=coneCol;E.items.push(it);changed();}
  }
  const tpt=e=>{const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);return t?toField(t.clientX,t.clientY):null;};
  let lastPt=null;
  cv.addEventListener('touchstart',e=>{if(e.touches.length>1){act=null;return;}const p=tpt(e);lastPt=p;if(p&&down(p))e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',e=>{if(!act)return;e.preventDefault();const p=tpt(e);if(p){lastPt=p;move(p);}},{passive:false});
  cv.addEventListener('touchend',e=>{if(!act)return;e.preventDefault();up(tpt(e)||lastPt);},{passive:false});
  cv.addEventListener('touchcancel',()=>{act=null;draw();});
  function mDown(e){if(e.button!==0)return;const p=toField(e.clientX,e.clientY);if(down(p)){e.preventDefault();window.addEventListener('mousemove',mMove);window.addEventListener('mouseup',mUp);}}
  function mMove(e){move(toField(e.clientX,e.clientY));}
  function mUp(e){window.removeEventListener('mousemove',mMove);window.removeEventListener('mouseup',mUp);up(toField(e.clientX,e.clientY));}
  cv.addEventListener('mousedown',mDown);

  /* ---- Zeichnen ---- */
  let raf=0;
  function draw(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint();});}
  function paint(){
    if(!alive||previewOn)return;const F=cur();
    ctx.clearRect(0,0,cv.width,cv.height);R.field(E);
    E.items.forEach(it=>R.item(it,{sel:sel&&sel.kind==='item'&&sel.id===it.id}));
    if(q('cPrev').checked&&cf>0){const P=E.frames[cf-1];
      P.players.forEach(pp=>{const c=findP(F,pp.id);if(!c||Math.hypot(c.x-pp.x,c.y-pp.y)<8)return;
        R.player(pp,pp,{col:colOf(pp),a:.28});R.poly([pp,c],'rgba(255,255,255,.55)',{dash:true,a:.6,w:Math.max(1.4,R.S*2)});});
      const pb=ballPos(P),cb=ballPos(F);if(Math.hypot(pb.x-cb.x,pb.y-cb.y)>8){ctx.save();ctx.globalAlpha=.35;R.ball(pb);ctx.restore();}}
    F.anns.forEach(a=>R.ann(a));
    if(act&&act.kind==='draw'){const a=act.a,b=act.b;
      if(act.type==='zone')R.ann({type:'zone',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)});
      else R.ann({type:act.type,x1:a.x,y1:a.y,x2:b.x,y2:b.y},{a:.8});}
    const own=F.players.filter(p=>p.team!=='away'),opp=F.players.filter(p=>p.team==='away');
    opp.concat(own).forEach(p=>R.player(p,p,{col:colOf(p),hold:F.holder===p.id,sel:sel&&sel.kind==='player'&&sel.id===p.id,showName:q('cName').checked,photo:ttPhotoFor(p)}));
    R.ball(ballPos(F),{sel:sel&&sel.kind==='ball'});
  }
  function resize(){const w=cv.parentElement.clientWidth||400,dpr=window.devicePixelRatio||1;
    cv.style.height=(w*FH()/FW())+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(w*FH()/FW()*dpr);R.setScale(cv.width/FW());paint();}

  /* ---- Schritte, Rückgängig, Vorschau ---- */
  q('bAddStep').onclick=()=>{push();const F=cur();
    E.frames.splice(cf+1,0,{players:ttClone(F.players),ball:F.ball?{x:F.ball.x,y:F.ball.y}:null,holder:F.holder,anns:[],note:''});cf++;sel=null;changed();};
  q('bDelStep').onclick=()=>{if(E.frames.length<2)return;push();E.frames.splice(cf,1);cf=Math.min(cf,E.frames.length-1);sel=null;changed();};
  q('bUndo').onclick=doUndo;
  function doUndo(){const s=undo.pop();if(!s)return;try{const o=JSON.parse(s);E=o.E;cf=Math.min(o.cf,E.frames.length-1);}catch(e){}sel=null;renderAges();renderForms();renderCols();changed();}
  q('note').addEventListener('input',e=>{cur().note=e.target.value;saveDraft();});
  q('bPreview').onclick=()=>{previewOn=!previewOn;
    q('editWrap').hidden=previewOn;q('tools').hidden=previewOn;q('hint').hidden=previewOn;q('coneRow').hidden=previewOn||mode!=='cone';q('preview').hidden=!previewOn;
    q('bPreview').textContent=previewOn?'✏️ Zurück zum Bearbeiten':'▶ Vorschau';
    if(previewOn){if(!pv)pv=ttPlayer(q('preview'));pv.setData(ttNormalize(ttClone(E)));sel=null;renderSel();}
    else{resize();}};
  q('cPrev').onchange=draw;q('cName').onchange=draw;
  q('bAddHome').onclick=()=>addPlayer(clampPt({x:FW()/2,y:FH()*.69}),'home');
  q('bAddAway').onclick=()=>addPlayer(clampPt({x:FW()/2,y:FH()*.33}),'away');
  q('bTogOpp').onclick=()=>{push();const any=E.frames.some(f=>f.players.some(p=>p.team==='away'));
    if(any)E.frames.forEach(f=>{f.players=f.players.filter(p=>p.team!=='away');if(f.holder!=null&&!findP(f,f.holder)){f.holder=null;}});
    else{const fd=TT_AC[E.age].f[E.form]||Object.values(TT_AC[E.age].f)[0];let id=nextId();
      const add=(fd.a||[]).map((xy,i)=>({id:id++,x:xy[0],y:xy[1],name:'G'+(i+1),num:i+1,team:'away'}));E.frames.forEach(f=>add.forEach(p=>f.players.push(Object.assign({},p))));}
    sel=null;changed();};
  q('bResetForm').onclick=()=>applyForm(E.form);
  q('bClearAnn').onclick=()=>{if(!cur().anns.length)return;push();cur().anns=[];changed();};

  /* ---- Speichern ---- */
  const smsg=t=>{q('saveMsg').textContent=t||'';};
  async function save(asNew){
    const name=q('name').value.trim()||'Spielzug',desc=q('desc').value.trim();
    const ex=pid&&!asNew?TT.plays.find(p=>p.id===pid):null;
    const cg=catF.get();
    const doc={name,desc,cat:cg.cat,group:cg.group,data:JSON.stringify(E),frames:E.frames.length,age:E.age,form:E.form,fmt:3,updated:Date.now(),created:ex&&ex.created?ex.created:Date.now()};
    if(ex)doc.id=pid;
    smsg('Speichere …');q('bSave').disabled=true;
    try{const id=await ttSave(doc);pid=id;q('name').value=name;smsg('Gespeichert als „'+name+'“ unter '+ttCatLabel(cg.cat)+' › '+cg.group+'.');saveDraft();renderSteps();}
    catch(e){smsg(ttErr('Speichern',e));}
    q('bSave').disabled=false;
  }
  q('bSave').onclick=()=>save(false);
  q('bSaveNew').onclick=()=>save(true);
  q('bView').onclick=()=>{if(pid)openExercise('tt-'+pid);};
  q('bCopy').onclick=()=>{const txt=JSON.stringify(E),box=q('copyBox');
    const show=()=>{box.hidden=false;box.value=txt;box.focus();box.select();smsg('Text markiert – jetzt kopieren und z. B. per WhatsApp schicken. Einfügen unter Taktiktafel › Importieren.');};
    try{navigator.clipboard.writeText(txt).then(()=>smsg('Spielzug als Text kopiert. Einfügen unter Taktiktafel › Importieren.'),show);}catch(e){show();}};
  q('bNew').onclick=()=>{q('newConfirm').hidden=false;};
  q('newNo').onclick=()=>{q('newConfirm').hidden=true;};
  q('newYes').onclick=()=>{push();E=ttFresh(E.age,E.form,{hCol:E.hCol,aCol:E.aCol,gCol:E.gCol,items:[]});pid=null;cf=0;sel=null;
    q('name').value='';q('desc').value='';catF.set('game','');q('newConfirm').hidden=true;smsg('');renderAges();renderForms();changed();};
  ['name','desc'].forEach(n=>q(n).addEventListener('input',saveDraft));

  function onKey(e){
    if(!root.isConnected||previewOn)return;const tag=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo();}
    else if((e.key==='Delete'||e.key==='Backspace')&&sel&&sel.kind!=='ball'){e.preventDefault();
      if(sel.kind==='item'){push();E.items=E.items.filter(i=>i.id!==sel.id);}
      else{push();const id=sel.id;E.frames.forEach(f=>{if(f.holder===id){const x=findP(f,id);f.ball=x?ttFoot(x.team,x):null;f.holder=null;}f.players=f.players.filter(x=>x.id!==id);});}
      sel=null;changed();}
    else if(e.key==='Escape'){act=null;sel=null;changed();}
  }
  function onList(){q('store').textContent=ttStorageNote();renderTeams();if(catF)catF.refresh();if(pid&&!TT.plays.some(p=>p.id===pid)&&TT.mode!=='init'){pid=null;renderSteps();}}
  document.addEventListener('keydown',onKey);window.addEventListener('resize',resize);
  let ro=null;try{ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}catch(e){}
  TT.listeners.push(onList);TT.photoListeners.push(draw);
  catF=ttCatFields(q('catHost'),initCat.cat,initCat.group,saveDraft);
  if(TT.dupNote){q('saveMsg').textContent=TT.dupNote;TT.dupNote=null;}
  renderAges();renderForms();renderTools();renderConeCols();renderCols();syncPitch();renderTeams();renderSteps();renderSel();resize();
  return function destroy(){alive=false;clearTimeout(draftT);store('ttDraft',JSON.stringify(Object.assign({E,pid,cf,name:q('name').value,desc:q('desc').value},catF?catF.get():initCat)));
    TT.listeners=TT.listeners.filter(f=>f!==onList);TT.photoListeners=TT.photoListeners.filter(f=>f!==draw);document.removeEventListener('keydown',onKey);window.removeEventListener('resize',resize);
    window.removeEventListener('mousemove',mMove);window.removeEventListener('mouseup',mUp);if(ro)ro.disconnect();if(pv)pv.destroy();};
}

/* ---------- Ansicht: Import ---------- */
function mountTTImport(root){
  root.className='pam tt';
  root.innerHTML=`
  <h2>Spielzug importieren</h2>
  <p class="sub">Text aus der alten Taktiktafel („Teilen“) oder aus „Als Text kopieren“ hier einfügen oder die Datei wählen, kurz prüfen und speichern.</p>
  <div class="ttform">
    <label class="ttfield" for="ttJson">Spielzug-Text (JSON)</label>
    <textarea id="ttJson" data-r="json" spellcheck="false" placeholder='{"v":2,"age":"U14","form":"4-3-3","frames":[[…]], …}'></textarea>
    <div class="bar">
      <label class="filebtn">📄 Datei wählen<input type="file" data-r="file" accept=".json,.txt,application/json,text/plain"></label>
      <button data-r="bClear">Leeren</button>
    </div>
    <div class="ttmsg" data-r="msg" hidden></div>
    <div data-r="meta" hidden>
      <div class="ttgrid">
        <div><label class="ttfield" for="ttName">Name</label><input id="ttName" data-r="name" type="text" maxlength="60" placeholder="z. B. Zug D · Spielaufbau links"></div>
        <div><label class="ttfield" for="ttDesc">Kurzbeschreibung</label><input id="ttDesc" data-r="desc" type="text" maxlength="120" placeholder="z. B. IV andribbeln, Steil auf LA"></div>
      </div>
      <div data-r="catHost"></div>
      <div class="bar"><button class="primary" data-r="bSave">💾 Speichern</button><button data-r="bEdit">✏️ In der Taktiktafel öffnen</button><span class="ttnote" data-r="saveMsg"></span></div>
      <h3 class="tth">Vorschau</h3>
      <div data-r="player"></div>
    </div>
  </div>
  <h3 class="tth">Gespeicherte Spielzüge</h3>
  <div class="cards" data-r="list"></div>
  <p class="ttnote" data-r="store"></p>`;
  const q=n=>root.querySelector('[data-r="'+n+'"]');
  let M=null,player=null,to=0;const catF=ttCatFields(q('catHost'),'game','');
  function msg(t,kind){const m=q('msg');m.hidden=!t;m.textContent=t||'';m.className='ttmsg'+(kind?' '+kind:'');}
  function handle(txt){
    if(!txt.trim()){M=null;msg('');q('meta').hidden=true;return;}
    try{M=ttParse(txt);}catch(e){M=null;q('meta').hidden=true;msg(e.message,'err');return;}
    const nf=M.frames.length,np=M.frames[0].players.length;
    msg('Erkannt: '+[M.age,M.form&&('System '+M.form)].filter(Boolean).join(' · ')+(M.age||M.form?' · ':'')+np+' Spieler · '+(nf>1?(nf-1)+' Schritte':'nur Ausgangslage')+(M.v===2?' · Ball wird dem Spieler am Ball zugeordnet':''),'ok');
    q('meta').hidden=false;
    if(!q('name').value)q('name').value=[M.age,M.form].filter(Boolean).join(' ')+' · Spielzug '+(TT.plays.length+1);
    if(!player)player=ttPlayer(q('player'));player.setData(M);
  }
  q('json').addEventListener('input',e=>{clearTimeout(to);to=setTimeout(()=>handle(e.target.value),250);});
  q('file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{q('json').value=String(r.result||'');handle(q('json').value);};r.onerror=()=>msg('Die Datei konnte nicht gelesen werden.','err');r.readAsText(f);e.target.value='';};
  q('bClear').onclick=()=>{q('json').value='';q('name').value='';q('desc').value='';handle('');};
  const v3=()=>M.v===3?JSON.parse(q('json').value.trim()):ttToV3(M);
  q('bSave').onclick=async()=>{
    if(!M)return;const b=q('bSave');b.disabled=true;q('saveMsg').textContent='Speichere …';
    try{const E=v3();const cg=catF.get();const id=await ttSave({name:q('name').value.trim()||'Spielzug',desc:q('desc').value.trim(),cat:cg.cat,group:cg.group,data:JSON.stringify(E),
        frames:E.frames.length,age:E.age,form:E.form,fmt:3,created:Date.now(),updated:Date.now()});
      TT.pending='tt-'+id;ttSyncExercises();}
    catch(e){q('saveMsg').textContent=ttErr('Speichern',e);}
    b.disabled=false;
  };
  q('bEdit').onclick=()=>{if(!M)return;try{const E=v3();store('ttDraft',JSON.stringify(Object.assign({E,pid:null,cf:0,name:q('name').value,desc:q('desc').value},catF.get())));openExercise('tt-editor');}
    catch(e){q('saveMsg').textContent='Konnte nicht geöffnet werden: '+e.message;}};
  function renderList(){
    const el=q('list');el.innerHTML='';
    if(!TT.plays.length)el.innerHTML='<div class="ttempty">Noch keine Spielzüge gespeichert. Zeichne einen in der Taktiktafel oder füge oben einen Text ein.</div>';
    TT.plays.forEach(p=>{const c=document.createElement('div');c.className='card ttcard';
      c.innerHTML='<div class="ic">'+TT_PLAY_ICON+'</div><div class="ttcbody"><b>'+ttEsc(p.name||'Spielzug')+'</b><span>'+ttEsc(p.desc||ttSteps(p))+'</span><span class="ttcat">'+ttEsc(ttCatLabel(ttCatOf(p))+' › '+ttGroupOf(p))+'</span>'+
        '<div class="ttconfirm" hidden>Spielzug löschen? <button class="ttyes">Ja, löschen</button><button class="ttno">Abbrechen</button></div></div>'+
        '<button class="ttdup" title="Duplizieren und bearbeiten" aria-label="Spielzug duplizieren">⧉</button><button class="ttdel" title="Spielzug löschen" aria-label="Spielzug löschen">🗑</button>';
      const cf=c.querySelector('.ttconfirm');
      c.onclick=()=>openExercise('tt-'+p.id);
      c.querySelector('.ttdel').onclick=e=>{e.stopPropagation();cf.hidden=false;};
      c.querySelector('.ttdup').onclick=e=>{e.stopPropagation();ttDuplicate({pid:p.id},t=>{q('store').textContent=t;});};

/* =====================================================================
   DUPLIZIEREN (Idee 11)
   Gespeicherte Spielzüge und die fest eingebauten Züge A–C als neuen,
   bearbeitbaren Spielzug kopieren und direkt in der Taktiktafel öffnen.
   ===================================================================== */
function ttCopyName(name){
  const base=String(name||'Spielzug').replace(/\s*\(Kopie(?: \d+)?\)$/,'');
  const names=new Set(TT.plays.map(p=>p.name));
  let n=base+' (Kopie)',i=2;while(names.has(n))n=base+' (Kopie '+(i++)+')';
  return n;
}
/* Eingebauten Spielzug (SPZ_VARIANTS) in das Taktiktafel-Format v3 umrechnen.
   Feld 45 × 64 m (Linien 1–44 / 2–62) → Taktiktafel 600 × 900 (Linien 30–570 / 30–870). */
function ttFromSpielzug(vk){
  const V=SPZ_VARIANTS[vk];if(!V)throw new Error('Spielzug '+vk+' nicht gefunden.');
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
  const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}),len=v=>Math.hypot(v.x,v.y);
  const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
  const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
  const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
  const quad=(a,k,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*k.x+t*t*b.x,y:u*u*a.y+2*u*t*k.y+t*t*b.y}};
  const cub=(a,c1,c2,b,t)=>{const u=1-t;return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}};
  const ACT=Object.assign({},V.own,V.opp),isOpp=k=>k in V.opp;
  const runs=[];
  V.runs.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1},o||{})));
  V.carries.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1,carry:1},o||{})));
  runs.sort((a,b)=>a.t0-b.t0);
  {const cur={};Object.keys(ACT).forEach(k=>cur[k]=ACT[k]);runs.forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
  const runPt=(r,t)=>r.c1?cub(r.from,r.c1,r.c2,r.to,t):r.k?quad(r.from,r.k,r.to,t):lp(r.from,r.to,t);
  function actorPos(k,T){let p=ACT[k];
    for(const r of runs){if(r.w!==k)continue;if(T<=r.t0)break;if(T<r.t1)return runPt(r,ease(seg(T,r.t0,r.t1)));p=r.to;}return p;}
  const passes=V.passes.map(([f,to,t0,t1,lbl,o])=>{const pt=typeof to!=='string',a=actorPos(f,t0),b=pt?to:actorPos(to,t1);
    return Object.assign({type:'pass',f,to:pt?null:to,t0,t1,lbl,a,b,s:add(a,norm(sub(b,a)),.8),e:pt?b:add(b,norm(sub(a,b)),.9)},o||{});});
  const events=passes.concat(runs.filter(r=>r.carry).map(r=>({type:'carry',w:r.w,t0:r.t0,t1:r.t1}))).sort((a,b)=>a.t0-b.t0);
  function holderAt(T){let h='TW';for(const ev of events){if(T<ev.t0)break;if(ev.type==='pass')h=T>=ev.t1?ev.to:null;else if(T<=ev.t1||h===ev.w)h=ev.w;}return h;}
  function ballAt(T){const done=passes.filter(p=>T>=p.t1).pop(),fly=passes.find(p=>T>=p.t0&&T<p.t1);
    if(fly)return lp(fly.s,fly.e,seg(T,fly.t0,fly.t1));return done?done.e:V.ball;}
  const X=x=>Math.round(30+(x-1)/43*540),Y=y=>Math.round(30+(y-2)/60*840),P=p=>({x:X(p.x),y:Y(p.y)});
  const LBL={TW:'TW',IL:'IL',IR:'IR',LV:'LV',RV:'RV',Z6:'6er',Z8:'8er',S1:'S1',S2:'S2'};
  const NUM={TW:1,LV:2,IL:3,IR:4,RV:5,Z6:6,Z8:8,S1:9,S2:10};
  const keys=Object.keys(ACT),ids={};keys.forEach((k,i)=>ids[k]=i+1);
  let gn=0;const meta={};keys.forEach(k=>{if(isOpp(k)){gn++;meta[k]={name:k==='GT'?'GT':'G'+gn,num:k==='GT'?'':gn,team:'away'};}
    else meta[k]={name:LBL[k]||k,num:NUM[k]||'',team:k==='TW'?'gk':'home'};});
  const PH=V.ph,n=PH.length;
  const times=PH.map((p,i)=>i===0?0:Math.max(0,p.t-.02)).concat([V.TEND]);
  const frames=times.map((T,i)=>{
    let h=holderAt(T);
    if(!h){const fly=passes.find(p=>T>=p.t0&&T<p.t1&&p.to&&p.t1-T<.15);if(fly)h=fly.to;}
    const players=keys.map(k=>Object.assign({id:ids[k]},P(actorPos(k,T)),meta[k]));
    /* Wege, die im folgenden Abschnitt passieren, als Zeichnung */
    const anns=[];
    if(i<times.length-1){const t0=T,t1=times[i+1];
      passes.filter(p=>p.t0>=t0-.03&&p.t0<t1).forEach(p=>{const a=P(p.a),b=P(p.to?actorPos(p.to,p.t1):p.b);
        anns.push({type:p.shot?'shot':'pass',x1:a.x,y1:a.y,x2:b.x,y2:b.y});});
      runs.filter(r=>!isOpp(r.w)&&r.t0>=t0-.03&&r.t0<t1).forEach(r=>{const a=P(r.from),b=P(r.to);
        if(Math.hypot(b.x-a.x,b.y-a.y)>12)anns.push({type:r.carry?'dribble':'run',x1:a.x,y1:a.y,x2:b.x,y2:b.y});});}
    const ph=PH[Math.min(i,n-1)];
    return{players,ball:h?null:P(ballAt(T)),holder:h?ids[h]:null,anns,note:ph.title+': '+ph.text};
  });
  return{v:3,age:'U13',form:'4-2-2',hCol:'#c8ef4a',aCol:'#e5484d',gCol:'#c8ef4a',items:[],frames};
}
/* Kopie speichern und im Editor öffnen */
async function ttDuplicate(src,onMsg){
  const msg=t=>{if(onMsg)onMsg(t);};
  try{
    let doc;
    if(src.export){
      const E=src.export;
      doc={name:ttCopyName(src.name),desc:src.desc||'',cat:src.cat||'tt',group:src.group||'',data:JSON.stringify(E),frames:E.frames.length,age:E.age,form:E.form,fmt:3};
    }else if(src.builtin){
      const V=SPZ_VARIANTS[src.builtin],E=ttFromSpielzug(src.builtin);
      doc={name:ttCopyName(V.name),desc:'Kopie des eingebauten '+V.name.split(' · ')[0],cat:'game',group:'Spielzüge 8+1 · Abstoß',
        data:JSON.stringify(E),frames:E.frames.length,age:E.age,form:E.form,fmt:3};
    }else{
      const p=TT.plays.find(x=>x.id===src.pid);if(!p)throw new Error('Spielzug nicht gefunden.');
      let data=p.data;
      try{const raw=JSON.parse(p.data);if(!(raw&&raw.v===3))data=JSON.stringify(ttToV3(ttNormalize(raw),String(p.notes||'').split('\n'),p.holders));}catch(e){}
      doc={name:ttCopyName(p.name),desc:p.desc||'',cat:ttCatOf(p),group:ttGroupOf(p),data,frames:p.frames,age:p.age,form:p.form,fmt:3};
    }
    doc.created=Date.now();doc.updated=Date.now();
    msg('Kopie wird angelegt …');
    const id=await ttSave(doc);
    TT.editPid=id;TT.dupNote='Kopie „'+doc.name+'“ angelegt. Ändere sie hier und speichere – das Original bleibt unverändert.';
    const go=()=>{if(TT.plays.some(p=>p.id===id)){openExercise('tt-editor');return true;}return false;};
    if(!go()){let n=0;const iv=setInterval(()=>{if(go()||++n>40){clearInterval(iv);if(n>40)openExercise('tt-editor');}},100);}
  }catch(e){msg(ttErr('Duplizieren',e));}
}

/* ---------- Übungen allgemein (Erweiterung von Idee 11) ----------
   Jede Übung liefert über root._export() ihren Ablauf in Metern; ttMk rechnet ihn
   in eine Trainingsfläche der Taktiktafel um (Breite 600, Höhe nach Seitenverhältnis). */
function ttMk(o){
  const sc=600/o.Wm,H=Math.round(o.Hm*sc),R=v=>Math.round(v*sc*10)/10,P=p=>({x:R(p.x),y:R(p.y)});
  const ids={};o.actors.forEach((a,i)=>ids[a.k]=i+1);
  const near=(o.holderNear||1.7);
  const frames=o.times.map((T,i)=>{
    const players=[];const pos={};
    o.actors.forEach((a,j)=>{const p=o.pos(a.k,T);if(!p)return;pos[a.k]=p;
      players.push({id:j+1,x:R(p.x),y:R(p.y),name:a.name==null?'':a.name,num:a.num==null?'':a.num,team:a.team||'home'});});
    const b=o.ball?o.ball(T):null;
    let h=o.holder?o.holder(T):undefined;
    if(h===undefined){h=null;if(b){let bd=near;Object.keys(pos).forEach(k=>{const d=Math.hypot(pos[k].x-b.x,pos[k].y-b.y);if(d<bd){bd=d;h=k;}});}}
    if(h!=null&&!pos[h])h=null;
    const anns=(o.anns?o.anns(i,T):[]).map(a=>a.type==='zone'?{type:'zone',x:R(a.x),y:R(a.y),w:R(a.w),h:R(a.h)}:{type:a.type,x1:R(a.x1),y1:R(a.y1),x2:R(a.x2),y2:R(a.y2)});
    return{players,ball:h==null&&b?P(b):null,holder:h==null?null:ids[h],anns,note:(o.notes&&o.notes[i])||''};
  });
  const lines=(o.lines||[]).map(l=>{const c=Object.assign({},l);['x','y','w','h','x1','y1','x2','y2','r'].forEach(k=>{if(c[k]!=null)c[k]=R(c[k]);});return c;});
  const items=(o.items||[]).map((it,i)=>{const c=Object.assign({id:'i'+i},it,P(it));if(it.w!=null)c.w=R(it.w);if(it.d!=null)c.d=R(it.d);return c;});
  return{v:3,age:'U13',form:'',hCol:o.hCol||'#c8ef4a',aCol:o.aCol||'#e5484d',gCol:o.gCol||'#7b3fe4',W:600,H,pitch:'none',lines,items,frames};
}
/* Knopf „Duplizieren & bearbeiten“ in jeder Übung, die einen Export kennt */
function ttAddDupButton(root,ex){
  if(!root||typeof root._export!=='function'||ex.ttPlay||ex.tab==='tt')return;
  const bar=document.createElement('div');bar.className='bar ttdupbar';
  bar.innerHTML='<button type="button">⧉ Duplizieren &amp; bearbeiten</button><span class="ttdupmsg">Kopie in der Taktiktafel – das Original bleibt unverändert.</span>';

/* =====================================================================
   EINHEITLICHE ANZEIGE-OPTIONEN für die eingebauten Übungen
   Gleiche Leiste und gleiche gespeicherte Auswahl („ttOpts“) wie bei
   den eigenen Übungen. Nicht vorhandene Optionen sind ausgegraut.
   ===================================================================== */
const EX_OPTS=[['opp','cOpp','Gegner'],['all','cAll','Gesamtablauf vorab zeigen'],['runs','cRuns','Wege vorab zeigen'],
  ['text','cText','Text'],['ann','cAnn','Zeichnungen'],['names','cName','Namen statt Nummern']];
const EX_OPT_TIPS={all:'Alle Wege der ganzen Übung blass im Hintergrund',runs:'Die Wege der aktuellen und der nächsten Aktion',
  ann:'Beschriftungen und Hinweise im Feld',names:'Positionsnamen statt Rückennummern'};
function exOptsHTML(){
  return '<div class="bar exopts" data-r="exopts">'+EX_OPTS.map(([k,,l])=>
    '<label data-ol="'+k+'"'+(EX_OPT_TIPS[k]?' title="'+EX_OPT_TIPS[k]+'"':'')+'><input type="checkbox" data-o="'+k+'"> '+l+'</label>').join('')+'</div>';
}
function exOptsLoad(){let o=null;try{o=JSON.parse(store('ttOpts')||'null');}catch(e){}
  const st={};EX_OPTS.forEach(([k,c])=>st[k]=o&&typeof o[c]==='boolean'?o[c]:(k!=='names'));return st;}
function exOpts(root,avail,apply){
  const st=exOptsLoad();
  EX_OPTS.forEach(([k,c,l])=>{const inp=root.querySelector('[data-o="'+k+'"]'),lab=root.querySelector('[data-ol="'+k+'"]');if(!inp)return;
    const on=avail.includes(k);inp.disabled=!on;inp.checked=on&&st[k];
    if(!on){lab.classList.add('off');lab.title=l+' – in dieser Übung nicht vorhanden';}
    inp.onchange=()=>{st[k]=inp.checked;let o={};try{o=JSON.parse(store('ttOpts')||'{}')||{};}catch(e){}
      o[c]=inp.checked;store('ttOpts',JSON.stringify(o));apply(cur());};});
  const cur=()=>{const r={};EX_OPTS.forEach(([k])=>r[k]=avail.includes(k)&&st[k]);return r;};
  apply(cur());return cur;
}

TT.teams=[];TT.photoListeners=[];
const TT_IMG=new Map();
function ttImg(src){

function ttTeamPlayer(tp){

const ttByNum=(a,b)=>(+a.num||99)-(+b.num||99)||String(a.name).localeCompare(String(b.name));

/* ---------- Speicher ---------- */
function ttTeamsNotify(){TT.listeners.slice().forEach(f=>{try{f()}catch(e){}});TT.photoListeners.slice().forEach(f=>{try{f()}catch(e){}});}
async function ttSaveTeam(t){
  t=Object.assign({},t);const id=t.id||('t'+Date.now().toString(36));delete t.id;t.updated=Date.now();
  if(TT.mode==='db')await TT.db.collection('teams').doc(id).set(t);
  else if(TT.mode==='gh')await ghSaveItem('teams',id,t);
  else{const i=TT.teams.findIndex(x=>x.id===id),rec=Object.assign({id},t);if(i>=0)TT.teams[i]=rec;else TT.teams.push(rec);
    store('ttTeams',JSON.stringify(TT.teams));ttTeamsNotify();}
  return id;
}
async function ttRemoveTeam(id){
  if(TT.mode==='db')await TT.db.collection('teams').doc(id).delete();
  else if(TT.mode==='gh')await ghRemoveItem('teams',id);
  else{TT.teams=TT.teams.filter(t=>t.id!==id);store('ttTeams',JSON.stringify(TT.teams));ttTeamsNotify();}

function ttTeamsInit(){

      TT.teams=s.docs.map(x=>Object.assign({id:x.id},x.data()||{})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));ttTeamsNotify();},()=>{});return;}catch(e){}}
  try{TT.teams=JSON.parse(store('ttTeams')||'[]')||[];}catch(e){TT.teams=[];}ttTeamsNotify();
}
/* Foto verkleinern (96 × 96, quadratisch zugeschnitten) */
function ttPhotoFromFile(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Datei nicht lesbar'));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Kein Bild'));im.onload=()=>{
      const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=96;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);res(c.toDataURL('image/jpeg',.82));};im.src=r.result;};
    r.readAsDataURL(file);});
}

/* ---------- Ansicht: Mannschaften ---------- */
function mountTTTeams(root){

/* =====================================================================
   GEMEINSAMER SPEICHER AUF GITHUB (Idee 15)
   Ohne Claude-Datenbank (z. B. auf GitHub Pages) liegen Spielzüge und
   Kader als JSON im Repository: data/plays.json, data/teams.json.
   Lesen: für alle. Schreiben: mit persönlichem GitHub-Zugang (Token),
   der nur im Browser des Trainers gespeichert wird.
   ===================================================================== */
const GH={cfg:null,sha:{},timer:0,lastErr:'',listeners:[]};
const GH_FILES={plays:'data/plays.json',teams:'data/teams.json'};
function ghDetect(){
  try{const m=/^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);
    if(m){const seg=location.pathname.split('/').filter(Boolean)[0];return{owner:m[1],repo:seg&&!/\.html?$/i.test(seg)?seg:m[1]+'.github.io'};}}catch(e){}
  return null;
}
function ghCfgLoad(){
  let c=null;try{c=JSON.parse(store('ttGh')||'null');}catch(e){}
  const d=ghDetect();if(!c&&!d)return null;
  c=Object.assign({branch:'main',token:''},d||{},c||{});
  return c.owner&&c.repo?c:null;
}
const ghCanWrite=()=>!!(GH.cfg&&GH.cfg.token);
function ghStatus(){GH.listeners.slice().forEach(f=>{try{f()}catch(e){}});}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b64){const s=atob(String(b64||'').replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);}
async function ghApi(path,opt={},cfg){
  const c=cfg||GH.cfg,h={'Accept':'application/vnd.github+json'};
  if(c.token)h.Authorization='Bearer '+c.token;if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'});
}
function ghErr(r){
  if(r.status===401)return new Error('GitHub-Zugang ungültig oder abgelaufen.');
  if(r.status===403||r.status===429)return new Error(r.headers&&r.headers.get('x-ratelimit-remaining')==='0'
    ?'GitHub-Abfragegrenze erreicht – bitte später erneut versuchen oder einen Zugang eintragen.':'Keine Schreibrechte für dieses Repository.');
  if(r.status===404)return new Error('Repository oder Datei nicht gefunden.');
  return new Error('GitHub-Fehler '+r.status+'.');
}
async function ghGet(kind){
  const r=await ghApi('/contents/'+GH_FILES[kind]+'?ref='+encodeURIComponent(GH.cfg.branch||'main'));
  if(r.status===404)return{list:[],sha:null};
  if(!r.ok)throw ghErr(r);
  const j=await r.json();let list=[];
  if(j.content)list=JSON.parse(b64dec(j.content));
  else if(j.download_url){const d=await fetch(j.download_url,{cache:'no-store'});list=await d.json();}
  return{list:Array.isArray(list)?list:[],sha:j.sha};
}
async function ghPut(kind,list,sha,msg){
  const body={message:msg,content:b64enc(JSON.stringify(list,null,1)+'\n'),branch:GH.cfg.branch||'main'};if(sha)body.sha=sha;
  const r=await ghApi('/contents/'+GH_FILES[kind],{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return null;   /* inzwischen geändert → neu laden und erneut versuchen */
  if(!r.ok)throw ghErr(r);
  return (await r.json()).content.sha;
}
function ghApply(kind,list){
  if(kind==='plays'){TT.plays=list.slice().sort((a,b)=>(a.created||0)-(b.created||0));ttNotify();}
  else{TT.teams=list.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)));ttTeamsNotify();}
}
async function ghUpdate(kind,mut,msg){
  if(!ghCanWrite())throw new Error('Nur lesen – zum Speichern unter „☁ Speicher“ einen GitHub-Zugang eintragen.');
  for(let i=0;i<4;i++){
    const {list,sha}=await ghGet(kind);const nl=mut(list.slice());
    const ns=await ghPut(kind,nl,sha,msg);
    if(ns){GH.sha[kind]=ns;GH.lastErr='';ghApply(kind,nl);ghStatus();return;}
    await new Promise(r=>setTimeout(r,500*(i+1)));
  }
  throw new Error('Gleichzeitig hat jemand anderes gespeichert – bitte noch einmal versuchen.');
}
const ghLabel=kind=>kind==='plays'?'Spielzug':'Mannschaft';
function ghSaveItem(kind,id,rec){return ghUpdate(kind,l=>{const i=l.findIndex(x=>x.id===id),r=Object.assign({id},rec);if(i>=0)l[i]=r;else l.push(r);return l;},
  ghLabel(kind)+' „'+(rec.name||id)+'“ gespeichert');}
function ghRemoveItem(kind,id){return ghUpdate(kind,l=>l.filter(x=>x.id!==id),ghLabel(kind)+' '+id+' gelöscht');}
async function ghRefresh(){
  if(TT.mode!=='gh')return;
  try{for(const kind of ['teams','plays']){const {list,sha}=await ghGet(kind);if(sha!==GH.sha[kind]||sha===null&&!GH.loaded){GH.sha[kind]=sha;ghApply(kind,list);}}
    GH.loaded=true;GH.lastErr='';}
  catch(e){GH.lastErr=e.message||String(e);}
  ghStatus();ttNotify();
}
function ghStart(cfg){
  GH.cfg=cfg;GH.sha={};GH.loaded=false;TT.mode='gh';clearInterval(GH.timer);
  GH.timer=setInterval(()=>{if(document.visibilityState==='visible')ghRefresh();},ghCanWrite()?30000:120000);
  ghRefresh();
}
function ghInit(){const c=ghCfgLoad();if(!c)return false;ghStart(c);return true;}
try{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TT.mode==='gh')ghRefresh();});}catch(e){}

    g('state').textContent=!on?'Nicht verbunden – Daten liegen nur in diesem Browser.'
      :(GH.cfg.owner+'/'+GH.cfg.repo+' · '+(w?'lesen und speichern':'nur lesen')+(GH.lastErr?' · '+GH.lastErr:''));
    g('state').className='ghstate'+(GH.lastErr?' err':on?' ok':'');
  }
  GH.listeners.push(update);TT.listeners.push(update);
  let back=null;
  function open(){back=document.activeElement;fill();update();msg('');ov.hidden=false;ov.querySelector('[data-x]').focus();}
  function close(){ov.hidden=true;if(back&&back.focus)back.focus();}
  btn.onclick=open;ov.querySelector('[data-x]').onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close();});
  document.addEventListener('keydown',e=>{if(!ov.hidden&&e.key==='Escape'){e.stopPropagation();close();}},true);
  g('save').onclick=async()=>{
    const rp=ov.querySelector('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').split('/');
    if(rp.length<2||!rp[0]||!rp[1]){msg('Bitte Repository als „Besitzer/Name“ eintragen, z. B. golfsburg/FCPF.');return;}
    const cfg={owner:rp[0],repo:rp[1],branch:ov.querySelector('#ghBranch').value.trim()||'main',token:ov.querySelector('#ghToken').value.trim()};
    msg('Verbinde …');
    try{const r=await ghApi('',{},cfg);if(!r.ok)throw ghErr(r);const j=await r.json();
      if(cfg.token&&!(j.permissions&&j.permissions.push)){msg('Der Zugang hat keine Schreibrechte für '+j.full_name+'. Bitte bei „Contents“ „Read and write“ wählen.');return;}
      store('ttGh',JSON.stringify(cfg));ghStart(cfg);
      msg(cfg.token?'Verbunden – du kannst jetzt speichern.':'Verbunden – nur lesen.');}
    catch(e){msg('Verbindung fehlgeschlagen: '+(e.message||e));}
  };
  g('reload').onclick=async()=>{if(TT.mode!=='gh'){msg('Zuerst verbinden.');return;}msg('Lade …');await ghRefresh();msg(GH.lastErr?'Fehler: '+GH.lastErr:'Aktuell.');};
  g('forget').onclick=()=>{const c=Object.assign({},GH.cfg||ghCfgLoad()||{});c.token='';
    if(c.owner){store('ttGh',JSON.stringify(c));ghStart(c);}ov.querySelector('#ghToken').value='';msg('Zugang entfernt – nur noch lesen.');update();};
  update();
})();

/* Speicher erst verbinden, wenn alle Funktionen definiert sind */
ttInit();

/* ===================== Start ===================== */
(function init(){
  try{
  let fromHash='';try{fromHash=location.hash.slice(1);}catch(e){}
  const want=EXERCISES.some(e=>e.id===fromHash)?fromHash:(fromHash.startsWith('tt-')?fromHash:(store('lastEx')||EXERCISES[0].id));
  if(want.startsWith('tt-')&&!EXERCISES.some(e=>e.id===want)){TT.pending=want;openExercise('tt-import');return;}
  const id=want;
  openExercise(EXERCISES.some(e=>e.id===id)?id:EXERCISES[0].id);
  }catch(err){
    viewEl.innerHTML='<div class="soonview"><h2>Fehler beim Start</h2><p>'+String(err&&err.message||err)+'</p></div>';
  }
})();
</script>
