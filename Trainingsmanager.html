<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainingsmanager</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1720;color:#e8eef3}

/* ===== App-Kopf ===== */
.appbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0b1118}
.logo{width:32px;height:32px;border-radius:8px;background:#ffd34d;display:grid;place-items:center;font-size:18px}
.appbar h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.01em}
.crumb{color:#7f93a5;font-size:.85rem;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sp{flex:1}
.iconbtn{background:#1d2a37;border:1px solid #33475a;color:#e8eef3;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.iconbtn:hover{background:#26384a}

/* ===== Ribbon ===== */
.tabs{display:flex;gap:2px;background:#0b1118;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border:none;background:transparent;color:#9fb0bf;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;font:inherit;font-size:.9rem}
.tab:hover{color:#e8eef3}
.tab.on{background:#18222d;color:#ffd34d;font-weight:700}
.ribbon{background:#18222d;border-bottom:1px solid #2a3846;display:flex;overflow-x:auto;padding:8px 6px 4px;min-height:108px}
.group{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid #2a3846;flex:0 0 auto}
.group:last-child{border-right:none}
.gitems{display:flex;gap:4px;flex:1}
.glabel{font-size:.66rem;color:#7f93a5;text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.rbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;min-height:76px;padding:7px 4px;background:transparent;border:1px solid transparent;border-radius:9px;color:#e8eef3;font:inherit;font-size:.76rem;line-height:1.15;text-align:center;cursor:pointer}
.rbtn .ic{width:34px;height:34px;display:grid;place-items:center;font-size:1.5rem}
.rbtn:hover{background:#223142;border-color:#33475a}
.rbtn.on{background:rgba(255,211,77,.14);border-color:#ffd34d}
.rbtn.soon{opacity:.55}
.rbtn .badge{position:absolute;top:3px;right:4px;font-size:.58rem;background:#33475a;color:#c3d0db;border-radius:6px;padding:1px 5px}

/* ===== Inhalt ===== */
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.ovw h2{font-size:1.1rem;margin:6px 0 4px}
.ovw .tabsec{margin-top:18px}
.ovw h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:#ffd34d;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:#18222d;border:1px solid #2a3846;border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.card:hover{border-color:#ffd34d}
.card.soon{opacity:.55}
.card .ic{font-size:1.6rem;width:36px;flex:0 0 36px;display:grid;place-items:center}
.card b{display:block;font-size:.95rem;margin-bottom:2px}
.card span{font-size:.8rem;color:#9fb0bf}
.soonview{background:#18222d;border:1px dashed #33475a;border-radius:12px;padding:28px;text-align:center;color:#9fb0bf;margin-top:10px}
.soonview .ic{font-size:2.6rem}
.soonview h2{color:#e8eef3;margin:8px 0 4px}

/* ===== Übung: Pass · Annahme · Mitnahme (Präfix .pam) ===== */
.pam h2{font-size:1.2rem;margin:4px 0 2px}
.pam .sub{color:#9fb0bf;margin:0 0 12px;font-size:.9rem}
.pam .stage{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.pam canvas{display:block;width:100%;touch-action:pan-y}
.pam canvas.edit{touch-action:none;cursor:grab}
.pam .ov{position:absolute;right:10px;bottom:10px;max-width:46%;background:rgba(10,16,24,.84);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.pam .ovStep{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#ffd34d;font-weight:700}
.pam .ovTitle{font-size:1.05rem;font-weight:700;margin:2px 0 4px}
.pam .ovText{font-size:.86rem;line-height:1.38;color:#d5dee6}
.pam .decide{position:absolute;left:10px;bottom:10px;background:rgba(10,16,24,.92);border:2px solid #ffd34d;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;max-width:46%}
.pam .decide .q{font-weight:700;color:#ffd34d;font-size:.9rem}
.pam .decide button{text-align:left;font-size:.85rem}
.pam .hidden{display:none!important}
.pam .steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.pam .chip{padding:5px 11px;border-radius:999px;background:#18222d;border:1px solid #2a3846;color:#9fb0bf;font-size:.8rem;cursor:pointer;user-select:none}
.pam .chip.done{color:#e8eef3;border-color:#3d5266}
.pam .chip.on{background:#ffd34d;color:#111;border-color:#ffd34d;font-weight:700}
.pam .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.pam button,.pam select{font:inherit;font-size:.88rem;background:#1d2a37;color:#e8eef3;border:1px solid #33475a;border-radius:8px;padding:7px 12px;cursor:pointer}
.pam button:hover{background:#26384a}
.pam button.primary{background:#ffd34d;color:#111;border-color:#ffd34d;font-weight:700;min-width:120px}
.pam label{font-size:.86rem;color:#c3d0db;display:flex;align-items:center;gap:6px}
.pam input[type=range]{width:100%;accent-color:#ffd34d}
.pam input[type=checkbox]{accent-color:#ffd34d;width:16px;height:16px}
.pam details{background:#18222d;border:1px solid #2a3846;border-radius:10px;padding:10px 14px;margin-top:14px}
.pam summary{cursor:pointer;font-weight:700}
.pam details h3{font-size:.95rem;margin:12px 0 4px;color:#ffd34d}
.pam details ul,.pam details ol{margin:4px 0;padding-left:20px;font-size:.9rem;line-height:1.5;color:#d5dee6}
.pam .kbd{color:#7f93a5;font-size:.78rem;margin-top:6px}
.pam .vbtn.on{background:#ffd34d;color:#111;border-color:#ffd34d;font-weight:700}
.pam .ov.tl{left:10px;top:10px;right:auto;bottom:auto;max-width:42%}
@media (max-width:620px){.pam .ov.tl{max-width:none}}
.pam .ov.bc{left:50%;right:auto;bottom:10px;transform:translateX(-50%);max-width:62%;width:max-content}
.pam .legendrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:8px 0 0;font-size:.8rem;color:#c3d0db}
.pam .legendrow span{display:flex;align-items:center;gap:6px}
@media (max-width:620px){.pam .ov.bc{transform:none;max-width:none;width:auto}}
.pam .ov.below{position:static;max-width:none;width:auto;transform:none;margin-top:10px}
.pam .callbar .lbl{font-size:.86rem;color:#c3d0db;font-weight:700}
.pam .cbtn{font-weight:700;min-width:64px}
.pam .cbtn:hover{filter:brightness(1.08)}
.pam .cbtn.on{box-shadow:0 0 0 3px #0f1720,0 0 0 5px #fff}
.pam .stage.tall{max-width:470px;margin:0 auto}
.pam .trigger{background:#18222d;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;font-size:.88rem;margin:6px 0 10px;color:#d5dee6}
.pam .vbtn:disabled{opacity:.45;cursor:not-allowed}
.pam .stage.sq{max-width:620px;margin:0 auto}
.pam .ov.nr{max-width:40%}
@media (max-width:620px){.pam .ov.nr{max-width:none}}
@media (max-width:620px){
  .pam .stage{overflow:visible}
  .pam .ov{position:static;max-width:none;border-radius:0 0 12px 12px;border-top:none}
  .pam .decide{position:static;max-width:none;margin-top:8px}
  .crumb{display:none}
}

/* ===== Taktiktafel (Präfix .tt) ===== */
.tt .ttform{display:flex;flex-direction:column;gap:8px;background:#18222d;border:1px solid #2a3846;border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.tt .ttfield{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:#7f93a5;font-weight:700}
.tt textarea,.tt input[type=text],.tt input[type=number]{width:100%;font:inherit;font-size:.88rem;background:#0f1720;color:#e8eef3;border:1px solid #33475a;border-radius:8px;padding:8px 10px}
.tt textarea{min-height:60px;resize:vertical}
.tt textarea#ttJson,.tt textarea[data-r="copyBox"]{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.4}
.tt textarea:focus,.tt input:focus,.tt button:focus-visible,.tt select:focus{outline:2px solid #ffd34d;outline-offset:1px}
.tt .ttgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tt .ttgrid>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt .filebtn{position:relative;overflow:hidden;background:#1d2a37;border:1px solid #33475a;border-radius:8px;padding:7px 12px;cursor:pointer;color:#e8eef3}
.tt .filebtn:hover{background:#26384a}
.tt .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tt .ttmsg{font-size:.86rem;padding:8px 12px;border-radius:8px;border-left:4px solid #33475a;background:#0f1720}
.tt .ttmsg.ok{border-left-color:#4cc36a}
.tt .ttmsg.err{border-left-color:#e5484d;color:#ffb3b5}
.tt .ttnote{font-size:.8rem;color:#9fb0bf;margin:4px 0}
.tt .tth{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:#ffd34d;margin:18px 0 8px}
.tt .ttempty{grid-column:1/-1;border:1px dashed #33475a;border-radius:12px;padding:16px;color:#9fb0bf;font-size:.88rem}
.tt .ttcard{position:relative;align-items:center}
.tt .ttcbody{flex:1;min-width:0}
.tt .ttdel{flex:0 0 auto;background:transparent;border:1px solid transparent;color:#ffb3b5;font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
.tt .ttdel:hover{background:#2a1b20;border-color:#5a2a32}
.tt .ttconfirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:.82rem;color:#ffd6d8}
.tt .ttconfirm[hidden]{display:none!important}
.tt .ttconfirm button{font-size:.8rem;padding:5px 10px}
.tt .ttconfirm button:first-of-type{background:#e5484d;border-color:#e5484d;color:#fff;font-weight:700}
.tt .ttbarc{background:#2a1b20;border:1px solid #5a2a32;border-radius:10px;padding:8px 12px;margin:6px 0}
.tt .ttdelbtn{color:#ffb3b5}
.tt [data-r="msg"]{min-height:1.2em}
.tt .ttrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;flex-wrap:wrap}
.tt .ttlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:#7f93a5;font-weight:700;min-width:88px;padding-top:7px}
.tt .ttchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.tt .ttchip{padding:5px 11px;border-radius:999px;background:#18222d;border:1px solid #2a3846;color:#c3d0db;font-size:.8rem}
.tt .ttchip:hover{border-color:#ffd34d;background:#18222d}
.tt .ttchip.on{background:#ffd34d;color:#111;border-color:#ffd34d;font-weight:700}
.tt .ttchip.sw{width:28px;height:28px;padding:0;border-radius:50%;background:var(--sw);border:2px solid #33475a}
.tt .ttchip.sw.on{box-shadow:0 0 0 2px #0f1720,0 0 0 4px #fff;border-color:var(--sw)}
.tt .tttools{display:flex;gap:4px;overflow-x:auto;background:#18222d;border:1px solid #2a3846;border-radius:12px;padding:6px;margin:10px 0 6px;scrollbar-width:thin}
.tt .tttool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66px;padding:6px 4px;background:transparent;border:1px solid transparent;border-radius:9px;font-size:.72rem;color:#e8eef3}
.tt .tttool .ic{height:22px;display:grid;place-items:center}
.tt .tttool:hover{background:#223142;border-color:#33475a}
.tt .tttool.on{background:rgba(255,211,77,.14);border-color:#ffd34d}
.tt .tthint{font-size:.82rem;color:#9fb0bf;margin:0 0 8px;min-height:1.2em}
.tt .ttedcv{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tt .ttpanel{background:#18222d;border:1px solid #ffd34d;border-radius:12px;padding:10px 14px;margin:10px auto 0;max-width:470px}
.tt .ttpanel[hidden]{display:none!important}
.tt .ttphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tt .ttpdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.tt .ttgrid3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:8px}
.tt .ttgrid3>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt .ttsteps{margin-top:12px}
.tt .ttsave{margin-top:14px}
.tt button:disabled{opacity:.45;cursor:not-allowed}
.tt .ttactions button.primary{min-width:0}
@media (max-width:620px){.tt .ttgrid3{grid-template-columns:1fr 1fr}.tt .ttlbl{min-width:0;width:100%;padding-top:0}}
.tt [hidden]{display:none!important}
.tt .ttsel{width:100%;font:inherit;font-size:.88rem;background:#0f1720;color:#e8eef3;border:1px solid #33475a;border-radius:8px;padding:8px 10px}
.tt .ttcat{display:block;margin-top:3px;font-size:.72rem;color:#ffd34d;letter-spacing:.02em}
.tt .ttcatbox{margin-top:14px}
.tt .ttcatbox .ttform{margin-top:10px}
.tt .ttdup{flex:0 0 auto;background:transparent;border:1px solid transparent;color:#c3d0db;font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
.tt .ttdup:hover{background:#223142;border-color:#33475a}
.ttdupbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.ttdupmsg{font-size:.8rem;color:#9fb0bf}
.exopts label.off{opacity:.4;cursor:not-allowed}
.exopts{margin-bottom:0}
.tt .ttselsm{width:auto;min-width:180px;padding:6px 10px}
.tt .ttkader{display:flex;flex-direction:column;gap:4px;margin:8px 0 2px}
.tt .ttroster{display:flex;flex-direction:column;gap:6px}
.tt .ttrp{display:grid;grid-template-columns:56px 64px minmax(0,2fr) minmax(0,1fr) auto auto;grid-template-areas:"ph nr nm sh tw del";gap:8px;align-items:end;padding:6px 0;border-bottom:1px solid #2a3846}
.tt .ttrp .ttph{grid-area:ph;align-self:center}.tt .ttrp .ttrnr{grid-area:nr}.tt .ttrp .ttrn{grid-area:nm}.tt .ttrp .ttrs{grid-area:sh}.tt .ttrp .tttw{grid-area:tw}.tt .ttrp .ttdel{grid-area:del}
.tt .ttrf{display:flex;flex-direction:column;gap:3px;min-width:0}
.tt .ttrp input[type=number].dup{border-color:#e5484d;color:#ffb3b5}
.tt .ttph{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#0f1720;border:2px solid #33475a;display:grid;place-items:center;cursor:pointer;font-size:.68rem;color:#7f93a5}
.tt .ttph img{width:100%;height:100%;object-fit:cover;display:block}
.tt .ttph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tt .ttph:hover{border-color:#ffd34d}
.tt .tttw{font-size:.8rem;color:#c3d0db;padding-bottom:8px}
.tt .ttwarn{color:#ffb3b5}
@media (max-width:620px){.tt .ttrp{grid-template-columns:56px 64px minmax(0,1fr) auto;grid-template-areas:"ph nr nm nm" "ph tw sh del"}}
/* ===== Release Notes ===== */
.appver{font-size:.72rem;font-weight:700;color:#0f1720;background:#7f93a5;border-radius:6px;padding:2px 6px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.notesbtn{position:relative}
.notesdot{display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 2px #0b1118}
.notesbtn.fresh{border-color:#ffd34d;color:#ffd34d}
.notesbtn.fresh .notesdot{display:block}
.notesov{position:fixed;inset:0;z-index:50;background:rgba(5,9,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) 16px 16px}
.notesov[hidden]{display:none!important}
.notesdlg{background:#18222d;border:1px solid #33475a;border-radius:14px;width:100%;max-width:440px;max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.noteshead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.noteshead h2{margin:0;font-size:1.05rem}
.notesbody{overflow-y:auto;padding:0 16px 4px}
.noteitem{border-top:1px solid #2a3846;padding:10px 0}
.noteitem:first-child{border-top:none}
.notesmeta{display:flex;gap:8px;align-items:center;font-size:.75rem;color:#7f93a5;font-variant-numeric:tabular-nums}
.notesv{font-weight:800;color:#c3d0db;background:#26384a;border-radius:6px;padding:1px 6px}
.noteitem.cur .notesv{background:#ffd34d;color:#111}
.noteitem h3{margin:4px 0 4px;font-size:.92rem}
.noteitem ul{margin:0;padding-left:18px;font-size:.85rem;line-height:1.45;color:#d5dee6}
.notesfoot{margin:0;padding:10px 16px 14px;font-size:.76rem;color:#9fb0bf;border-top:1px solid #2a3846}
@media (max-width:420px){.appver{display:none}}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">⚽</div>
  <h1>Trainingsmanager</h1>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <button class="iconbtn" id="btnFull" title="Vollbild">⛶ Vollbild</button>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="ribbon" id="ribbon"></div>
<main id="view"></main>

<script>
/* =====================================================================
   ÜBUNGS-REGISTER
   Neue Übung hinzufügen: Eintrag in EXERCISES ergänzen und eine
   mount-Funktion schreiben: mount(root) -> gibt eine destroy()-Funktion zurück.
   Einträge mit soon:true erscheinen als Platzhalter "in Vorbereitung".
   ===================================================================== */
const PASS_ICON='<svg viewBox="0 0 34 34" width="34" height="34"><rect x="1" y="1" width="32" height="32" rx="7" fill="#2f8f43"/><path d="M8 25 L17 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M17 16 Q22 14 24 10" stroke="#ffd34d" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M24 10 l-4 .4 M24 10 l-.6 4" stroke="#ffd34d" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="25" r="3.2" fill="#2f6bff" stroke="#fff" stroke-width="1.2"/><circle cx="17" cy="16" r="3.2" fill="#2f6bff" stroke="#ffd34d" stroke-width="1.6"/><circle cx="27" cy="7" r="3.2" fill="#2f6bff" stroke="#fff" stroke-width="1.2"/></svg>';

const SHOT_ICON='<svg viewBox="0 0 34 34" width="34" height="34"><rect x="1" y="1" width="32" height="32" rx="7" fill="#2f8f43"/><path d="M11 8 V4 H23 V8" fill="none" stroke="#fff" stroke-width="1.8"/><rect x="5" y="18" width="5" height="2" rx="1" fill="#ff7a1a"/><rect x="15" y="16" width="5" height="2" rx="1" fill="#ff7a1a"/><path d="M27 21 L8 14" stroke="#fff" stroke-width="1.6"/><path d="M8 14 Q15 12 16 8" stroke="#ffd34d" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="27" cy="21" r="2.6" fill="#c8ef4a" stroke="#fff"/><circle cx="16" cy="8" r="1.8" fill="#fff"/></svg>';

/* ===================== App-Shell ===================== */
const tabsEl=document.getElementById('tabs'),ribbonEl=document.getElementById('ribbon'),
      viewEl=document.getElementById('view'),crumbEl=document.getElementById('crumb');
let curTab='pass',curEx=null,destroyFn=null;

function setHash(h){try{history.replaceState(null,'',h)}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function renderTabs(){
  tabsEl.innerHTML='';
  TABS.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t.id===curTab?' on':'');
    b.textContent=t.label;b.onclick=()=>selectTab(t.id);tabsEl.appendChild(b);});
}
function selectTab(id){
  curTab=id;
  if(id==='all'){openOverview();return;}
  const list=EXERCISES.filter(e=>e.tab===id);
  const first=list.find(e=>!e.soon)||list[0];
  if(first)openExercise(first.id);else{renderTabs();renderRibbon();}
}
function rbtn(ex){
  const b=document.createElement('button');b.className='rbtn'+(ex.soon?' soon':'')+(curEx===ex.id?' on':'');
  b.title=ex.short||'';
  b.innerHTML='<span class="ic">'+ex.icon+'</span><span>'+ex.title+'</span>'+(ex.soon?'<span class="badge">bald</span>':'');
  b.onclick=()=>openExercise(ex.id);return b;
}
function renderRibbon(){
  ribbonEl.innerHTML='';
  const list=curTab==='all'?EXERCISES:EXERCISES.filter(e=>e.tab===curTab);
  const groups={};
  list.forEach(e=>{const g=curTab==='all'?TABS.find(t=>t.id===e.tab).label:e.group;(groups[g]=groups[g]||[]).push(e);});
  Object.keys(groups).forEach(g=>{
    const grp=document.createElement('div');grp.className='group';
    const it=document.createElement('div');it.className='gitems';groups[g].forEach(e=>it.appendChild(rbtn(e)));
    const lb=document.createElement('div');lb.className='glabel';lb.textContent=g;
    grp.appendChild(it);grp.appendChild(lb);ribbonEl.appendChild(grp);
  });
  const ov=document.createElement('div');ov.className='group';
  ov.innerHTML='<div class="gitems"></div><div class="glabel">Ansicht</div>';
  const ob=document.createElement('button');ob.className='rbtn'+(curEx===null?' on':'');
  ob.innerHTML='<span class="ic">▦</span><span>Übersicht</span>';ob.onclick=openOverview;
  ov.firstChild.appendChild(ob);ribbonEl.appendChild(ov);
}
function cleanup(){if(destroyFn){try{destroyFn()}catch(e){}destroyFn=null}viewEl.innerHTML='';}

function openExercise(id){
  const ex=EXERCISES.find(e=>e.id===id);if(!ex)return openOverview();
  cleanup();curEx=id;curTab=ex.tab;store('lastEx',id);
  try{if(location.hash!=='#'+id)setHash('#'+id);}catch(e){}
  crumbEl.textContent=TABS.find(t=>t.id===ex.tab).label+' › '+ex.title;
  if(ex.soon||!ex.mount){
    viewEl.innerHTML='<div class="soonview"><div class="ic">'+ex.icon+'</div><h2>'+ex.title+'</h2><p>'+(ex.short||'')+'</p><p>Diese Übung ist in Vorbereitung.</p></div>';
  }else{
    const root=document.createElement('div');viewEl.appendChild(root);destroyFn=ex.mount(root);
    try{ttAddDupButton(root,ex);}catch(e){}
  }
  renderTabs();renderRibbon();window.scrollTo(0,0);
}
function openOverview(){
  cleanup();curEx=null;try{setHash(location.pathname+location.search);}catch(e){}
  crumbEl.textContent='Übersicht';
  const w=document.createElement('div');w.className='ovw';
  w.innerHTML='<h2>Alle Übungen</h2><p style="color:#9fb0bf;margin:0;font-size:.9rem">Übung im Ribbon oder hier auswählen.</p>';
  TABS.filter(t=>t.id!=='all').forEach(t=>{
    const list=EXERCISES.filter(e=>e.tab===t.id);if(!list.length)return;
    const sec=document.createElement('div');sec.className='tabsec';sec.innerHTML='<h3>'+t.label+'</h3>';
    const grid=document.createElement('div');grid.className='cards';
    list.forEach(e=>{const c=document.createElement('div');c.className='card'+(e.soon?' soon':'');
      c.innerHTML='<div class="ic">'+e.icon+'</div><div><b>'+e.title+'</b><span>'+(e.soon?'In Vorbereitung':e.short)+'</span></div>';
      c.onclick=()=>openExercise(e.id);grid.appendChild(c);});
    sec.appendChild(grid);w.appendChild(sec);
  });
  viewEl.appendChild(w);renderTabs();renderRibbon();
}
document.getElementById('btnFull').onclick=()=>{
  const d=document;
  if(d.fullscreenElement){d.exitFullscreen&&d.exitFullscreen();}
  else{const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
};
try{window.addEventListener('hashchange',()=>{let id='';try{id=location.hash.slice(1)}catch(e){}if(id&&id!==curEx)openExercise(id);});}catch(e){}

      <li><b>Mitnahme:</b> erster Kontakt 2–3 m in den freien Raum Richtung gewählter Option.</li>
      <li><b>Weiterpass</b> auf C bzw. A, danach Positionswechsel (A → B → C → A).</li>
    </ol>
    <h3>Coaching-Punkte</h3>
    <ul>
      <li>Pass flach, scharf, in den richtigen Fuß</li>
      <li>Kopf hoch <i>bevor</i> der Ball ankommt – nicht erst danach</li>
      <li>Entscheidung vor dem ersten Kontakt treffen</li>
      <li>Mitnehmen statt stoppen – Tempo halten, Ball nah am Fuß</li>
    </ul>
    <h3>Variationen</h3>
    <ul>
      <li>Trainer zeigt kurz vor der Annahme mit Hand/Farbe die Option an</li>
      <li>Passiver Gegenspieler, der eine Option zustellt</li>
      <li>Kontaktbegrenzung: Annahme + Pass (2 Kontakte)</li>
      <li>Schwacher Fuß, Zeitlimit oder Wettkampf auf Pässe pro Minute</li>
    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const W=40,H=26;
const DEF={A:{x:8,y:21},B:{x:20,y:14},C:{x:33,y:5}};
let P=JSON.parse(JSON.stringify(DEF));
const PH=[
 {k:'intro', t:0,    step:0,label:'Start',       title:'Ausgangslage',
  text:'A hat den Ball. B bietet sich zentral an, C steht vorne rechts. Gelb markiert: die freien Räume.'},
 {k:'pass',  t:1.0,  step:1,label:'Pass',        title:'Pass',
  text:'A spielt einen flachen, scharfen Pass mit der Innenseite auf B. Danach sofort „Pass & geh“.'},
 {k:'scan',  t:1.5,  step:2,label:'Kopf hoch',   title:'Kopf hoch',
  text:'Noch bevor der Ball ankommt, schaut B über die Schulter: Wo ist Platz? Wo stehen meine Mitspieler?'},
 {k:'decide',t:2.4,  step:3,label:'Entscheidung',title:'Entscheidungsoptionen',
  text:'B erkennt zwei Passoptionen: ① Mitnahme nach vorne rechts → Steilpass auf C. ② Mitnahme nach links → Pass auf den freilaufenden A.'},
 {k:'recv',  t:3.8,  step:4,label:'Annahme',     title:'Annahme',text:''},
 {k:'carry', t:4.65, step:5,label:'Mitnahme',    title:'Mitnahme in den Raum',
  text:'Ball nicht stoppen, sondern mit dem ersten Kontakt 2–3 m in den freien Raum mitnehmen. Ball bleibt nah am Fuß.'},
 {k:'pass2', t:5.75, step:6,label:'Weiterpass',  title:'Weiterpass',text:''},
 {k:'end',   t:7.05, step:7,label:'Fazit',       title:'Coaching-Punkte',
  text:'Pass flach & scharf · Kopf hoch vor der Annahme · Entscheidung vor dem Ballkontakt · Mitnehmen statt stoppen · Tempo halten.'}
];
const TEND=8.6,DEC=2.4,HOLD=2.75;
const OPT={1:'Mitnahme nach vorne rechts → Steilpass auf C',2:'Mitnahme nach links → Pass auf den freilaufenden A'};

let T=0,playing=false,last=0,speed=1,chosen=null,mode='manual',autoOpt=1,waiting=false;
let showText=true,showRuns=true,edit=false,drag=null,raf=0,alive=true,showAll=true,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let S=1,DPR=1,CW=0,CH=0;

const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, easeOut=t=>1-Math.pow(1-t,3);
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const perp=v=>({x:-v.y,y:v.x});
const ang=v=>Math.atan2(v.y,v.x);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerpAng=(a,b,t)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t};
const inField=p=>({x:clamp(p.x,2,W-2),y:clamp(p.y,2,H-2)});
const getA2=()=>inField({x:P.A.x+3,y:P.A.y-13});
const rev=()=>!!chosen&&(mode==='manual'||T>=DEC+0.8);

function st(T){
  const A2=getA2();
  const dA=norm(sub(P.B,P.A));
  const start=add(P.A,dA,1.0), recv=add(P.B,dA,-1.0);
  const opts=[1,2].map(i=>{const tg=i===1?P.C:A2;const d=norm(sub(tg,P.B));
    return{tg,d,M:add(P.B,d,4.5),zone:inField(add(P.B,d,6.5))}});
  const oi=chosen||1,o=opts[oi-1];
  const tgPt=add(o.tg,norm(sub(o.tg,o.M)),-1.0);
  const aPos=lp(P.A,A2,ease(seg(T,1.6,5.4)));
  let u; if(T<2.4)u=0.62*seg(T,1.0,2.4); else if(T<3.8)u=0.62; else u=0.62+0.38*seg(T,3.8,4.65);
  let ball=lp(start,recv,u), bPos={x:P.B.x,y:P.B.y};
  if(T>=4.65){ball=lp(recv,o.M,easeOut(seg(T,4.65,5.35)));bPos=lp(P.B,add(o.M,o.d,-1.0),ease(seg(T,4.65,5.75)));}
  if(T>=5.75){const v=seg(T,5.75,7.05);ball=lp(o.M,tgPt,1-Math.pow(1-v,1.6));}
  const base=ang(sub(P.A,P.B)), aC=ang(sub(P.C,P.B)), aA2=ang(sub(A2,P.B));
  let fB=ang(sub(T<1.0?P.A:ball,bPos));
  if(T>=1.5&&T<2.4){const s=seg(T,1.5,2.4);
    if(s<1/3)fB=lerpAng(base,aC,ease(s*3));
    else if(s<2/3)fB=lerpAng(aC,aA2,ease((s-1/3)*3));
    else fB=lerpAng(aA2,base,ease((s-2/3)*3));}
  if(T>=2.4&&T<4.65)fB=base;
  if(T>=4.65&&T<5.75)fB=ang(o.d);
  if(T>=5.75)fB=ang(sub(o.tg,bPos));
  let fA=ang(sub(P.B,P.A)); if(T>=1.6&&T<5.4)fA=ang(sub(A2,P.A)); if(T>=5.4)fA=ang(sub(ball,aPos));
  const fC=ang(sub(ball,P.C));
  return{A2,dA,start,recv,opts,oi,o,tgPt,aPos,ball,bPos,u,fA,fB,fC};
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function cone(x,y){const X=x*S,Y=y*S,r=clamp(S*.45,5,8);ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.8,Y+r*.6);ctx.lineTo(X-r*.8,Y+r*.6);ctx.closePath();ctx.fill();}
function drawField(){
  const n=10;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(i*CW/n,0,CW/n+1,CH);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(.8*S,.8*S,(W-1.6)*S,(H-1.6)*S);
  [[.8,.8],[W-.8,.8],[.8,H-.8],[W-.8,H-.8]].forEach(([x,y])=>cone(x,y));
  const fs=clamp(S*.42,9,12);ctx.font=`600 ${fs}px system-ui,sans-serif`;ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('↑ Spielrichtung',1.4*S,1.3*S);
}
function line(p,r,o={}){
  const {c='#fff',w=2,a=1,dash=null,head=false,curve=0}=o;
  const X1=p.x*S,Y1=p.y*S,X2=r.x*S,Y2=r.y*S;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  let cx=(X1+X2)/2,cy=(Y1+Y2)/2;
  if(curve){const dx=X2-X1,dy=Y2-Y1,l=Math.hypot(dx,dy)||1;cx+=-dy/l*curve*S;cy+=dx/l*curve*S;}
  ctx.beginPath();ctx.moveTo(X1,Y1);ctx.quadraticCurveTo(cx,cy,X2,Y2);ctx.stroke();ctx.setLineDash([]);
  if(head&&Math.hypot(X2-X1,Y2-Y1)>4){const an=Math.atan2(Y2-cy,X2-cx),h=Math.max(9,w*3.2);
    ctx.beginPath();ctx.moveTo(X2,Y2);ctx.lineTo(X2-h*Math.cos(an-.45),Y2-h*Math.sin(an-.45));
    ctx.lineTo(X2-h*Math.cos(an+.45),Y2-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
  ctx.restore();
}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.78)',a=1}=o;
  const fs=clamp(S*.5,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*S-w/2,3,CW-w-3),Y=clamp(p.y*S-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function zone(c,a,label){
  const X=c.x*S,Y=c.y*S,R=3.6*S;ctx.save();ctx.globalAlpha=clamp(a,0,1);
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,224,90,.5)');g.addColorStop(1,'rgba(255,224,90,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,R,0,7);ctx.fill();
  ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(255,236,150,.85)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X,Y,R*.8,0,7);ctx.stroke();ctx.restore();
  if(label&&a>.4)tag({x:c.x,y:c.y+2.2},'freier Raum',{c:'#3a2c00',bg:'rgba(255,230,120,.85)',a});
}
function badge(p,n,a){
  if(!showAnn)return;
  const r=clamp(S*.6,8,12);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(p.x*S,p.y*S,r,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.font=`800 ${r*1.15}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(n),p.x*S,p.y*S+1);ctx.restore();
}
function vision(p,an,a){
  const X=p.x*S,Y=p.y*S,R=11*S,h=.42;ctx.save();ctx.globalAlpha=clamp(a,0,1);
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,255,255,.42)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,R,an-h,an+h);ctx.closePath();ctx.fill();ctx.restore();
}
function player(p,lbl,face,focus){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.95,10,17);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(face)*(r+7),Y+Math.sin(face)*(r+7));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);
  ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2f6bff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=focus?3.5:2;ctx.strokeStyle=focus?'#ffd34d':'#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);
}
function ghost(p,lbl){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.95,10,17);ctx.save();ctx.globalAlpha=.55;
  ctx.setLineDash([3,4]);ctx.strokeStyle='#cfe0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.stroke();
  ctx.fillStyle='#cfe0ff';ctx.font=`700 ${r*.8}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);ctx.restore();
}
function drawBall(p){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.42,5,8);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();
}
function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  const s=st(T),now=performance.now()/1000,R=rev();
  const pulse=waiting?.6+.4*Math.sin(now*6):1;
  drawField();
  if(showAll){const o=s.o;line(s.start,s.recv,{c:'#fff',w:2,a:.22});line(s.recv,o.M,{c:'#ffd34d',w:2,a:.25,curve:.6});
    line(o.M,s.tgPt,{c:'#fff',w:2,a:.22,head:true});line(P.A,s.A2,{c:'#cfe0ff',w:1.6,a:.25,dash:[3,6],head:true,curve:-1.2});}
  s.opts.forEach((o,i)=>{const n=i+1;let a=T<1.5?.45:T<4.65?.95:.55;
    if(R)a=n===s.oi?1:.22; if(T>=5.75&&n!==s.oi)a=.12; if(waiting)a*=pulse;
    zone(o.zone,a,T>=1.5&&T<5.75&&(!R||n===s.oi));});
  if(showRuns&&T>=1.3&&T<7.05)line(P.A,s.A2,{c:'#cfe0ff',w:1.6,a:.65,dash:[3,6],head:true,curve:-1.2});
  if(T>=1.6&&T<5.4)ghost(s.A2,'A');
  if(showRuns&&T>=1.6&&T<3.8)tag(lp(P.A,s.A2,.45),'Pass & geh',{c:'#dbe7ff',a:.9});
  if(T>=2.0&&T<5.75){const f=seg(T,2.0,2.4);
    s.opts.forEach((o,i)=>{const n=i+1,ch=R&&n===s.oi;
      let a=f*(R?(ch?1:.35):.95)*(waiting?pulse:1); if(T>=4.65&&!ch)a*=.5;
      line(P.B,o.tg,{c:(ch||!R)?'#ffd34d':'#c9d3dc',w:ch?3:2,a,dash:[8,7],head:true});
      if(T<4.65)badge(lp(P.B,o.tg,.55),n,a);});}
  if(T>=.4){const done=T>=4.65;
    if(!done)line(s.start,s.recv,{c:'#fff',w:1.5,a:.45,dash:[2,6]});
    if(s.u>0)line(s.start,done?s.recv:lp(s.start,s.recv,s.u),{c:'#fff',w:2.6,a:done?.5:.95,head:done});
    if(T>=1.0&&T<4.65)tag(add(lp(s.start,s.recv,.45),perp(s.dA),1.9),'flacher Pass');}
  if(T>=2.4&&T<4.4){s.opts.forEach((o,i)=>{const n=i+1,ch=R&&n===s.oi;
    line(s.recv,o.M,{c:'#ffd34d',w:ch?3:2,a:(R?(ch?1:.25):.8)*(waiting?pulse:1),dash:ch?null:[4,4],head:true,curve:.6});});}
  if(T>=4.4){line(s.recv,s.o.M,{c:'#ffd34d',w:4,a:T>=7.05?.6:1,head:true,curve:.6});
    if(T<7.05)tag(add(lp(s.recv,s.o.M,.5),perp(s.o.d),-1.6),'Mitnahme',{c:'#3a2c00',bg:'#ffd34d'});}
  if(T>=5.75){const fin=T>=7.05;
    line(s.o.M,fin?s.tgPt:s.ball,{c:'#fff',w:2.6,a:.95,head:fin});
    tag(add(lp(s.o.M,s.tgPt,.5),perp(s.o.d),1.7),s.oi===1?'Steilpass auf C':'Pass auf A');}
  if(T>=1.5&&T<3.8)vision(s.bPos,s.fB,T<2.4?.95:.35);
  if(T>=5.6&&T<6.1)vision(s.bPos,s.fB,.5);
  player(P.C,'C',s.fC,false);
  player(s.aPos,'A',s.fA,false);
  player(s.bPos,'B',s.fB,true);
  drawBall(s.ball);
  if(T>=1.5&&T<2.7)tag(add(s.bPos,{x:0,y:-2.6}),'👀 Kopf hoch!',{c:'#111',bg:'#ffd34d'});
  if(waiting)tag(add(s.bPos,{x:0,y:-2.6}),'① oder ② ?',{c:'#111',bg:'#ffd34d',a:pulse});
  if(T>=4.45&&T<5.1)tag(add(s.ball,{x:0,y:2.2}),'1. Kontakt');
  if(edit)tag({x:W/2,y:1.8},'✋ Spieler ziehen zum Verschieben',{c:'#111',bg:'#ffd34d'});
}

const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{if(p.step<1)return;const c=document.createElement('span');c.className='chip';
  c.textContent=(p.step<7?p.step+' · ':'')+p.label;c.dataset.i=i;c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
function phaseText(p){
  if(p.k==='decide'){
    if(waiting)return 'Standbild! B hat vor der Annahme hochgeschaut. Jetzt entscheiden: ① '+OPT[1]+' oder ② '+OPT[2]+'?';
    if(rev())return 'Entscheidung gefallen: Option '+chosen+' – '+OPT[chosen]+'.';
  }
  if(p.k==='recv')return 'Offene Körperstellung, Ball mit dem ballfernen Fuß annehmen – der erste Kontakt zeigt schon Richtung Option '+(chosen||1)+'.';
  if(p.k==='pass2')return (chosen||1)===1?'Kopf wieder hoch und präzise steil auf C spielen – in den Lauf.':'Kopf wieder hoch: A hat sich nach seinem Pass freigelaufen – flacher Pass in den Fuß.';
  return p.text;
}
let lastKey='';
function updateUI(){
  const i=phaseIdx(T),p=PH[i];
  const key=i+'|'+waiting+'|'+chosen+'|'+mode+'|'+rev();
  if(key!==lastKey){lastKey=key;
    q('ovStep').textContent=p.step>=1&&p.step<=6?'Schritt '+p.step+' von 6':(p.step===0?'Übung':'Zusammenfassung');
    q('ovTitle').textContent=p.title;q('ovText').textContent=phaseText(p);
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});
  }
  q('decide').classList.toggle('hidden',!waiting);
  q('ov').classList.toggle('hidden',!showText);
  q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');
}
function setT(t){
  if(mode==='manual'&&!chosen&&t>HOLD)t=HOLD;
  if(t>=TEND){t=TEND;playing=false;}
  T=Math.max(0,t);
  waiting=mode==='manual'&&!chosen&&T>=HOLD-1e-6;
  if(waiting)playing=false;
}
function restart(play){T=0;chosen=mode==='auto'?autoOpt:null;waiting=false;playing=!!play;setT(0);}
function choose(n){chosen=n;waiting=false;playing=true;}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}

q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}if(waiting)return;playing=!playing;};
q('bRestart').onclick=()=>restart(true);
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
q('sMode').onchange=e=>{mode=e.target.value;q('lAuto').classList.toggle('hidden',mode!=='auto');restart(false);};
q('sAuto').onchange=e=>{autoOpt=+e.target.value;if(mode==='auto')chosen=autoOpt;};
exOpts(root,['all','runs','text','ann'],o=>{showText=o.text;showRuns=o.runs;showAll=o.all;showAnn=o.ann;});
q('cEdit').onchange=e=>{edit=e.target.checked;cv.classList.toggle('edit',edit);if(edit)restart(false);};
q('bReset').onclick=()=>{P=JSON.parse(JSON.stringify(DEF));restart(false);};
root.querySelectorAll('[data-r="decide"] button').forEach(b=>b.onclick=()=>choose(+b.dataset.opt));

function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if((e.key==='1'||e.key==='2')&&waiting)choose(+e.key);
  else if(e.key==='r'||e.key==='R')restart(true);
}
document.addEventListener('keydown',onKey);

const toField=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}};
cv.addEventListener('pointerdown',e=>{if(!edit)return;const f=toField(e);let best=null,bd=2.4;
  for(const k of['A','B','C']){const d=len(sub(P[k],f));if(d<bd){bd=d;best=k}}
  if(best){drag=best;cv.setPointerCapture(e.pointerId);e.preventDefault();}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const f=toField(e);P[drag]={x:clamp(f.x,1.5,W-1.5),y:clamp(f.y,1.5,H-1.5)};});
const endDrag=()=>drag=null;cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;S=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);

resize();restart(false);raf=requestAnimationFrame(frame);

root._export=()=>{const keep=chosen,keepT=T,keepW=waiting;chosen=chosen||1;waiting=false;
  try{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
    const st0=st(0);
    return ttMk({Wm:W,Hm:H,
      lines:[{t:'rect',x:.8,y:.8,w:W-1.6,h:H-1.6},{t:'text',x:4.6,y:1.9,text:'↑ Spielrichtung'}],
      items:[[.8,.8],[W-.8,.8],[.8,H-.8],[W-.8,H-.8]].map(([x,y])=>({kind:'cone',x,y,c:'#ff8a1f'})),
      actors:[{k:'A',name:'A'},{k:'B',name:'B'},{k:'C',name:'C'}],times:ts,
      pos:(k,t)=>{T=t;const s=st(t);return k==='A'?s.aPos:k==='B'?s.bPos:P.C;},
      ball:t=>{T=t;return st(t).ball;},
      anns:(i,t)=>{if(i<2||i>5)return[];T=t;const z=st(t).o.zone;return[{type:'zone',x:z.x-3,y:z.y-3,w:6,h:6}];},
      notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];T=t;return p.title+': '+phaseText(p);})});}
  finally{chosen=keep;T=keepT;waiting=keepW;}};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();

}

root.innerHTML=`

      <li>Abschluss mit dem schwachen Fuß</li>

    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const W=40,H=45;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, easeOut=t=>1-Math.pow(1-t,3);
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});

const ang=v=>Math.atan2(v.y,v.x);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

/* Positionen in Metern (Tor oben) */
const GOAL={x1:16.3,x2:23.7,y:2,back:.8};
const CONE={x:20.8,y:40.6}, S0={x:21.6,y:41.5};
const QUEUE=[{x:22.5,y:42.8},{x:23.2,y:44}];
const P1={x:12.2,y:29.4};                 // Ende Andribbeln
const M0={x:26.6,y:25.8};                 // Anspieler
const R={x:10.5,y:16.4};                  // Ballannahme hinter der Kette
const D0={x:12.2,y:15.0};                 // nach der Mitnahme
const E={x:18.4,y:13.2};                  // Schussposition
const GP={x:18.2,y:1.4};                  // Torschuss-Ziel
const TW0={x:21.2,y:3.4};
const DUM=[{x:11.25,y:22.1},{x:20.8,y:18.6},{x:28.75,y:22.1}];
const pD1=t=>lp(S0,P1,t);
const pRun=t=>bez(P1,{x:9.6,y:27.2},{x:7.6,y:20.6},R,t);
const pD2=t=>bez(D0,{x:14.8,y:14.4},{x:17.6,y:15.6},E,t);
const tang=(f,t)=>{const a=f(clamp(t-.01,0,1)),b=f(clamp(t+.01,0,1));return norm(sub(b,a))};

const PH=[
 {t:0,   step:0,label:'Start',      title:'Ausgangslage',
  text:'S startet am Hütchen mit Ball. M steht vor der Puppenkette am Mittelkreis. Die drei Puppen simulieren die Abwehrkette, TW steht im Tor.'},
 {t:1.0, step:1,label:'Andribbeln', title:'Andribbeln',
  text:'S dribbelt diagonal nach links Richtung Mittelkreis – Ball eng führen, Kopf hoch, Blickkontakt zu M.'},
 {t:2.8, step:2,label:'Querpass',   title:'Querpass',
  text:'Flacher, scharfer Pass auf M – in den Fuß, mit dem M weiterspielen will.'},
 {t:3.7, step:3,label:'Pass & geh', title:'Pass & geh',

 {t:4.2, step:4,label:'Steilpass',  title:'Steilpass in den Lauf',
  text:'M spielt den Ball diagonal durch die Lücke hinter die Puppenkette – in den Lauf von S, nicht in den Fuß.'},
 {t:5.45,step:5,label:'Mitnahme',   title:'Annahme & Mitnahme',
  text:'S nimmt den Ball im Lauf mit dem ersten Kontakt nach innen Richtung Tor mit – nicht stoppen.'},
 {t:5.95,step:6,label:'Dribbling',  title:'Dribbling zum Tor',
  text:'Mit Tempo diagonal Richtung Tor dribbeln. Kopf hoch: Wo steht der Torwart?'},
 {t:7.3, step:7,label:'Abschluss',  title:'Torabschluss',
  text:'Flach und platziert abschließen – ins Eck, das der Torwart offen lässt.'},
 {t:8.0, step:8,label:'Fazit',      title:'Coaching-Punkte',
  text:'Ball eng führen · Pass flach & scharf · nach dem Pass sofort starten · Steilpass in den Lauf · Mitnahme Richtung Tor · flach & platziert abschließen. Danach wird S zu M.'}
];
const TEND=9.6;

let T=0,playing=false,last=0,speed=1,showText=true,showRuns=true,showLeg=true,raf=0,alive=true,showOpp=true,showWays=true,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

/* ---------- Zustand ---------- */
function st(T){
  const dirD1=norm(sub(P1,S0));
  const dEnd=add(P1,dirD1,.8);
  const mFoot=add(M0,norm(sub(P1,M0)),.9);
  const tg0=tang(pD2,0), dStart=add(D0,tg0,.8);
  const tgE=tang(pD2,1), shotStart=add(E,tgE,.8);
  let sp={x:S0.x,y:S0.y}, ball=add(S0,dirD1,.8), fS=ang(dirD1), u1=0, r=0, d=0;
  if(T>=1.0&&T<2.8){u1=ease(seg(T,1,2.8));sp=pD1(u1);const fade=1-seg(T,2.55,2.8);
    ball=add(sp,dirD1,.8+.35*Math.abs(Math.sin(T*7))*fade);}
  if(T>=2.8){u1=1;sp={x:P1.x,y:P1.y};fS=ang(sub(M0,P1));ball=lp(dEnd,mFoot,seg(T,2.8,3.75));}
  if(T>=3.75)ball={x:mFoot.x,y:mFoot.y};
  if(T>=3.7){r=ease(seg(T,3.7,5.4));sp=pRun(r);fS=ang(tang(pRun,Math.min(r,.99)));
    if(T>=4.4&&T<5.2)fS=ang(sub(ball,sp));}       // Schulterblick zum Ball
  if(T>=4.2)ball=lp(mFoot,R,1-Math.pow(1-seg(T,4.2,5.45),1.4));
  if(T>=5.45){ball=lp(R,dStart,easeOut(seg(T,5.45,5.95)));sp=lp(R,D0,ease(seg(T,5.45,5.95)));fS=ang(sub(D0,R));}
  if(T>=5.95){d=seg(T,5.95,7.3);sp=pD2(d);const tg=tang(pD2,Math.min(d,.99));fS=ang(tg);
    const fade=1-seg(T,7.05,7.3);ball=add(sp,tg,.8+.3*Math.abs(Math.sin(T*8))*fade);}
  if(T>=7.3){sp={x:E.x,y:E.y};fS=ang(sub(GP,E));ball=lp(shotStart,GP,easeOut(seg(T,7.3,7.85)));}
  const fM=T<3.75?ang(sub(ball,M0)):ang(sub(R,M0));
  const refX=T<7.3?ball.x:shotStart.x;
  let tw={x:clamp(lerp(TW0.x,refX,.25),18,22.2),y:TW0.y};
  if(T>=7.3)tw=lp(tw,{x:tw.x-1.3,y:2.8},ease(seg(T,7.34,7.75)));
  const fT=ang(sub(ball,tw));
  return{sp,ball,fS,fM,fT,tw,u1,r,d,dEnd,mFoot,dStart,shotStart};
}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function seg2(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1*K,y1*K);ctx.lineTo(x2*K,y2*K);ctx.stroke();}
function drawGoal(){
  const x1=GOAL.x1*K,x2=GOAL.x2*K,y=GOAL.y*K,b=GOAL.back*K;
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x1,b,x2-x1,y-b);
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  for(let x=GOAL.x1+.5;x<GOAL.x2;x+=.5)seg2(x,GOAL.back,x,GOAL.y);
  seg2(GOAL.x1,(GOAL.back+GOAL.y)/2,GOAL.x2,(GOAL.back+GOAL.y)/2);
  ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x1,b);ctx.lineTo(x2,b);ctx.lineTo(x2,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.lineCap='butt';
}
function drawField(){
  const n=11;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(0,i*CH/n,CW,CH/n+1);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;
  seg2(.6,GOAL.y,W-.6,GOAL.y);seg2(.6,GOAL.y,.6,H);seg2(W-.6,GOAL.y,W-.6,H);
  ctx.strokeRect(10.8*K,GOAL.y*K,18.4*K,5.5*K);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(20*K,13*K,Math.max(2,K*.18),0,7);ctx.fill();
  seg2(.6,20,W-.6,20);
  ctx.beginPath();ctx.arc(20*K,20*K,9*K,0,Math.PI);ctx.stroke();
  drawGoal();
}
function dummy(p){
  const w=1.9*K,h=Math.max(5,.55*K),X=p.x*K-w/2,Y=p.y*K-h/2;
  ctx.fillStyle='rgba(0,0,0,.3)';rr(X+2,Y+3,w,h,h/2);ctx.fill();
  ctx.fillStyle='#ff7a1a';rr(X,Y,w,h,h/2);ctx.fill();
  ctx.strokeStyle='#7a2e00';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='#3b1a06';ctx.beginPath();ctx.arc(p.x*K,p.y*K,Math.max(2,h*.28),0,7);ctx.fill();
}
function cone(p){const X=p.x*K,Y=p.y*K,r=clamp(K*.5,5,9);ctx.fillStyle='#e8352b';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();}
function line(p,r,o={}){
  const {c='#fff',w=2.4,a=1,dash=null,head=false,curve=0}=o;
  const X1=p.x*K,Y1=p.y*K,X2=r.x*K,Y2=r.y*K;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  let cx=(X1+X2)/2,cy=(Y1+Y2)/2;
  if(curve){const dx=X2-X1,dy=Y2-Y1,l=Math.hypot(dx,dy)||1;cx+=-dy/l*curve*K;cy+=dx/l*curve*K;}
  ctx.beginPath();ctx.moveTo(X1,Y1);ctx.quadraticCurveTo(cx,cy,X2,Y2);ctx.stroke();ctx.setLineDash([]);
  if(head&&Math.hypot(X2-X1,Y2-Y1)>4)arrowHead(X2,Y2,Math.atan2(Y2-cy,X2-cx),w);
  ctx.restore();
}
function arrowHead(X,Y,an,w){const h=Math.max(9,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
function pathLine(f,t0,t1,o={}){
  const {c='#fff',w=2,a=1,dash=null,head=false}=o;if(t1<=t0)return;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);ctx.beginPath();
  const N=Math.max(6,Math.ceil((t1-t0)*60));
  for(let i=0;i<=N;i++){const p=f(t0+(t1-t0)*i/N);i?ctx.lineTo(p.x*K,p.y*K):ctx.moveTo(p.x*K,p.y*K);}
  ctx.stroke();ctx.setLineDash([]);
  if(head){const p=f(t1);arrowHead(p.x*K,p.y*K,ang(tang(f,t1)),w);}
  ctx.restore();
}
function wavy(f,t0,t1,o={}){
  const {c='#fff',w=2.2,a=1,amp=.32,wl=1.3}=o;if(t1<=t0)return;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const N=Math.max(10,Math.ceil((t1-t0)*160));let dist=0,prev=f(t0);
  for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N,p=f(t);if(i>0)dist+=len(sub(p,prev));prev=p;
    const n=perp(tang(f,t)),k=Math.sin(dist/wl*Math.PI*2)*amp*Math.min(1,dist/.6);
    const X=(p.x+n.x*k)*K,Y=(p.y+n.y*k)*K;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.stroke();ctx.restore();
}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.78)',a=1}=o;
  const fs=clamp(K*.5,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function player(p,lbl,face,o={}){
  const {fill='#c8ef4a',txt='#16210a',ring=null,a=1}=o;
  const X=p.x*K,Y=p.y*K,r=clamp(K*.95,9,16);
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(face)*(r+7),Y+Math.sin(face)*(r+7));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);
  ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  if(lbl){ctx.fillStyle=txt;ctx.font=`800 ${r*(lbl.length>1?.72:1)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);}
  ctx.restore();
}
function drawBall(p){
  const X=p.x*K,Y=p.y*K,r=clamp(K*.42,5,8);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();
}
function legend(){
  const fs=clamp(K*.42,9,12),pad=8,rowH=fs+8,lw=34;
  const rows=[['wavy','#fff','Dribbling'],['line','#fff','Pass'],['dash','#dbe7ff','Laufweg ohne Ball'],['line','#ffd34d','Mitnahme / Torschuss']];
  ctx.save();ctx.font=`600 ${fs}px system-ui,sans-serif`;
  let tw=0;rows.forEach(r=>tw=Math.max(tw,ctx.measureText(r[2]).width));
  const bw=pad*3+lw+tw,bh=pad*2+rows.length*rowH,X=8,Y=CH-bh-8;
  ctx.fillStyle='rgba(10,16,24,.78)';rr(X,Y,bw,bh,8);ctx.fill();
  rows.forEach((r,i)=>{const y=Y+pad+rowH*i+rowH/2,x0=X+pad,x1=x0+lw;
    ctx.strokeStyle=r[1];ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
    if(r[0]==='wavy'){for(let k=0;k<=24;k++){const x=x0+(x1-x0)*k/24,yy=y+Math.sin(k/24*Math.PI*4)*3;k?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}}
    else{if(r[0]==='dash')ctx.setLineDash([3,4]);ctx.moveTo(x0,y);ctx.lineTo(x1,y);}
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#e8eef3';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(r[2],x1+pad,y);});
  ctx.restore();
}

function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  const s=st(T),now=performance.now()/1000;
  drawField();
  DUM.forEach(dummy);cone(CONE);

  // Gesamtablauf als Vorschau
  if(showRuns){const a=.22;
    wavy(pD1,0,1,{a});line(s.dEnd,s.mFoot,{a});pathLine(pRun,0,1,{a,dash:[3,6],c:'#dbe7ff'});
    line(s.mFoot,R,{a});wavy(pD2,0,1,{a});line(s.shotStart,GP,{a,c:'#ffd34d'});}

  // Wege der aktuellen und nächsten Aktion
  if(showWays){const i=phaseIdx(T),w={a:.5};
    [i,i+1].forEach(j=>{
      if(j===1)wavy(pD1,0,1,w);else if(j===2)line(s.dEnd,s.mFoot,{a:.5,head:true});
      else if(j===3)pathLine(pRun,0,1,{c:'#dbe7ff',w:2,dash:[4,6],a:.6,head:true});else if(j===4)line(s.mFoot,R,{a:.5,head:true});
      else if(j===5)line(R,s.dStart,{c:'#ffd34d',a:.55,head:true,curve:.4});else if(j===6)wavy(pD2,0,1,w);
      else if(j===7)line(s.shotStart,GP,{c:'#ffd34d',a:.55,head:true});});}
  // tatsächliche Wege
  if(T>=1.0){wavy(pD1,0,s.u1,{a:T>=2.8?.6:1});
    if(T<2.8)tag(add(pD1(.5),{x:3.4,y:0}),'Andribbeln');}
  if(T>=2.8){const done=T>=3.75;line(s.dEnd,done?s.mFoot:s.ball,{w:2.6,a:T>=4.2?.55:1,head:done});
    if(T<4.2)tag(add(lp(s.dEnd,s.mFoot,.5),{x:0,y:1.8}),'Querpass');}
  if(T>=3.7){pathLine(pRun,0,s.r,{c:'#dbe7ff',w:2,dash:[4,6],head:s.r>=.98,a:T>=5.45?.6:1});
    if(T<5.45)tag(add(pRun(.45),{x:-2.8,y:0}),'Pass & geh');}
  if(T>=4.2){const done=T>=5.45;line(s.mFoot,done?R:s.ball,{w:2.6,a:T>=5.95?.55:1,head:done});
    if(T<5.95)tag(add(lp(s.mFoot,R,.45),{x:1.2,y:2}),'Steilpass in den Lauf');}
  if(T>=5.4){line(R,s.dStart,{c:'#ffd34d',w:4,head:true,curve:.4,a:T>=7.3?.6:1});
    if(T<6.4)tag(add(lp(R,s.dStart,.5),{x:-.4,y:-1.8}),'Mitnahme',{c:'#3a2c00',bg:'#ffd34d'});}
  if(T>=5.95){wavy(pD2,0,s.d,{a:T>=7.3?.6:1});
    if(T<7.3)tag(add(pD2(.5),{x:0,y:2.2}),'Dribbling');}
  if(T>=7.3){const done=T>=7.85;line(s.shotStart,done?GP:s.ball,{c:'#ffd34d',w:3.2,head:done});
    if(T<8.6)tag(add(lp(s.shotStart,GP,.5),{x:-3,y:0}),'Torschuss');}
  if(T>=7.85){const p=.75+.25*Math.sin(now*6);tag({x:20,y:6.2},'⚽ TOR!',{c:'#111',bg:'#ffd34d',a:p});}
  if(T<2.8)tag({x:20.8,y:16.7},'Puppenkette',{a:.9});

  // Spieler
  QUEUE.forEach(p=>player(p,'',-Math.PI/2,{a:.45}));
  player(M0,'M',s.fM);
  if(showOpp)player(s.tw,'TW',s.fT,{fill:'#7b3fe4',txt:'#fff'});
  player(s.sp,'S',s.fS,{ring:'#ffd34d'});
  drawBall(s.ball);
  if(T>=4.5&&T<5.2)tag(add(s.sp,{x:-.5,y:-2.4}),'👀 Ball im Blick',{c:'#111',bg:'#ffd34d'});
  if(showLeg)legend();
}

/* ---------- UI ---------- */
const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{if(p.step<1)return;const c=document.createElement('span');c.className='chip';
  c.textContent=(p.step<8?p.step+' · ':'')+p.label;c.dataset.i=i;c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
let lastKey=-1;
function updateUI(){
  const i=phaseIdx(T),p=PH[i];
  if(i!==lastKey){lastKey=i;
    q('ovStep').textContent=p.step>=1&&p.step<=7?'Schritt '+p.step+' von 7':(p.step===0?'Übung':'Zusammenfassung');
    q('ovTitle').textContent=p.title;q('ovText').textContent=p.text;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});
  }
  q('ov').classList.toggle('hidden',!showText);
  q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');
}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}
function restart(play){playing=!!play;setT(0);}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}playing=!playing;};
q('bRestart').onclick=()=>restart(true);
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
exOpts(root,['opp','all','runs','text','ann'],o=>{showText=o.text;showRuns=o.all;showWays=o.runs;showOpp=o.opp;showAnn=o.ann;});
q('cLeg').onchange=e=>showLeg=e.target.checked;
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if(e.key==='r'||e.key==='R')restart(true);
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
resize();restart(false);raf=requestAnimationFrame(frame);
root._export=()=>{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
  return ttMk({Wm:W,Hm:H,gCol:'#7b3fe4',
    lines:[{t:'line',x1:.6,y1:GOAL.y,x2:W-.6,y2:GOAL.y},{t:'line',x1:.6,y1:GOAL.y,x2:.6,y2:H},{t:'line',x1:W-.6,y1:GOAL.y,x2:W-.6,y2:H},
      {t:'rect',x:10.8,y:GOAL.y,w:18.4,h:5.5},{t:'dot',x:20,y:13},{t:'line',x1:.6,y1:20,x2:W-.6,y2:20},{t:'arc',x:20,y:20,r:9,a0:0,a1:180}],
    items:DUM.map(d=>({kind:'dummy',x:d.x,y:d.y})).concat([{kind:'cone',x:CONE.x,y:CONE.y,c:'#e8352b'},
      {kind:'goal',x:(GOAL.x1+GOAL.x2)/2,y:GOAL.y,w:GOAL.x2-GOAL.x1,d:GOAL.y-GOAL.back}]),
    actors:[{k:'S',name:'S'},{k:'M',name:'M'},{k:'TW',name:'TW',team:'gk'},{k:'Q1',name:''},{k:'Q2',name:''}],times:ts,
    pos:(k,t)=>k==='S'?st(t).sp:k==='M'?M0:k==='TW'?st(t).tw:k==='Q1'?QUEUE[0]:QUEUE[1],
    ball:t=>st(t).ball,
    notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];return p.title+': '+p.text;})});};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();
};

const q=n=>root.querySelector('[data-r="'+n+'"]');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const perp=v=>({x:-v.y,y:v.x});
const ang=v=>Math.atan2(v.y,v.x);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const qctrl=(a,b,c)=>add(lp(a,b,.5),perp(norm(sub(b,a))),c);
const qpt=(a,b,c,t)=>{const k=qctrl(a,b,c),u=1-t;return{x:u*u*a.x+2*u*t*k.x+t*t*b.x,y:u*u*a.y+2*u*t*k.y+t*t*b.y}};

/* Läufe vorbereiten: Startposition jedes Laufs */
const runs=cfg.runs.map(r=>Object.assign({},r)).sort((a,b)=>a.t0-b.t0);
{const cur={};Object.keys(POS).forEach(k=>cur[k]=POS[k]);
 runs.slice().sort((a,b)=>a.t0-b.t0).forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
function actorPos(k,T){
  let p=POS[k];
  for(const r of runs){if(r.w!==k)continue;if(T<=r.t0)break;
    if(T<r.t1)return qpt(r.from,r.to,r.c,ease(seg(T,r.t0,r.t1)));p=r.to;}
  return p;
}
function runningAt(k,T){return runs.find(r=>r.w===k&&T>r.t0&&T<r.t1)}
/* Pässe vorbereiten: Start- und Endpunkt des Balls */
const passes=cfg.passes.map(p=>{
  const from=actorPos(p.f,p.t0),to=p.toPt?QUEUE[0]:actorPos(p.to,p.t1);
  return Object.assign({},p,{s:add(from,norm(sub(to,from)),.8),e:add(to,norm(sub(from,to)),.9)});
});
function ballAt(T){
  if(T<passes[0].t0)return passes[0].s;
  let i=0;for(let k=0;k<passes.length;k++)if(T>=passes[k].t0)i=k;
  const p=passes[i];
  if(T<p.t1)return lp(p.s,p.e,1-Math.pow(1-seg(T,p.t0,p.t1),1.35));
  const n=passes[i+1];
  if(n)return lp(p.e,n.s,ease(seg(T,p.t1,n.t0)));   // Annahme / erster Kontakt
  return p.e;
}
function holderAt(T){let h=passes[0].f;for(const p of passes)if(T>=p.t1)h=p.to||p.toPt;else if(T>=p.t0)h=null;return h;}

const PH=cfg.ph, TEND=cfg.TEND, COL=cfg.col;
let T=0,playing=false,last=0,speed=1,showText=true,showRuns=true,showLeg=true,raf=0,alive=true,showWays=true,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowHead(X,Y,an,w){const h=Math.max(9,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
function line(p,r,o={}){
  const {c='#fff',w=2.6,a=1,dash=null,head=false}=o;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(p.x*K,p.y*K);ctx.lineTo(r.x*K,r.y*K);ctx.stroke();ctx.setLineDash([]);
  if(head&&len(sub(r,p))*K>4)arrowHead(r.x*K,r.y*K,ang(sub(r,p)),w);
  ctx.restore();
}
function curve(a,b,c,t1,o={}){
  const {col='#fff',w=2.2,al=1,dash=[5,6],head=false}=o;if(t1<=0)return;
  ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.setLineDash(dash);ctx.beginPath();
  for(let i=0;i<=40;i++){const p=qpt(a,b,c,t1*i/40);i?ctx.lineTo(p.x*K,p.y*K):ctx.moveTo(p.x*K,p.y*K);}
  ctx.stroke();ctx.setLineDash([]);
  if(head){const p=qpt(a,b,c,t1),p0=qpt(a,b,c,Math.max(0,t1-.05));arrowHead(p.x*K,p.y*K,ang(sub(p,p0)),w);}
  ctx.restore();
}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.8)',a=1}=o;
  const fs=clamp(K*.62,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function dotted(a,b){ctx.save();ctx.strokeStyle='rgba(20,30,20,.55)';ctx.lineWidth=Math.max(2,K*.14);ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(a.x*K,a.y*K);ctx.lineTo(b.x*K,b.y*K);ctx.stroke();ctx.restore();}
function mtext(p,t){ctx.save();ctx.fillStyle='rgba(20,30,20,.6)';ctx.font=`800 ${clamp(K*.7,10,15)}px system-ui,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,p.x*K,p.y*K);ctx.restore();}
function drawField(){
  const n=10;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#3a9a46':'#40a34c';ctx.fillRect(0,i*CH/n,CW,CH/n+1);}
  dotted(POS.A,{x:15,y:POS.B.y});dotted({x:POS.L.x,y:14},{x:23,y:14});
  mtext({x:13.6,y:9},'20 m');mtext({x:11.2,y:15},'8 m');mtext({x:19,y:15},'8 m');
}
function dummy(p){
  const w=1.7*K,h=Math.max(5,.55*K),X=p.x*K-w/2,Y=p.y*K-h/2;
  ctx.fillStyle='rgba(0,0,0,.3)';rr(X+2,Y+3,w,h,h/2);ctx.fill();
  ctx.fillStyle='#e9f26a';rr(X,Y,w,h,h/2);ctx.fill();ctx.strokeStyle='#6f7a10';ctx.lineWidth=1.2;ctx.stroke();
}
function cone(p){const X=p.x*K,Y=p.y*K,r=clamp(K*.5,5,9);ctx.fillStyle='#ffc21a';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();}
function player(p,lbl,face,o={}){
  const {fill='#ff9a3c',txt='#2a1400',ring=null,a=1}=o;
  const X=p.x*K,Y=p.y*K,r=clamp(K*1.0,9,16);
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(face)*(r+7),Y+Math.sin(face)*(r+7));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);
  ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  if(lbl){ctx.fillStyle=txt;ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);}
  ctx.restore();
}
function drawBall(p){
  const X=p.x*K,Y=p.y*K,r=clamp(K*.42,5,8);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();
}
function legend(){
  const fs=clamp(K*.55,9,12),pad=8,rowH=fs+8,lw=34;
  const rows=[['line','Pass ('+cfg.name+')'],['dash','Laufweg ohne Ball'],['rot','Positionswechsel']];
  ctx.save();ctx.font=`600 ${fs}px system-ui,sans-serif`;
  let tw=0;rows.forEach(r=>tw=Math.max(tw,ctx.measureText(r[1]).width));
  const bw=pad*3+lw+tw,bh=pad*2+rows.length*rowH,X=8,Y=CH-bh-8;
  ctx.fillStyle='rgba(10,16,24,.8)';rr(X,Y,bw,bh,8);ctx.fill();
  rows.forEach((r,i)=>{const y=Y+pad+rowH*i+rowH/2,x0=X+pad,x1=x0+lw;
    ctx.strokeStyle=r[0]==='rot'?'#f3f6f8':COL;ctx.lineWidth=r[0]==='rot'?1.8:2.4;ctx.lineCap='round';if(r[0]==='dash')ctx.setLineDash([4,4]);if(r[0]==='rot')ctx.setLineDash([2,5]);
    ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#e8eef3';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(r[1],x1+pad,y);});
  ctx.restore();
}
function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  drawField();DUM.forEach(dummy);cone({x:POS.A.x-.9,y:POS.A.y+.6});
  if(showWays){const i=phaseIdx(T),t0=PH[i].t,t1=(PH[i+2]||{t:TEND+1}).t;
    passes.forEach(p=>{if(p.t0>=t0-.01&&p.t0<t1&&T<p.t1)line(p.s,p.e,{c:COL,a:.5,w:2,head:true});});
    runs.forEach(r=>{if(r.t0>=t0-.01&&r.t0<t1&&T<r.t1)curve(r.from,r.to,r.c,1,r.rot?{col:'#f3f6f8',al:.5,w:1.6,dash:[2,5],head:true}:{col:COL,al:.5,w:2,head:true});});}
  if(showRuns){
    passes.forEach(p=>line(p.s,p.e,{c:COL,a:.25,w:2}));
    runs.forEach(r=>curve(r.from,r.to,r.c,1,r.rot?{col:'#f3f6f8',al:.22,w:1.6,dash:[2,5]}:{col:COL,al:.25,w:2}));
  }
  runs.forEach(r=>{if(T<=r.t0)return;const t=ease(seg(T,r.t0,r.t1));
    if(r.rot){curve(r.from,r.to,r.c,t,{col:'#f3f6f8',al:T>r.t1+1.2?.45:.85,w:1.8,dash:[2,5],head:t>=.98});
      if(T<r.t1)tag(add(qpt(r.from,r.to,r.c,.5),{x:0,y:-1.4}),'Wechsel '+r.w,{c:'#111',bg:'rgba(243,246,248,.9)'});}
    else curve(r.from,r.to,r.c,t,{col:COL,al:T>r.t1+1.2?.55:.95,head:t>=.98});});
  passes.forEach((p,i)=>{if(T<p.t0)return;const done=T>=p.t1;
    const nxt=passes[i+1],old=nxt&&T>=nxt.t0;
    line(p.s,done?p.e:ballAt(T),{c:COL,w:3,a:old?.5:1,head:done});
    if(T<p.t1+.6)tag(add(lp(p.s,p.e,.5),perp(norm(sub(p.e,p.s))),1.6),p.lbl,{c:'#fff',bg:COL});});
  const ball=ballAt(T),hold=holderAt(T);
  QUEUE.forEach((p,i)=>player(p,'',i===0&&T>=passes[passes.length-1].t0?ang(sub(ball,p)):Math.PI/2,{a:i===0&&hold==='N'?1:.45,ring:i===0&&hold==='N'?'#ffd34d':null}));
  Object.keys(POS).forEach(k=>{const p=actorPos(k,T),run=runningAt(k,T);
    let f=ang(sub(ball,p));if(run&&seg(T,run.t0,run.t1)<.7)f=ang(sub(run.to,p));
    if(len(sub(ball,p))<.3)f=-Math.PI/2;
    player(p,k,f,{ring:hold===k?'#ffd34d':null});});
  drawBall(ball);
  if(showLeg)legend();
}

/* ---------- UI ---------- */
const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{if(p.step<1)return;const c=document.createElement('span');c.className='chip';
  c.textContent=(p.step<99?p.step+' · ':'')+p.label;c.dataset.i=i;c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
const nSteps=PH.filter(p=>p.step>=1&&p.step<99).length;
let lastKey=-1;
function updateUI(){
  const i=phaseIdx(T),p=PH[i];
  if(i!==lastKey){lastKey=i;
    q('ovStep').textContent=p.step>=1&&p.step<99?cfg.name+' · Schritt '+p.step+' von '+nSteps:(p.step===0?cfg.name:'Zusammenfassung');
    q('ovTitle').textContent=p.title;q('ovText').textContent=p.text;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});
  }
  q('ov').classList.toggle('hidden',!showText);
  q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');
}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}
function restart(play){playing=!!play;setT(0);}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}playing=!playing;};
q('bRestart').onclick=()=>restart(true);
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
exOpts(root,['all','runs','text','ann'],o=>{showText=o.text;showRuns=o.all;showWays=o.runs;showAnn=o.ann;});
q('cLeg').onchange=e=>showLeg=e.target.checked;
root.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{if(b.dataset.v!==vk&&typeof openExercise==='function')openExercise('passdrill-'+b.dataset.v);});
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if(e.key==='r'||e.key==='R')restart(true);
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
resize();restart(false);raf=requestAnimationFrame(frame);
root._export=()=>{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
  const KEYS=['A','L','B','R'];
  return ttMk({Wm:W,Hm:H,hCol:'#ff9a3c',
    lines:[{t:'line',x1:POS.A.x,y1:POS.A.y,x2:15,y2:POS.B.y,dash:1},{t:'line',x1:POS.L.x,y1:14,x2:23,y2:14,dash:1},
      {t:'text',x:13.6,y:9,text:'20 m'},{t:'text',x:11.2,y:15,text:'8 m'},{t:'text',x:19,y:15,text:'8 m'}],
    items:DUM.map(d=>({kind:'dummy',x:d.x,y:d.y,c:'#e9f26a'})).concat([{kind:'cone',x:POS.A.x-.9,y:POS.A.y+.6,c:'#ffc21a'}]),
    actors:KEYS.map(k=>({k,name:k})).concat([{k:'N',name:''},{k:'N2',name:''}]),times:ts,
    pos:(k,t)=>k==='N'?QUEUE[0]:k==='N2'?QUEUE[1]:actorPos(k,t),
    ball:t=>ballAt(t),holder:t=>{const h=holderAt(t);return h==null?null:h;},
    notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];return p.title+': '+p.text;})});};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();
};
}

/* =====================================================================
   ÜBUNG 4: Passspiel auf zwei Minitore – rechts und links im Wechsel
   ===================================================================== */
function mountZweiTore(root){
root.className='pam';
const W=36,H=33;
root.innerHTML=`
  <h2>Passspiel auf zwei Minitore – rechts & links im Wechsel</h2>
  <p class="sub">S passt auf M, M dreht sich um die Puppe auf, Doppelpass mit B, B hinterläuft die Puppe, bekommt den Ball in den Lauf und schließt aufs Minitor ab. Danach dasselbe spiegelverkehrt auf der anderen Seite.</p>
  <div class="stage sq">
    <canvas data-r="cv"></canvas>
    <div class="ov bc" data-r="ov">
      <div class="ovStep" data-r="ovStep"></div>
      <div class="ovTitle" data-r="ovTitle"></div>
      <div class="ovText" data-r="ovText"></div>
    </div>
  </div>
  <div class="legendrow" data-r="leg">
    <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Pass</span>
    <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/></svg>Torschuss</span>
    <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" stroke="#7fd1ff" stroke-width="2.2" stroke-dasharray="5 5" stroke-linecap="round"/></svg>Laufweg</span>
    <span><svg width="30" height="8"><line x1="2" y1="4" x2="28" y2="4" stroke="#f3f6f8" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"/></svg>Positionswechsel</span>
  </div>
  <div class="steps" data-r="steps"></div>
  <div class="bar">
    <button data-r="bRestart">⟲ Neu</button>
    <button data-r="bPrev">◀ Schritt</button>
    <button data-r="bPlay" class="primary">▶ Abspielen</button>
    <button data-r="bNext">Schritt ▶</button>
    <label>Tempo
      <select data-r="sSpeed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select>
    </label>
  </div>
  <input type="range" data-r="rT" min="0" max="18.8" step="0.01" value="0" aria-label="Zeitleiste">
  ${exOptsHTML()}
  <div class="bar">
    <label><input type="checkbox" data-r="cRot" checked> Positionswechsel zeigen</label>
  </div>
  <div class="kbd">Tastatur: Leertaste = Play/Pause · ← → = Schritt · R = Neustart</div>
  <details>
    <summary>Übungsbeschreibung</summary>
    <h3>Organisation</h3>
    <ul>
      <li>Feld mit zwei Minitoren auf der Grundlinie (links und rechts)</li>
      <li>Startposition S mittig zwischen den Toren, Bälle am Start</li>
      <li>Eine Puppe in der Mitte mit Spieler M, je eine Puppe unten links und unten rechts mit Spieler B davor</li>
      <li>Hinter den unteren Puppen wartet jeweils der nächste Spieler</li>
    </ul>
    <h3>Ablauf (rechts, danach links spiegelverkehrt)</h3>
    <ol>
      <li><b>Pass:</b> S spielt flach auf M an der Mittelpuppe.</li>
      <li><b>Aufdrehen:</b> M nimmt den Ball mit und dreht sich um die Puppe Richtung B auf.</li>
      <li><b>Doppelpass:</b> M passt auf B, B lässt direkt in den Lauf von M klatschen.</li>
      <li><b>Hinterlaufen:</b> B läuft außen um seine Puppe, M spielt den Ball in den Lauf.</li>
      <li><b>Abschluss:</b> B schließt direkt oder mit einem Kontakt aufs Minitor ab.</li>
    </ol>
    <h3>Positionswechsel</h3>
    <ul>
      <li>S → wird neuer M (auf der anderen Seite der Mittelpuppe)</li>
      <li>M → stellt sich hinter der Puppe der gespielten Seite an</li>
      <li>Der Wartende rückt auf die B-Position nach</li>
      <li>B → holt den Ball und stellt sich am Start an</li>
    </ul>
    <h3>Coaching-Punkte</h3>
    <ul>
      <li>Pass flach und scharf, in den richtigen Fuß</li>
      <li>Vor dem Aufdrehen Schulterblick, erster Kontakt bereits in die Drehung</li>
      <li>Klatschen direkt, Pass in den Lauf vor den Spieler</li>
      <li>Hinterlaufen mit Tempo, Abschluss flach ins Eck</li>
    </ul>
    <h3>Variationen</h3>
    <ul>
      <li>Trainer gibt die Seite kurz vor dem ersten Pass vor</li>
      <li>Nur Direktspiel ab dem Doppelpass</li>
      <li>Passiver Verteidiger statt der unteren Puppe</li>
      <li>Abschluss nur mit dem schwachen Fuß</li>
    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
