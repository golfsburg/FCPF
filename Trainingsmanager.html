  --green:#0e6b2f;--green-deep:#083f1b;--green-text:#0b5a27;--red:#c8342d;--red-text:#a8261f;--red-bg:#fbeceb;--red-line:#efc3c0;
  --on-accent:#fff;--shadow:rgba(16,32,20,.14);
  --display:"FCPF Barlow","Barlow","Arial Narrow",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--panel:#172019;--fg:#e8eee9;--fg2:#c9d4cc;--muted:#9aa89e;--line:#2a362d;--tint:#1b2e21;
  --green-text:#6fcf8d;--red-text:#ff8a80;--red-bg:#2a1b1b;--red-line:#5a2a2a;--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1511;--panel:#172019;--fg:#e8eee9;--fg2:#c9d4cc;--muted:#9aa89e;--line:#2a362d;--tint:#1b2e21;
  --green-text:#6fcf8d;--red-text:#ff8a80;--red-bg:#2a1b1b;--red-line:#5a2a2a;--shadow:rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}

/* ===== App-Kopf ===== */
.appbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--green);display:grid;place-items:center;font-size:18px}
.appbar h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.01em}
.crumb{color:var(--muted);font-size:.85rem;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sp{flex:1}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.iconbtn:hover{background:var(--tint)}

/* ===== Ribbon ===== */
.tabs{display:flex;gap:2px;background:var(--panel);padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border:none;background:transparent;color:var(--muted);border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;font:inherit;font-size:.9rem}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--panel);color:var(--green-text);font-weight:700}
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px 6px 4px;min-height:108px}
.group{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--line);flex:0 0 auto}
.group:last-child{border-right:none}
.gitems{display:flex;gap:4px;flex:1}
.glabel{font-size:.66rem;color:var(--muted);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.rbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;min-height:76px;padding:7px 4px;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--fg);font:inherit;font-size:.76rem;line-height:1.15;text-align:center;cursor:pointer}
.rbtn .ic{width:34px;height:34px;display:grid;place-items:center;font-size:1.5rem}
.rbtn:hover{background:var(--tint);border-color:var(--line)}
.rbtn.on{background:var(--tint);border-color:var(--green)}
.rbtn.soon{opacity:.55}
.rbtn .badge{position:absolute;top:3px;right:4px;font-size:.58rem;background:var(--line);color:var(--fg2);border-radius:6px;padding:1px 5px}

/* ===== Inhalt ===== */
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.ovw h2{font-size:1.1rem;margin:6px 0 4px}
.ovw .tabsec{margin-top:18px}
.ovw h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--green-text);margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.card:hover{border-color:var(--green)}
.card.soon{opacity:.55}
.card .ic{font-size:1.6rem;width:36px;flex:0 0 36px;display:grid;place-items:center}
.card b{display:block;font-size:.95rem;margin-bottom:2px}
.card span{font-size:.8rem;color:var(--muted)}
.soonview{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);margin-top:10px}
.soonview .ic{font-size:2.6rem}
.soonview h2{color:var(--fg);margin:8px 0 4px}

/* ===== Übung: Pass · Annahme · Mitnahme (Präfix .pam) ===== */
.pam h2{font-size:1.2rem;margin:4px 0 2px}
.pam .sub{color:var(--muted);margin:0 0 12px;font-size:.9rem}
.pam .stage{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.pam canvas{display:block;width:100%;touch-action:pan-y}
.pam canvas.edit{touch-action:none;cursor:grab}
.pam .ov{position:absolute;right:10px;bottom:10px;max-width:46%;background:rgba(10,16,24,.84);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.pam .ovStep{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text);font-weight:700}
.pam .ovTitle{font-size:1.05rem;font-weight:700;margin:2px 0 4px}
.pam .ovText{font-size:.86rem;line-height:1.38;color:var(--fg2)}
.pam .decide{position:absolute;left:10px;bottom:10px;background:rgba(10,16,24,.92);border:2px solid var(--green);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;max-width:46%}
.pam .decide .q{font-weight:700;color:var(--green-text);font-size:.9rem}
.pam .decide button{text-align:left;font-size:.85rem}
.pam .hidden{display:none!important}
.pam .steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.pam .chip{padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:.8rem;cursor:pointer;user-select:none}
.pam .chip.done{color:var(--fg);border-color:var(--line)}
.pam .chip.on{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700}
.pam .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.pam button,.pam select{font:inherit;font-size:.88rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.pam button:hover{background:var(--tint)}
.pam button.primary{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700;min-width:120px}
.pam label{font-size:.86rem;color:var(--fg2);display:flex;align-items:center;gap:6px}
.pam input[type=range]{width:100%;accent-color:var(--green)}
.pam input[type=checkbox]{accent-color:var(--green);width:16px;height:16px}
.pam details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}
.pam summary{cursor:pointer;font-weight:700}
.pam details h3{font-size:.95rem;margin:12px 0 4px;color:var(--green-text)}
.pam details ul,.pam details ol{margin:4px 0;padding-left:20px;font-size:.9rem;line-height:1.5;color:var(--fg2)}
.pam .kbd{color:var(--muted);font-size:.78rem;margin-top:6px}
.pam .vbtn.on{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700}
.pam .ov.tl{left:10px;top:10px;right:auto;bottom:auto;max-width:42%}
@media (max-width:620px){.pam .ov.tl{max-width:none}}
.pam .ov.bc{left:50%;right:auto;bottom:10px;transform:translateX(-50%);max-width:62%;width:max-content}
.pam .legendrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:8px 0 0;font-size:.8rem;color:var(--fg2)}
.pam .legendrow span{display:flex;align-items:center;gap:6px}
@media (max-width:620px){.pam .ov.bc{transform:none;max-width:none;width:auto}}
.pam .ov.below{position:static;max-width:none;width:auto;transform:none;margin-top:10px}
.pam .callbar .lbl{font-size:.86rem;color:var(--fg2);font-weight:700}
.pam .cbtn{font-weight:700;min-width:64px}
.pam .cbtn:hover{filter:brightness(1.08)}
.pam .cbtn.on{box-shadow:0 0 0 3px #0f1720,0 0 0 5px #fff}
.pam .stage.tall{max-width:470px;margin:0 auto}
.pam .trigger{background:var(--panel);border-left:4px solid var(--green);padding:8px 12px;border-radius:8px;font-size:.88rem;margin:6px 0 10px;color:var(--fg2)}
.pam .vbtn:disabled{opacity:.45;cursor:not-allowed}
.pam .stage.sq{max-width:620px;margin:0 auto}
.pam .ov.nr{max-width:40%}
@media (max-width:620px){.pam .ov.nr{max-width:none}}
@media (max-width:620px){
  .pam .stage{overflow:visible}
  .pam .ov{position:static;max-width:none;border-radius:0 0 12px 12px;border-top:none}
  .pam .decide{position:static;max-width:none;margin-top:8px}
  .crumb{display:none}
}

/* ===== Taktiktafel (Präfix .tt) ===== */
.tt .ttform{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.tt .ttfield{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tt textarea,.tt input[type=text],.tt input[type=number]{width:100%;font:inherit;font-size:.88rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tt textarea{min-height:60px;resize:vertical}
.tt textarea#ttJson,.tt textarea[data-r="copyBox"]{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.4}
.tt textarea:focus,.tt input:focus,.tt button:focus-visible,.tt select:focus{outline:2px solid var(--green);outline-offset:1px}
.tt .ttgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tt .ttgrid>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt .filebtn{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--fg)}
.tt .filebtn:hover{background:var(--tint)}
.tt .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tt .ttmsg{font-size:.86rem;padding:8px 12px;border-radius:8px;border-left:4px solid var(--line);background:var(--bg)}
.tt .ttmsg.ok{border-left-color:#4cc36a}
.tt .ttmsg.err{border-left-color:var(--red);color:var(--red-text)}
.tt .ttnote{font-size:.8rem;color:var(--muted);margin:4px 0}
.tt .tth{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--green-text);margin:18px 0 8px}
.tt .ttempty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:.88rem}
.tt .ttcard{position:relative;align-items:center}
.tt .ttcbody{flex:1;min-width:0}
.tt .ttdel{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--red-text);font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
.tt .ttdel:hover{background:var(--red-bg);border-color:var(--red-line)}
.tt .ttconfirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:.82rem;color:var(--red-text)}
.tt .ttconfirm[hidden]{display:none!important}
.tt .ttconfirm button{font-size:.8rem;padding:5px 10px}
.tt .ttconfirm button:first-of-type{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.tt .ttbarc{background:var(--red-bg);border:1px solid var(--red-line);border-radius:10px;padding:8px 12px;margin:6px 0}
.tt .ttdelbtn{color:var(--red-text)}
.tt [data-r="msg"]{min-height:1.2em}
.tt .ttrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;flex-wrap:wrap}
.tt .ttlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;min-width:88px;padding-top:7px}
.tt .ttchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.tt .ttchip{padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--fg2);font-size:.8rem}
.tt .ttchip:hover{border-color:var(--green);background:var(--panel)}
.tt .ttchip.on{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700}
.tt .ttchip.sw{width:28px;height:28px;padding:0;border-radius:50%;background:var(--sw);border:2px solid var(--line)}
.tt .ttchip.sw.on{box-shadow:0 0 0 2px #0f1720,0 0 0 4px #fff;border-color:var(--sw)}
.tt .tttools{display:flex;gap:4px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;margin:10px 0 6px;scrollbar-width:thin}
.tt .tttool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66px;padding:6px 4px;background:transparent;border:1px solid transparent;border-radius:9px;font-size:.72rem;color:var(--fg)}
.tt .tttool .ic{height:22px;display:grid;place-items:center}
.tt .tttool:hover{background:var(--tint);border-color:var(--line)}
.tt .tttool.on{background:var(--tint);border-color:var(--green)}
.tt .tthint{font-size:.82rem;color:var(--muted);margin:0 0 8px;min-height:1.2em}
.tt .ttedcv{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tt .ttpanel{background:var(--panel);border:1px solid var(--green);border-radius:12px;padding:10px 14px;margin:10px auto 0;max-width:470px}
.tt .ttpanel[hidden]{display:none!important}
.tt .ttphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tt .ttpdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.tt .ttgrid3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:8px}
.tt .ttgrid3>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tt .ttsteps{margin-top:12px}
.tt .ttsave{margin-top:14px}
.tt button:disabled{opacity:.45;cursor:not-allowed}
.tt .ttactions button.primary{min-width:0}
@media (max-width:620px){.tt .ttgrid3{grid-template-columns:1fr 1fr}.tt .ttlbl{min-width:0;width:100%;padding-top:0}}
.tt [hidden]{display:none!important}
.tt .ttsel{width:100%;font:inherit;font-size:.88rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tt .ttcat{display:block;margin-top:3px;font-size:.72rem;color:var(--green-text);letter-spacing:.02em}
.tt .ttcatbox{margin-top:14px}
.tt .ttcatbox .ttform{margin-top:10px}
.tt .ttdup{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--fg2);font-size:1.05rem;padding:6px 8px;border-radius:8px;cursor:pointer}
.tt .ttdup:hover{background:var(--tint);border-color:var(--line)}
.ttdupbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.ttdupmsg{font-size:.8rem;color:var(--muted)}
.exopts label.off{opacity:.4;cursor:not-allowed}
.exopts{margin-bottom:0}
.tt .ttselsm{width:auto;min-width:180px;padding:6px 10px}
.tt .ttkader{display:flex;flex-direction:column;gap:4px;margin:8px 0 2px}
.tt .ttroster{display:flex;flex-direction:column;gap:6px}
.tt .ttrp{display:grid;grid-template-columns:56px 64px minmax(0,2fr) minmax(0,1fr) auto auto;grid-template-areas:"ph nr nm sh tw del";gap:8px;align-items:end;padding:6px 0;border-bottom:1px solid var(--line)}
.tt .ttrp .ttph{grid-area:ph;align-self:center}.tt .ttrp .ttrnr{grid-area:nr}.tt .ttrp .ttrn{grid-area:nm}.tt .ttrp .ttrs{grid-area:sh}.tt .ttrp .tttw{grid-area:tw}.tt .ttrp .ttdel{grid-area:del}
.tt .ttrf{display:flex;flex-direction:column;gap:3px;min-width:0}
.tt .ttrp input[type=number].dup{border-color:var(--red);color:var(--red-text)}
.tt .ttph{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:.68rem;color:var(--muted)}
.tt .ttph img{width:100%;height:100%;object-fit:cover;display:block}
.tt .ttph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tt .ttph:hover{border-color:var(--green)}
.tt .tttw{font-size:.8rem;color:var(--fg2);padding-bottom:8px}
.tt .ttwarn{color:var(--red-text)}
@media (max-width:620px){.tt .ttrp{grid-template-columns:56px 64px minmax(0,1fr) auto;grid-template-areas:"ph nr nm nm" "ph tw sh del"}}
.ghbtn.ro{color:var(--muted)}.ghbtn.err{border-color:var(--red);color:var(--red-text)}
.ghdlg .notesbody{display:flex;flex-direction:column;gap:6px;padding-bottom:14px}
.ghdlg input{width:100%;font:inherit;font-size:.88rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ghdlg input:focus,.ghdlg button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.ghf{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:4px}
.ghtxt,.ghhelp{font-size:.82rem;color:var(--fg2);line-height:1.45;margin:0}
.ghhelp summary{cursor:pointer;font-weight:700;color:var(--fg)}.ghhelp ol{padding-left:18px;margin:6px 0}
.ghstate{margin:0;font-size:.85rem;font-weight:700;color:var(--fg2)}.ghstate.ok{color:var(--green-text)}.ghstate.err{color:var(--red-text)}
.ghbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ghbar button{font:inherit;font-size:.85rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.ghbar .ghprim{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700}
.ghmsg{font-size:.82rem;color:var(--green-text);margin:0;min-height:1.2em}
.appbar .iconbtn{white-space:nowrap}
.appbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:520px){#btnFull{display:none}.appbar{gap:8px;padding-left:12px;padding-right:12px}.appbar h1{font-size:.98rem}}
/* ===== Release Notes ===== */
.appver{font-size:.72rem;font-weight:700;color:var(--green-text);background:var(--tint);border-radius:6px;padding:2px 6px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.notesbtn{position:relative}
.notesdot{display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--panel)}
.notesbtn.fresh{border-color:var(--green);color:var(--green-text)}
.notesbtn.fresh .notesdot{display:block}
.notesov{position:fixed;inset:0;z-index:50;background:rgba(5,9,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) 16px 16px}
.notesov[hidden]{display:none!important}
.notesdlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.noteshead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.noteshead h2{margin:0;font-size:1.05rem}
.notesbody{overflow-y:auto;padding:0 16px 4px}
.noteitem{border-top:1px solid var(--line);padding:10px 0}
.noteitem:first-child{border-top:none}
.notesmeta{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.notesv{font-weight:800;color:var(--fg2);background:var(--tint);border-radius:6px;padding:1px 6px}
.noteitem.cur .notesv{background:var(--green);color:var(--on-accent)}
.noteitem h3{margin:4px 0 4px;font-size:.92rem}
.noteitem ul{margin:0;padding-left:18px;font-size:.85rem;line-height:1.45;color:var(--fg2)}
.notesfoot{margin:0;padding:10px 16px 14px;font-size:.76rem;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:420px){.appver{display:none}}

/* ===== FCPF-Layout ===== */
html,body{height:auto;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
main{flex:1;width:100%;max-width:1100px}
/* schlanker Kopf */
.appbar{position:relative;gap:10px;padding:7px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));padding-top:calc(7px + env(safe-area-inset-top,0px));
  background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
.appbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--green) 0 70%,var(--red) 70% 100%)}
.appbar .back{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font:700 11.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;
  padding:7px 8px 6px 4px;border-radius:5px}
.appbar .back svg{width:15px;height:15px}
.appbar .back:hover{color:var(--green-text);background:var(--tint)}
.appbar .back:focus-visible,.appbar .iconbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.appbar .crest{width:26px;height:auto;flex:none;display:block}
.appbar .vsep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line);flex:none}
.appbar h1{font:900 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--fg);margin:0}
.crumb{color:var(--muted);font-size:12.5px}
.iconbtn{font:700 11.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--panel);color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.iconbtn:hover{background:var(--tint);color:var(--green-text);border-color:var(--line)}
.appver{font:700 10.5px/1 var(--display);letter-spacing:.06em;background:var(--tint);color:var(--green-text);border-radius:3px;padding:4px 5px 3px}
.notesdot{background:var(--red);box-shadow:0 0 0 2px var(--panel)}
/* Reiter wie die Navigationsleiste der Ergebnisse */
.tabs{background:var(--panel);border-bottom:1px solid var(--line);padding:0 max(10px,env(safe-area-inset-left,0px));gap:2px}
.tab{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 12px 10px;border-radius:0;border-bottom:3px solid transparent}
.tab:hover{color:var(--green-text);background:transparent}
.tab.on{background:transparent;color:var(--green-text);border-bottom-color:var(--green);font-weight:700}
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04);min-height:100px}
.glabel{font:700 10px/1.2 var(--display);letter-spacing:.12em;color:var(--muted)}
.rbtn{color:var(--fg)}
.rbtn.on{background:var(--tint);border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.rbtn .badge{background:var(--tint);color:var(--muted)}
/* Überschriften wie .h2 der Ergebnisse */
.pam h2,.ovw h2{display:flex;align-items:center;gap:10px;font:900 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 6px}
.pam h2::before,.ovw h2::before{content:"";width:7px;height:22px;background:linear-gradient(var(--green) 0 60%,var(--red) 60% 100%);border-radius:2px;flex:none}
.ovw h3,.pam details h3{font:700 13px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase}
.pam .sub,.ovw p{color:var(--muted)}
.card{border-radius:8px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.card b{font:700 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pam .stage{border-radius:8px;box-shadow:0 4px 18px var(--shadow)}
.pam details{border-radius:8px}
.pam summary{font:700 13px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase}
.pam button.primary{font-weight:700}
.pam .chip{font:700 11.5px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px}
.pam .chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* Overlays auf dem Spielfeld bleiben dunkel */
.pam .ov,.pam .decide{--fg:#e8eef3;--fg2:#d5dee6;--muted:#c3d0db;--green:#ffd34d;--green-text:#ffd34d;--panel:#1d2a37;--line:#33475a;--tint:#26384a;--on-accent:#111;color:var(--fg)}
.notesov{background:rgba(10,20,14,.55)}
.notesdlg{box-shadow:0 18px 50px var(--shadow)}
/* Footer */
.foot{margin-top:28px;border-top:4px solid var(--green);background:#fff;color:#1b1b1b}
.foot .fw{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.foot strong{font:900 16px/1 var(--display);color:#0e6b2f;display:block;margin-bottom:5px}
.foot p{margin:0;font-size:12px;color:#4a4f4b}
.foot a{color:#0e6b2f}

/* ===================== App-Shell ===================== */
const tabsEl=document.getElementById('tabs'),ribbonEl=document.getElementById('ribbon'),
      viewEl=document.getElementById('view'),crumbEl=document.getElementById('crumb');
let curTab='pass',curEx=null,destroyFn=null;

function setHash(h){try{history.replaceState(null,'',h)}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function renderTabs(){
  tabsEl.innerHTML='';
  TABS.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t.id===curTab?' on':'');
    b.textContent=t.label;b.onclick=()=>selectTab(t.id);tabsEl.appendChild(b);});
}
function selectTab(id){
  curTab=id;
  if(id==='all'){openOverview();return;}
  const list=EXERCISES.filter(e=>e.tab===id);
  const first=list.find(e=>!e.soon)||list[0];
  if(first)openExercise(first.id);else{renderTabs();renderRibbon();}
}
function rbtn(ex){
  const b=document.createElement('button');b.className='rbtn'+(ex.soon?' soon':'')+(curEx===ex.id?' on':'');
  b.title=ex.short||'';
  b.innerHTML='<span class="ic">'+ex.icon+'</span><span>'+ex.title+'</span>'+(ex.soon?'<span class="badge">bald</span>':'');
  b.onclick=()=>openExercise(ex.id);return b;
}
function renderRibbon(){
  ribbonEl.innerHTML='';
  const list=curTab==='all'?EXERCISES:EXERCISES.filter(e=>e.tab===curTab);
  const groups={};
  list.forEach(e=>{const g=curTab==='all'?TABS.find(t=>t.id===e.tab).label:e.group;(groups[g]=groups[g]||[]).push(e);});
  Object.keys(groups).forEach(g=>{
    const grp=document.createElement('div');grp.className='group';
    const it=document.createElement('div');it.className='gitems';groups[g].forEach(e=>it.appendChild(rbtn(e)));
    const lb=document.createElement('div');lb.className='glabel';lb.textContent=g;
    grp.appendChild(it);grp.appendChild(lb);ribbonEl.appendChild(grp);
  });
  const ov=document.createElement('div');ov.className='group';
  ov.innerHTML='<div class="gitems"></div><div class="glabel">Ansicht</div>';
  const ob=document.createElement('button');ob.className='rbtn'+(curEx===null?' on':'');
  ob.innerHTML='<span class="ic">▦</span><span>Übersicht</span>';ob.onclick=openOverview;
  ov.firstChild.appendChild(ob);ribbonEl.appendChild(ov);
}
function cleanup(){if(destroyFn){try{destroyFn()}catch(e){}destroyFn=null}viewEl.innerHTML='';}

function openExercise(id){
  const ex=EXERCISES.find(e=>e.id===id);if(!ex)return openOverview();
  cleanup();curEx=id;curTab=ex.tab;store('lastEx',id);
  try{if(location.hash!=='#'+id)setHash('#'+id);}catch(e){}
  crumbEl.textContent=TABS.find(t=>t.id===ex.tab).label+' › '+ex.title;
  if(ex.soon||!ex.mount){
    viewEl.innerHTML='<div class="soonview"><div class="ic">'+ex.icon+'</div><h2>'+ex.title+'</h2><p>'+(ex.short||'')+'</p><p>Diese Übung ist in Vorbereitung.</p></div>';
  }else{
    const root=document.createElement('div');viewEl.appendChild(root);destroyFn=ex.mount(root);
    try{ttAddDupButton(root,ex);}catch(e){}
  }
  renderTabs();renderRibbon();window.scrollTo(0,0);
}
function openOverview(){
  cleanup();curEx=null;try{setHash(location.pathname+location.search);}catch(e){}
  crumbEl.textContent='Übersicht';
  const w=document.createElement('div');w.className='ovw';
  w.innerHTML='<h2>Alle Übungen</h2><p style="color:var(--muted);margin:0;font-size:.9rem">Übung im Ribbon oder hier auswählen.</p>';
  TABS.filter(t=>t.id!=='all').forEach(t=>{
    const list=EXERCISES.filter(e=>e.tab===t.id);if(!list.length)return;
    const sec=document.createElement('div');sec.className='tabsec';sec.innerHTML='<h3>'+t.label+'</h3>';
    const grid=document.createElement('div');grid.className='cards';
    list.forEach(e=>{const c=document.createElement('div');c.className='card'+(e.soon?' soon':'');
      c.innerHTML='<div class="ic">'+e.icon+'</div><div><b>'+e.title+'</b><span>'+(e.soon?'In Vorbereitung':e.short)+'</span></div>';
      c.onclick=()=>openExercise(e.id);grid.appendChild(c);});
    sec.appendChild(grid);w.appendChild(sec);
  });
  viewEl.appendChild(w);renderTabs();renderRibbon();
}
document.getElementById('btnFull').onclick=()=>{
  const d=document;
  if(d.fullscreenElement){d.exitFullscreen&&d.exitFullscreen();}
  else{const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
};
try{window.addEventListener('hashchange',()=>{let id='';try{id=location.hash.slice(1)}catch(e){}if(id&&id!==curEx)openExercise(id);});}catch(e){}

  <details>

    <h3>Organisation</h3>
    <ul>
      <li>Feld ca. 40 × 26 m, 3 Spieler (A, B, C), 1 Ball, Hütchen zum Markieren der freien Räume</li>

    <h3>Ablauf</h3>

      <li>Kopf hoch <i>bevor</i> der Ball ankommt – nicht erst danach</li>
      <li>Entscheidung vor dem ersten Kontakt treffen</li>
      <li>Mitnehmen statt stoppen – Tempo halten, Ball nah am Fuß</li>
    </ul>
    <h3>Variationen</h3>
    <ul>
      <li>Trainer zeigt kurz vor der Annahme mit Hand/Farbe die Option an</li>
      <li>Passiver Gegenspieler, der eine Option zustellt</li>
      <li>Kontaktbegrenzung: Annahme + Pass (2 Kontakte)</li>
      <li>Schwacher Fuß, Zeitlimit oder Wettkampf auf Pässe pro Minute</li>
    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const W=40,H=26;
const DEF={A:{x:8,y:21},B:{x:20,y:14},C:{x:33,y:5}};
let P=JSON.parse(JSON.stringify(DEF));
const PH=[
 {k:'intro', t:0,    step:0,label:'Start',       title:'Ausgangslage',
  text:'A hat den Ball. B bietet sich zentral an, C steht vorne rechts. Gelb markiert: die freien Räume.'},
 {k:'pass',  t:1.0,  step:1,label:'Pass',        title:'Pass',
  text:'A spielt einen flachen, scharfen Pass mit der Innenseite auf B. Danach sofort „Pass & geh“.'},
 {k:'scan',  t:1.5,  step:2,label:'Kopf hoch',   title:'Kopf hoch',
  text:'Noch bevor der Ball ankommt, schaut B über die Schulter: Wo ist Platz? Wo stehen meine Mitspieler?'},

 {k:'recv',  t:3.8,  step:4,label:'Annahme',     title:'Annahme',text:''},
 {k:'carry', t:4.65, step:5,label:'Mitnahme',    title:'Mitnahme in den Raum',
  text:'Ball nicht stoppen, sondern mit dem ersten Kontakt 2–3 m in den freien Raum mitnehmen. Ball bleibt nah am Fuß.'},
 {k:'pass2', t:5.75, step:6,label:'Weiterpass',  title:'Weiterpass',text:''},
 {k:'end',   t:7.05, step:7,label:'Fazit',       title:'Coaching-Punkte',
  text:'Pass flach & scharf · Kopf hoch vor der Annahme · Entscheidung vor dem Ballkontakt · Mitnehmen statt stoppen · Tempo halten.'}
];
const TEND=8.6,DEC=2.4,HOLD=2.75;
const OPT={1:'Mitnahme nach vorne rechts → Steilpass auf C',2:'Mitnahme nach links → Pass auf den freilaufenden A'};

let T=0,playing=false,last=0,speed=1,chosen=null,mode='manual',autoOpt=1,waiting=false;

const cv=q('cv'),ctx=cv.getContext('2d');

const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, easeOut=t=>1-Math.pow(1-t,3);
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);

const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});

const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerpAng=(a,b,t)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t};
const inField=p=>({x:clamp(p.x,2,W-2),y:clamp(p.y,2,H-2)});
const getA2=()=>inField({x:P.A.x+3,y:P.A.y-13});
const rev=()=>!!chosen&&(mode==='manual'||T>=DEC+0.8);

function st(T){
  const A2=getA2();
  const dA=norm(sub(P.B,P.A));
  const start=add(P.A,dA,1.0), recv=add(P.B,dA,-1.0);
  const opts=[1,2].map(i=>{const tg=i===1?P.C:A2;const d=norm(sub(tg,P.B));
    return{tg,d,M:add(P.B,d,4.5),zone:inField(add(P.B,d,6.5))}});
  const oi=chosen||1,o=opts[oi-1];
  const tgPt=add(o.tg,norm(sub(o.tg,o.M)),-1.0);
  const aPos=lp(P.A,A2,ease(seg(T,1.6,5.4)));
  let u; if(T<2.4)u=0.62*seg(T,1.0,2.4); else if(T<3.8)u=0.62; else u=0.62+0.38*seg(T,3.8,4.65);
  let ball=lp(start,recv,u), bPos={x:P.B.x,y:P.B.y};
  if(T>=4.65){ball=lp(recv,o.M,easeOut(seg(T,4.65,5.35)));bPos=lp(P.B,add(o.M,o.d,-1.0),ease(seg(T,4.65,5.75)));}
  if(T>=5.75){const v=seg(T,5.75,7.05);ball=lp(o.M,tgPt,1-Math.pow(1-v,1.6));}
  const base=ang(sub(P.A,P.B)), aC=ang(sub(P.C,P.B)), aA2=ang(sub(A2,P.B));
  let fB=ang(sub(T<1.0?P.A:ball,bPos));
  if(T>=1.5&&T<2.4){const s=seg(T,1.5,2.4);
    if(s<1/3)fB=lerpAng(base,aC,ease(s*3));
    else if(s<2/3)fB=lerpAng(aC,aA2,ease((s-1/3)*3));
    else fB=lerpAng(aA2,base,ease((s-2/3)*3));}
  if(T>=2.4&&T<4.65)fB=base;
  if(T>=4.65&&T<5.75)fB=ang(o.d);
  if(T>=5.75)fB=ang(sub(o.tg,bPos));
  let fA=ang(sub(P.B,P.A)); if(T>=1.6&&T<5.4)fA=ang(sub(A2,P.A)); if(T>=5.4)fA=ang(sub(ball,aPos));
  const fC=ang(sub(ball,P.C));

}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function cone(x,y){const X=x*S,Y=y*S,r=clamp(S*.45,5,8);ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.8,Y+r*.6);ctx.lineTo(X-r*.8,Y+r*.6);ctx.closePath();ctx.fill();}
function drawField(){
  const n=10;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(i*CW/n,0,CW/n+1,CH);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(.8*S,.8*S,(W-1.6)*S,(H-1.6)*S);
  [[.8,.8],[W-.8,.8],[.8,H-.8],[W-.8,H-.8]].forEach(([x,y])=>cone(x,y));
  const fs=clamp(S*.42,9,12);ctx.font=`600 ${fs}px system-ui,sans-serif`;ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('↑ Spielrichtung',1.4*S,1.3*S);
}
function line(p,r,o={}){
  const {c='#fff',w=2,a=1,dash=null,head=false,curve=0}=o;
  const X1=p.x*S,Y1=p.y*S,X2=r.x*S,Y2=r.y*S;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  let cx=(X1+X2)/2,cy=(Y1+Y2)/2;
  if(curve){const dx=X2-X1,dy=Y2-Y1,l=Math.hypot(dx,dy)||1;cx+=-dy/l*curve*S;cy+=dx/l*curve*S;}
  ctx.beginPath();ctx.moveTo(X1,Y1);ctx.quadraticCurveTo(cx,cy,X2,Y2);ctx.stroke();ctx.setLineDash([]);
  if(head&&Math.hypot(X2-X1,Y2-Y1)>4){const an=Math.atan2(Y2-cy,X2-cx),h=Math.max(9,w*3.2);
    ctx.beginPath();ctx.moveTo(X2,Y2);ctx.lineTo(X2-h*Math.cos(an-.45),Y2-h*Math.sin(an-.45));
    ctx.lineTo(X2-h*Math.cos(an+.45),Y2-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
  ctx.restore();
}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.78)',a=1}=o;
  const fs=clamp(S*.5,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*S-w/2,3,CW-w-3),Y=clamp(p.y*S-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function zone(c,a,label){
  const X=c.x*S,Y=c.y*S,R=3.6*S;ctx.save();ctx.globalAlpha=clamp(a,0,1);
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,224,90,.5)');g.addColorStop(1,'rgba(255,224,90,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,R,0,7);ctx.fill();
  ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(255,236,150,.85)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X,Y,R*.8,0,7);ctx.stroke();ctx.restore();
  if(label&&a>.4)tag({x:c.x,y:c.y+2.2},'freier Raum',{c:'#3a2c00',bg:'rgba(255,230,120,.85)',a});
}
function badge(p,n,a){
  if(!showAnn)return;
  const r=clamp(S*.6,8,12);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(p.x*S,p.y*S,r,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.font=`800 ${r*1.15}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(n),p.x*S,p.y*S+1);ctx.restore();
}
function vision(p,an,a){
  const X=p.x*S,Y=p.y*S,R=11*S,h=.42;ctx.save();ctx.globalAlpha=clamp(a,0,1);
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,255,255,.42)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,R,an-h,an+h);ctx.closePath();ctx.fill();ctx.restore();
}
function player(p,lbl,face,focus){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.95,10,17);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(face)*(r+7),Y+Math.sin(face)*(r+7));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);
  ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2f6bff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=focus?3.5:2;ctx.strokeStyle=focus?'#ffd34d':'#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);
}
function ghost(p,lbl){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.95,10,17);ctx.save();ctx.globalAlpha=.55;
  ctx.setLineDash([3,4]);ctx.strokeStyle='#cfe0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.stroke();
  ctx.fillStyle='#cfe0ff';ctx.font=`700 ${r*.8}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);ctx.restore();
}
function drawBall(p){
  const X=p.x*S,Y=p.y*S,r=clamp(S*.42,5,8);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();
}
function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  const s=st(T),now=performance.now()/1000,R=rev();
  const pulse=waiting?.6+.4*Math.sin(now*6):1;
  drawField();
  if(showAll){const o=s.o;line(s.start,s.recv,{c:'#fff',w:2,a:.22});line(s.recv,o.M,{c:'#ffd34d',w:2,a:.25,curve:.6});
    line(o.M,s.tgPt,{c:'#fff',w:2,a:.22,head:true});line(P.A,s.A2,{c:'#cfe0ff',w:1.6,a:.25,dash:[3,6],head:true,curve:-1.2});}
  s.opts.forEach((o,i)=>{const n=i+1;let a=T<1.5?.45:T<4.65?.95:.55;
    if(R)a=n===s.oi?1:.22; if(T>=5.75&&n!==s.oi)a=.12; if(waiting)a*=pulse;
    zone(o.zone,a,T>=1.5&&T<5.75&&(!R||n===s.oi));});
  if(showRuns&&T>=1.3&&T<7.05)line(P.A,s.A2,{c:'#cfe0ff',w:1.6,a:.65,dash:[3,6],head:true,curve:-1.2});
  if(T>=1.6&&T<5.4)ghost(s.A2,'A');
  if(showRuns&&T>=1.6&&T<3.8)tag(lp(P.A,s.A2,.45),'Pass & geh',{c:'#dbe7ff',a:.9});
  if(T>=2.0&&T<5.75){const f=seg(T,2.0,2.4);
    s.opts.forEach((o,i)=>{const n=i+1,ch=R&&n===s.oi;
      let a=f*(R?(ch?1:.35):.95)*(waiting?pulse:1); if(T>=4.65&&!ch)a*=.5;
      line(P.B,o.tg,{c:(ch||!R)?'#ffd34d':'#c9d3dc',w:ch?3:2,a,dash:[8,7],head:true});
      if(T<4.65)badge(lp(P.B,o.tg,.55),n,a);});}
  if(T>=.4){const done=T>=4.65;
    if(!done)line(s.start,s.recv,{c:'#fff',w:1.5,a:.45,dash:[2,6]});
    if(s.u>0)line(s.start,done?s.recv:lp(s.start,s.recv,s.u),{c:'#fff',w:2.6,a:done?.5:.95,head:done});
    if(T>=1.0&&T<4.65)tag(add(lp(s.start,s.recv,.45),perp(s.dA),1.9),'flacher Pass');}
  if(T>=2.4&&T<4.4){s.opts.forEach((o,i)=>{const n=i+1,ch=R&&n===s.oi;
    line(s.recv,o.M,{c:'#ffd34d',w:ch?3:2,a:(R?(ch?1:.25):.8)*(waiting?pulse:1),dash:ch?null:[4,4],head:true,curve:.6});});}
  if(T>=4.4){line(s.recv,s.o.M,{c:'#ffd34d',w:4,a:T>=7.05?.6:1,head:true,curve:.6});
    if(T<7.05)tag(add(lp(s.recv,s.o.M,.5),perp(s.o.d),-1.6),'Mitnahme',{c:'#3a2c00',bg:'#ffd34d'});}
  if(T>=5.75){const fin=T>=7.05;
    line(s.o.M,fin?s.tgPt:s.ball,{c:'#fff',w:2.6,a:.95,head:fin});
    tag(add(lp(s.o.M,s.tgPt,.5),perp(s.o.d),1.7),s.oi===1?'Steilpass auf C':'Pass auf A');}
  if(T>=1.5&&T<3.8)vision(s.bPos,s.fB,T<2.4?.95:.35);
  if(T>=5.6&&T<6.1)vision(s.bPos,s.fB,.5);
  player(P.C,'C',s.fC,false);
  player(s.aPos,'A',s.fA,false);
  player(s.bPos,'B',s.fB,true);
  drawBall(s.ball);
  if(T>=1.5&&T<2.7)tag(add(s.bPos,{x:0,y:-2.6}),'👀 Kopf hoch!',{c:'#111',bg:'#ffd34d'});
  if(waiting)tag(add(s.bPos,{x:0,y:-2.6}),'① oder ② ?',{c:'#111',bg:'#ffd34d',a:pulse});
  if(T>=4.45&&T<5.1)tag(add(s.ball,{x:0,y:2.2}),'1. Kontakt');
  if(edit)tag({x:W/2,y:1.8},'✋ Spieler ziehen zum Verschieben',{c:'#111',bg:'#ffd34d'});
}

const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{if(p.step<1)return;const c=document.createElement('span');c.className='chip';
  c.textContent=(p.step<7?p.step+' · ':'')+p.label;c.dataset.i=i;c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
function phaseText(p){
  if(p.k==='decide'){
    if(waiting)return 'Standbild! B hat vor der Annahme hochgeschaut. Jetzt entscheiden: ① '+OPT[1]+' oder ② '+OPT[2]+'?';
    if(rev())return 'Entscheidung gefallen: Option '+chosen+' – '+OPT[chosen]+'.';
  }
  if(p.k==='recv')return 'Offene Körperstellung, Ball mit dem ballfernen Fuß annehmen – der erste Kontakt zeigt schon Richtung Option '+(chosen||1)+'.';
  if(p.k==='pass2')return (chosen||1)===1?'Kopf wieder hoch und präzise steil auf C spielen – in den Lauf.':'Kopf wieder hoch: A hat sich nach seinem Pass freigelaufen – flacher Pass in den Fuß.';
  return p.text;
}
let lastKey='';
function updateUI(){
  const i=phaseIdx(T),p=PH[i];
  const key=i+'|'+waiting+'|'+chosen+'|'+mode+'|'+rev();
  if(key!==lastKey){lastKey=key;
    q('ovStep').textContent=p.step>=1&&p.step<=6?'Schritt '+p.step+' von 6':(p.step===0?'Übung':'Zusammenfassung');
    q('ovTitle').textContent=p.title;q('ovText').textContent=phaseText(p);
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});
  }
  q('decide').classList.toggle('hidden',!waiting);
  q('ov').classList.toggle('hidden',!showText);
  q('rT').value=T;

function setT(t){

function restart(play){T=0;chosen=mode==='auto'?autoOpt:null;waiting=false;playing=!!play;setT(0);}

      items:[[.8,.8],[W-.8,.8],[.8,H-.8],[W-.8,H-.8]].map(([x,y])=>({kind:'cone',x,y,c:'#ff8a1f'})),
      actors:[{k:'A',name:'A'},{k:'B',name:'B'},{k:'C',name:'C'}],times:ts,

      notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];T=t;return p.title+': '+phaseText(p);})});}
  finally{chosen=keep;T=keepT;waiting=keepW;}};

const q=n=>root.querySelector('[data-r="'+n+'"]');
const W=40,H=45;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* Positionen in Metern (Tor oben) */
const GOAL={x1:16.3,x2:23.7,y:2,back:.8};
const CONE={x:20.8,y:40.6}, S0={x:21.6,y:41.5};
const QUEUE=[{x:22.5,y:42.8},{x:23.2,y:44}];
const P1={x:12.2,y:29.4};                 // Ende Andribbeln

const D0={x:12.2,y:15.0};                 // nach der Mitnahme
const E={x:18.4,y:13.2};                  // Schussposition
const GP={x:18.2,y:1.4};                  // Torschuss-Ziel

/* ---------- Zustand ---------- */
function st(T){
  const dirD1=norm(sub(P1,S0));

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

}
function dummy(p){

  ctx.fillStyle='#3b1a06';ctx.beginPath();ctx.arc(p.x*K,p.y*K,Math.max(2,h*.28),0,7);ctx.fill();

function cone(p){const X=p.x*K,Y=p.y*K,r=clamp(K*.5,5,9);ctx.fillStyle='#e8352b';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();}
function line(p,r,o={}){
  const {c='#fff',w=2.4,a=1,dash=null,head=false,curve=0}=o;
  const X1=p.x*K,Y1=p.y*K,X2=r.x*K,Y2=r.y*K;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);

  if(curve){const dx=X2-X1,dy=Y2-Y1,l=Math.hypot(dx,dy)||1;cx+=-dy/l*curve*K;cy+=dx/l*curve*K;}
  ctx.beginPath();ctx.moveTo(X1,Y1);ctx.quadraticCurveTo(cx,cy,X2,Y2);ctx.stroke();ctx.setLineDash([]);

function arrowHead(X,Y,an,w){const h=Math.max(9,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
function pathLine(f,t0,t1,o={}){
  const {c='#fff',w=2,a=1,dash=null,head=false}=o;if(t1<=t0)return;

  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const N=Math.max(10,Math.ceil((t1-t0)*160));let dist=0,prev=f(t0);

function tag(p,txt,o={}){

  const fs=clamp(K*.5,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function player(p,lbl,face,o={}){
  const {fill='#c8ef4a',txt='#16210a',ring=null,a=1}=o;
  const X=p.x*K,Y=p.y*K,r=clamp(K*.95,9,16);
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(face)*(r+7),Y+Math.sin(face)*(r+7));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);
  ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  if(lbl){ctx.fillStyle=txt;ctx.font=`800 ${r*(lbl.length>1?.72:1)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);}
  ctx.restore();
}
function drawBall(p){
  const X=p.x*K,Y=p.y*K,r=clamp(K*.42,5,8);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();
}
function legend(){
  const fs=clamp(K*.42,9,12),pad=8,rowH=fs+8,lw=34;
  const rows=[['wavy','#fff','Dribbling'],['line','#fff','Pass'],['dash','#dbe7ff','Laufweg ohne Ball'],['line','#ffd34d','Mitnahme / Torschuss']];
  ctx.save();ctx.font=`600 ${fs}px system-ui,sans-serif`;
  let tw=0;rows.forEach(r=>tw=Math.max(tw,ctx.measureText(r[2]).width));
  const bw=pad*3+lw+tw,bh=pad*2+rows.length*rowH,X=8,Y=CH-bh-8;
  ctx.fillStyle='rgba(10,16,24,.78)';rr(X,Y,bw,bh,8);ctx.fill();
  rows.forEach((r,i)=>{const y=Y+pad+rowH*i+rowH/2,x0=X+pad,x1=x0+lw;
    ctx.strokeStyle=r[1];ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
    if(r[0]==='wavy'){for(let k=0;k<=24;k++){const x=x0+(x1-x0)*k/24,yy=y+Math.sin(k/24*Math.PI*4)*3;k?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}}
    else{if(r[0]==='dash')ctx.setLineDash([3,4]);ctx.moveTo(x0,y);ctx.lineTo(x1,y);}
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#e8eef3';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(r[2],x1+pad,y);});
  ctx.restore();
}

function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  const s=st(T),now=performance.now()/1000;
  drawField();
  DUM.forEach(dummy);cone(CONE);

  // Gesamtablauf als Vorschau
  if(showRuns){const a=.22;
    wavy(pD1,0,1,{a});line(s.dEnd,s.mFoot,{a});pathLine(pRun,0,1,{a,dash:[3,6],c:'#dbe7ff'});
    line(s.mFoot,R,{a});wavy(pD2,0,1,{a});line(s.shotStart,GP,{a,c:'#ffd34d'});}

  // Wege der aktuellen und nächsten Aktion
  if(showWays){const i=phaseIdx(T),w={a:.5};
    [i,i+1].forEach(j=>{
      if(j===1)wavy(pD1,0,1,w);else if(j===2)line(s.dEnd,s.mFoot,{a:.5,head:true});
      else if(j===3)pathLine(pRun,0,1,{c:'#dbe7ff',w:2,dash:[4,6],a:.6,head:true});else if(j===4)line(s.mFoot,R,{a:.5,head:true});
      else if(j===5)line(R,s.dStart,{c:'#ffd34d',a:.55,head:true,curve:.4});else if(j===6)wavy(pD2,0,1,w);
      else if(j===7)line(s.shotStart,GP,{c:'#ffd34d',a:.55,head:true});});}
  // tatsächliche Wege
  if(T>=1.0){wavy(pD1,0,s.u1,{a:T>=2.8?.6:1});
    if(T<2.8)tag(add(pD1(.5),{x:3.4,y:0}),'Andribbeln');}
  if(T>=2.8){const done=T>=3.75;line(s.dEnd,done?s.mFoot:s.ball,{w:2.6,a:T>=4.2?.55:1,head:done});
    if(T<4.2)tag(add(lp(s.dEnd,s.mFoot,.5),{x:0,y:1.8}),'Querpass');}
  if(T>=3.7){pathLine(pRun,0,s.r,{c:'#dbe7ff',w:2,dash:[4,6],head:s.r>=.98,a:T>=5.45?.6:1});
    if(T<5.45)tag(add(pRun(.45),{x:-2.8,y:0}),'Pass & geh');}
  if(T>=4.2){const done=T>=5.45;line(s.mFoot,done?R:s.ball,{w:2.6,a:T>=5.95?.55:1,head:done});
    if(T<5.95)tag(add(lp(s.mFoot,R,.45),{x:1.2,y:2}),'Steilpass in den Lauf');}
  if(T>=5.4){line(R,s.dStart,{c:'#ffd34d',w:4,head:true,curve:.4,a:T>=7.3?.6:1});
    if(T<6.4)tag(add(lp(R,s.dStart,.5),{x:-.4,y:-1.8}),'Mitnahme',{c:'#3a2c00',bg:'#ffd34d'});}
  if(T>=5.95){wavy(pD2,0,s.d,{a:T>=7.3?.6:1});
    if(T<7.3)tag(add(pD2(.5),{x:0,y:2.2}),'Dribbling');}
  if(T>=7.3){const done=T>=7.85;line(s.shotStart,done?GP:s.ball,{c:'#ffd34d',w:3.2,head:done});
    if(T<8.6)tag(add(lp(s.shotStart,GP,.5),{x:-3,y:0}),'Torschuss');}
  if(T>=7.85){const p=.75+.25*Math.sin(now*6);tag({x:20,y:6.2},'⚽ TOR!',{c:'#111',bg:'#ffd34d',a:p});}
  if(T<2.8)tag({x:20.8,y:16.7},'Puppenkette',{a:.9});

  // Spieler
  QUEUE.forEach(p=>player(p,'',-Math.PI/2,{a:.45}));
  player(M0,'M',s.fM);
  if(showOpp)player(s.tw,'TW',s.fT,{fill:'#7b3fe4',txt:'#fff'});
  player(s.sp,'S',s.fS,{ring:'#ffd34d'});
  drawBall(s.ball);
  if(T>=4.5&&T<5.2)tag(add(s.sp,{x:-.5,y:-2.4}),'👀 Ball im Blick',{c:'#111',bg:'#ffd34d'});
  if(showLeg)legend();
}

/* ---------- UI ---------- */
const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{if(p.step<1)return;const c=document.createElement('span');c.className='chip';
  c.textContent=(p.step<8?p.step+' · ':'')+p.label;c.dataset.i=i;c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
let lastKey=-1;
function updateUI(){
  const i=phaseIdx(T),p=PH[i];
  if(i!==lastKey){lastKey=i;
    q('ovStep').textContent=p.step>=1&&p.step<=7?'Schritt '+p.step+' von 7':(p.step===0?'Übung':'Zusammenfassung');
    q('ovTitle').textContent=p.title;q('ovText').textContent=p.text;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});
  }
  q('ov').classList.toggle('hidden',!showText);
  q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');
}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}
function restart(play){playing=!!play;setT(0);}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}playing=!playing;};
q('bRestart').onclick=()=>restart(true);
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
exOpts(root,['opp','all','runs','text','ann'],o=>{showText=o.text;showRuns=o.all;showWays=o.runs;showOpp=o.opp;showAnn=o.ann;});
q('cLeg').onchange=e=>showLeg=e.target.checked;
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if(e.key==='r'||e.key==='R')restart(true);
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
resize();restart(false);raf=requestAnimationFrame(frame);
root._export=()=>{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
  return ttMk({Wm:W,Hm:H,gCol:'#7b3fe4',
    lines:[{t:'line',x1:.6,y1:GOAL.y,x2:W-.6,y2:GOAL.y},{t:'line',x1:.6,y1:GOAL.y,x2:.6,y2:H},{t:'line',x1:W-.6,y1:GOAL.y,x2:W-.6,y2:H},
      {t:'rect',x:10.8,y:GOAL.y,w:18.4,h:5.5},{t:'dot',x:20,y:13},{t:'line',x1:.6,y1:20,x2:W-.6,y2:20},{t:'arc',x:20,y:20,r:9,a0:0,a1:180}],
    items:DUM.map(d=>({kind:'dummy',x:d.x,y:d.y})).concat([{kind:'cone',x:CONE.x,y:CONE.y,c:'#e8352b'},
      {kind:'goal',x:(GOAL.x1+GOAL.x2)/2,y:GOAL.y,w:GOAL.x2-GOAL.x1,d:GOAL.y-GOAL.back}]),
    actors:[{k:'S',name:'S'},{k:'M',name:'M'},{k:'TW',name:'TW',team:'gk'},{k:'Q1',name:''},{k:'Q2',name:''}],times:ts,
    pos:(k,t)=>k==='S'?st(t).sp:k==='M'?M0:k==='TW'?st(t).tw:k==='Q1'?QUEUE[0]:QUEUE[1],
    ball:t=>st(t).ball,
    notes:ts.map((t,i)=>{const p=PH[Math.min(i,PH.length-1)];return p.title+': '+p.text;})});};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);

};

      <li>Nur Direktspiel bzw. maximal zwei Kontakte</li>
      <li>Rot und Blau im Wechsel – Trainer ruft die Farbe kurz vor dem langen Pass</li>
      <li>Abschluss auf ein Tor nach dem Diagonalpass</li>
    </ul>
    <p style="font-size:.85rem;color:var(--muted)">Nach dem Rückpass von R startet der nächste Spieler am Hütchen. Wechsel nach der eigenen Aktion: A → L, L → B, B → R, R → Startreihe.</p>

const q=n=>root.querySelector('[data-r="'+n+'"]');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

/* Läufe vorbereiten: Startposition jedes Laufs */
const runs=cfg.runs.map(r=>Object.assign({},r)).sort((a,b)=>a.t0-b.t0);
{const cur={};Object.keys(POS).forEach(k=>cur[k]=POS[k]);
 runs.slice().sort((a,b)=>a.t0-b.t0).forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
function actorPos(k,T){
  let p=POS[k];
  for(const r of runs){if(r.w!==k)continue;if(T<=r.t0)break;
    if(T<r.t1)return qpt(r.from,r.to,r.c,ease(seg(T,r.t0,r.t1)));p=r.to;}
  return p;
}
function runningAt(k,T){return runs.find(r=>r.w===k&&T>r.t0&&T<r.t1)}
/* Pässe vorbereiten: Start- und Endpunkt des Balls */
const passes=cfg.passes.map(p=>{
  const from=actorPos(p.f,p.t0),to=p.toPt?QUEUE[0]:actorPos(p.to,p.t1);
  return Object.assign({},p,{s:add(from,norm(sub(to,from)),.8),e:add(to,norm(sub(from,to)),.9)});
});
function ballAt(T){
  if(T<passes[0].t0)return passes[0].s;
  let i=0;for(let k=0;k<passes.length;k++)if(T>=passes[k].t0)i=k;
  const p=passes[i];
  if(T<p.t1)return lp(p.s,p.e,1-Math.pow(1-seg(T,p.t0,p.t1),1.35));
  const n=passes[i+1];
  if(n)return lp(p.e,n.s,ease(seg(T,p.t1,n.t0)));   // Annahme / erster Kontakt

function holderAt(T){let h=passes[0].f;for(const p of passes)if(T>=p.t1)h=p.to||p.toPt;else if(T>=p.t0)h=null;return h;}

const PH=cfg.ph, TEND=cfg.TEND, COL=cfg.col;
let T=0,playing=false,last=0,speed=1,showText=true,showRuns=true,showLeg=true,raf=0,alive=true,showWays=true,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowHead(X,Y,an,w){const h=Math.max(9,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
function line(p,r,o={}){
  const {c='#fff',w=2.6,a=1,dash=null,head=false}=o;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(p.x*K,p.y*K);ctx.lineTo(r.x*K,r.y*K);ctx.stroke();ctx.setLineDash([]);
  if(head&&len(sub(r,p))*K>4)arrowHead(r.x*K,r.y*K,ang(sub(r,p)),w);
  ctx.restore();
}
function curve(a,b,c,t1,o={}){
  const {col='#fff',w=2.2,al=1,dash=[5,6],head=false}=o;if(t1<=0)return;

  const {c='#fff',bg='rgba(10,16,24,.8)',a=1}=o;
  const fs=clamp(K*.62,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);

}
function dotted(a,b){ctx.save();ctx.strokeStyle='rgba(20,30,20,.55)';ctx.lineWidth=Math.max(2,K*.14);ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(a.x*K,a.y*K);ctx.lineTo(b.x*K,b.y*K);ctx.stroke();ctx.restore();}
function mtext(p,t){ctx.save();ctx.fillStyle='rgba(20,30,20,.6)';ctx.font=`800 ${clamp(K*.7,10,15)}px system-ui,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,p.x*K,p.y*K);ctx.restore();}
function drawField(){
  const n=10;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#3a9a46':'#40a34c';ctx.fillRect(0,i*CH/n,CW,CH/n+1);}

function dummy(p){
  const w=1.7*K,h=Math.max(5,.55*K),X=p.x*K-w/2,Y=p.y*K-h/2;

}
function cone(p){const X=p.x*K,Y=p.y*K,r=clamp(K*.5,5,9);ctx.fillStyle='#ffc21a';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();}

let lastKey=-1;
function updateUI(){
  const i=phaseIdx(T),p=PH[i];

    q('ovStep').textContent=p.step>=1&&p.step<99?cfg.name+' · Schritt '+p.step+' von '+nSteps:(p.step===0?cfg.name:'Zusammenfassung');

}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}

function frame(ts){

  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);

q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}playing=!playing;};
q('bRestart').onclick=()=>restart(true);
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
exOpts(root,['all','runs','text','ann'],o=>{showText=o.text;showRuns=o.all;showWays=o.runs;showAnn=o.ann;});
q('cLeg').onchange=e=>showLeg=e.target.checked;

root._export=()=>{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
  const KEYS=['A','L','B','R'];

    lines:[{t:'line',x1:POS.A.x,y1:POS.A.y,x2:15,y2:POS.B.y,dash:1},{t:'line',x1:POS.L.x,y1:14,x2:23,y2:14,dash:1},

}

      <li><b>Aufdrehen:</b> M nimmt den Ball mit und dreht sich um die Puppe Richtung B auf.</li>
      <li><b>Doppelpass:</b> M passt auf B, B lässt direkt in den Lauf von M klatschen.</li>
      <li><b>Hinterlaufen:</b> B läuft außen um seine Puppe, M spielt den Ball in den Lauf.</li>
      <li><b>Abschluss:</b> B schließt direkt oder mit einem Kontakt aufs Minitor ab.</li>
    </ol>
    <h3>Positionswechsel</h3>
    <ul>
      <li>S → wird neuer M (auf der anderen Seite der Mittelpuppe)</li>
      <li>M → stellt sich hinter der Puppe der gespielten Seite an</li>
      <li>Der Wartende rückt auf die B-Position nach</li>
      <li>B → holt den Ball und stellt sich am Start an</li>
    </ul>
    <h3>Coaching-Punkte</h3>
    <ul>
      <li>Pass flach und scharf, in den richtigen Fuß</li>
      <li>Vor dem Aufdrehen Schulterblick, erster Kontakt bereits in die Drehung</li>
      <li>Klatschen direkt, Pass in den Lauf vor den Spieler</li>
      <li>Hinterlaufen mit Tempo, Abschluss flach ins Eck</li>
    </ul>
    <h3>Variationen</h3>
    <ul>
      <li>Trainer gibt die Seite kurz vor dem ersten Pass vor</li>
      <li>Nur Direktspiel ab dem Doppelpass</li>
      <li>Passiver Verteidiger statt der unteren Puppe</li>
      <li>Abschluss nur mit dem schwachen Fuß</li>
    </ul>

{const cur={};Object.keys(ACT).forEach(k=>cur[k]=ACT[k]);runs.forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
function runPt(r,t){if(r.c1)return cub(r.from,r.c1,r.c2,r.to,t);if(r.k)return quad(r.from,r.k,r.to,t);return lp(r.from,r.to,t);}

function runningAt(k,T){return runs.find(r=>r.w===k&&T>r.t0&&T<r.t1)}
function foot(k,T,dirHint){const p=actorPos(k,T),v=sub(actorPos(k,T+.05),actorPos(k,T-.05));

passes.forEach(p=>{const from=actorPos(p.f,p.t0),to=p.toPt||actorPos(p.to,p.t1);
  p.s=add(from,norm(sub(to,from)),.8);p.e=p.toPt?p.toPt:add(to,norm(sub(from,to)),.9);});

passes.forEach(p=>(BALLS[p.ball]=BALLS[p.ball]||[]).push(Object.assign({type:'pass'},p)));
carries.forEach(c=>(BALLS[c.ball]=BALLS[c.ball]||[]).push(Object.assign({type:'carry'},c)));

function evEnd(ev){return ev.type==='pass'?ev.e:foot(ev.w,ev.t1-.06);}
function ballAt(id,T){
  const l=BALLS[id];if(T<l[0].t0)return evStart(l[0]);
  let i=0;for(let k=0;k<l.length;k++)if(T>=l[k].t0)i=k;

  if(T<ev.t1)return ev.type==='pass'?lp(ev.s,ev.e,1-Math.pow(1-seg(T,ev.t0,ev.t1),1.35)):foot(ev.w,T);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}

  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';

function runLine(r,t1,o={}){
  const {col='#7fd1ff',w=2.2,al=1,dash=[5,6],head=false}=o;if(t1<=0)return;

}

function drawField(){

function player(p,lbl,face,o={}){
  const {fill='#c8ef4a',txt='#16210a',ring=null,a=1}=o;

function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}

function frame(ts){

q('bPlay').onclick=()=>{if(T>=TEND){restart(true);return}playing=!playing;};
q('bRestart').onclick=()=>restart(true);

root._export=()=>{const ts=PH.map((p,i)=>i?p.t-.02:0).concat([TEND]);
  return ttMk({Wm:W,Hm:H,
    lines:[{t:'line',x1:1,y1:H,x2:1,y2:GOAL_Y},{t:'line',x1:1,y1:GOAL_Y,x2:W-1,y2:GOAL_Y},{t:'line',x1:W-1,y1:GOAL_Y,x2:W-1,y2:H},
      {t:'rect',x:TP.S.x-.7,y:TP.S.y-.7,w:1.4,h:1.4}],

function mountFarbTore(root){

      <li>Wettkampf: Wer ist zuletzt durch? → kleine Zusatzaufgabe</li>
    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const angDiff=(a,b)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return d;};
const rnd=(a,b)=>a+Math.random()*(b-a);

let players=[],call=null,simT=0,nextCallAt=3,lastCol=-1,playing=false,last=0,speed=1;
let auto=true,showVis=true,showRuns=true,showText=true,raf=0,alive=true,started=false,showAnn=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

function nearGate(p){return GATES.some(g=>dist(p,g)<2.2);}
function randPt(){let p,i=0;do{p={x:rnd(F.x1+1.5,F.x2-1.5),y:rnd(F.y1+1.5,F.y2-1.5)};i++;}while(nearGate(p)&&i<40);return p;}
function init(){
  const n=+q('sN').value;players=[];
  for(let i=0;i<n;i++){let p,k=0;do{p=randPt();k++;}while(players.some(o=>dist(o,p)<3)&&k<60);
    const h=rnd(-Math.PI,Math.PI);
    players.push({id:i+1,x:p.x,y:p.y,h,state:'free',tg:randPt(),wt:rnd(2,4),ph:rnd(0,6),bx:p.x+Math.cos(h)*.75,by:p.y+Math.sin(h)*.75,trail:[],tt:0,flash:0});}
  call=null;simT=0;nextCallAt=3;lastCol=-1;
}
function callColor(c){
  call={col:c,t0:simT,done:0,n:players.length,order:[],end:null};lastCol=c;
  const load=new Map();
  players.slice().sort((a,b)=>{const da=Math.min(...GATES.filter(g=>g.col===c).map(g=>dist(a,g))),db=Math.min(...GATES.filter(g=>g.col===c).map(g=>dist(b,g)));return da-db;})
  .forEach(p=>{
    let best=null,bc=1e9;
    GATES.filter(g=>g.col===c).forEach(g=>{const cost=dist(p,g)+(load.get(g)||0)*4.5;if(cost<bc){bc=cost;best=g;}});
    load.set(best,(load.get(best)||0)+1);
    const s=dot(sub(p,best),best.n)<0?1:-1;
    p.gate=best;p.A=add(best,best.n,-2.0*s);p.E=add(best,best.n,2.6*s);
    p.state='react';p.react=rnd(.25,.7);p.trail=[{x:p.x,y:p.y}];p.tt=0;p.rank=0;p.time=0;
  });
}
function update(dt){
  simT+=dt;
  if(auto){
    if(!call&&simT>=nextCallAt){let c;do{c=Math.floor(Math.random()*COLORS.length);}while(c===lastCol);callColor(c);}
  }
  if(call&&call.end!==null&&simT-call.end>2.2){call=null;nextCallAt=simT+rnd(2.5,4);}
  players.forEach(p=>{
    let tg,sp,turn=4.2;
    if(p.state==='free'){
      p.wt-=dt;if(dist(p,p.tg)<1.2||p.wt<=0){p.tg=randPt();p.wt=rnd(2.5,4.5);}
      tg=p.tg;sp=1.9;
    }else if(p.state==='react'){
      p.react-=dt;tg=p.A;sp=1.2;turn=6;if(p.react<=0)p.state='go';
    }else if(p.state==='go'){
      tg=p.A;sp=4.3;turn=7;if(dist(p,p.A)<.8)p.state='through';
    }else{
      tg=p.E;sp=4.5;turn=8;
      if(dist(p,p.E)<.7){p.state='free';p.tg=randPt();p.wt=rnd(2.5,4);
        call.done++;p.rank=call.done;p.time=simT-call.t0;p.flash=1.8;call.order.push(p);
        if(call.done>=call.n)call.end=simT;}
    }
    const want=Math.atan2(tg.y-p.y,tg.x-p.x);
    const d=angDiff(p.h,want);p.h+=clamp(d,-turn*dt,turn*dt);
    let vx=Math.cos(p.h)*sp,vy=Math.sin(p.h)*sp;
    players.forEach(o=>{if(o===p)return;const dd=dist(p,o);if(dd<2.1&&dd>.001){const k=(2.1-dd)*2.2;vx+=(p.x-o.x)/dd*k;vy+=(p.y-o.y)/dd*k;}});
    p.x=clamp(p.x+vx*dt,F.x1+.6,F.x2-.6);p.y=clamp(p.y+vy*dt,F.y1+.6,F.y2-.6);
    p.ph+=dt*(sp>3?14:9);
    const bt={x:p.x+Math.cos(p.h)*.75-Math.sin(p.h)*Math.sin(p.ph)*.12,y:p.y+Math.sin(p.h)*.75+Math.cos(p.h)*Math.sin(p.ph)*.12};
    const f=1-Math.exp(-12*dt);p.bx+=(bt.x-p.bx)*f;p.by+=(bt.y-p.by)*f;
    if(p.state==='go'||p.state==='through'||p.state==='react'){p.tt+=dt;if(p.tt>.08){p.tt=0;p.trail.push({x:p.x,y:p.y});}}
    if(p.flash>0)p.flash-=dt;
  });
}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tag(p,txt,o={}){
  if(typeof showAnn!=='undefined'&&!showAnn&&!(o&&o.big))return;
  const {c='#fff',bg='rgba(10,16,24,.82)',a=1,big=false}=o;
  const fs=big?clamp(K*1.0,14,22):clamp(K*.6,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`${big?800:600} ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+(big?24:12),h=fs+(big?14:9);
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  if(big){ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();}
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function drawField(){
  ctx.fillStyle='#2a7d3b';ctx.fillRect(0,0,CW,CH);
  const n=10,fw=(F.x2-F.x1)*K;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(F.x1*K+i*fw/n,F.y1*K,fw/n+1,(F.y2-F.y1)*K);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(F.x1*K,F.y1*K,(F.x2-F.x1)*K,(F.y2-F.y1)*K);
  [[F.x1,F.y1],[F.x2,F.y1],[F.x1,F.y2],[F.x2,F.y2]].forEach(([x,y])=>{const X=x*K,Y=y*K,r=clamp(K*.42,5,9);
    ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();});
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font=`600 ${clamp(K*.45,9,12)}px system-ui,sans-serif`;ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillText('ca. 20 × 20 m',F.x2*K,(F.y2+.25)*K);
}
function drawGate(g,now){
  const col=COLORS[g.col],active=call&&g.col===call.col,dim=call&&!active;
  const c1=add(g,g.d,-.8),c2=add(g,g.d,.8),r=clamp(K*.38,4.5,8);
  ctx.save();ctx.globalAlpha=dim?.35:1;
  if(active){const pr=(r*2.6)*(1+.15*Math.sin(now*8));ctx.fillStyle=col.c;ctx.globalAlpha=.22;
    ctx.beginPath();ctx.arc(g.x*K,g.y*K,pr*1.3,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=col.c;ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(c1.x*K,c1.y*K);ctx.lineTo(c2.x*K,c2.y*K);ctx.stroke();ctx.setLineDash([]);}
  [c1,c2].forEach(c=>{const X=c.x*K,Y=c.y*K;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
    ctx.fillStyle=col.c;ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.9,Y+r*.65);ctx.lineTo(X-r*.9,Y+r*.65);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.stroke();});
  ctx.restore();
}
function vision(p){
  const X=p.x*K,Y=p.y*K,scan=p.state==='react',R=(scan?6:4.5)*K,h=scan?.6:.5;
  ctx.save();ctx.globalAlpha=scan?.5:.22;
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,R,p.h-h,p.h+h);ctx.closePath();ctx.fill();ctx.restore();
}
function player(p){
  const X=p.x*K,Y=p.y*K,r=clamp(K*.8,9,15),hot=p.state==='go'||p.state==='through';
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(p.h)*(r+6),Y+Math.sin(p.h)*(r+6));
  ctx.lineTo(X+Math.cos(p.h+.55)*r*.9,Y+Math.sin(p.h+.55)*r*.9);
  ctx.lineTo(X+Math.cos(p.h-.55)*r*.9,Y+Math.sin(p.h-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c8ef4a';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=hot?3.5:2;ctx.strokeStyle=hot&&call?COLORS[call.col].c:'#fff';ctx.stroke();
  ctx.fillStyle='#16210a';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.id),X,Y+1);
}
function ball(p){const X=p.bx*K,Y=p.by*K,r=clamp(K*.36,4.5,7);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();}
function draw(){
  if(!CW)return;const now=performance.now()/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  drawField();GATES.forEach(g=>drawGate(g,now));
  if(showRuns&&call)players.forEach(p=>{if(p.trail.length<2)return;
    ctx.save();ctx.strokeStyle=COLORS[call.col].c;ctx.globalAlpha=.85;ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.lineCap='round';ctx.beginPath();
    p.trail.forEach((t,i)=>i?ctx.lineTo(t.x*K,t.y*K):ctx.moveTo(t.x*K,t.y*K));
    if(p.state!=='free')ctx.lineTo(p.x*K,p.y*K);ctx.stroke();ctx.restore();});
  if(showRuns&&call)players.forEach(p=>{if(p.state!=='react'&&p.state!=='go')return;
    ctx.save();ctx.strokeStyle=COLORS[call.col].c;ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.setLineDash([2,5]);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p.x*K,p.y*K);ctx.lineTo(p.A.x*K,p.A.y*K);ctx.lineTo(p.E.x*K,p.E.y*K);ctx.stroke();ctx.restore();});
  if(showVis)players.forEach(vision);
  players.forEach(player);players.forEach(ball);
  players.forEach(p=>{if(p.state==='react')tag({x:p.x,y:p.y-1.7},'👀',{bg:'rgba(255,255,255,.85)',c:'#111'});
    if(p.flash>0)tag({x:p.x,y:p.y+(p.rank%2?-1.8:1.9)},p.rank+'. · '+p.time.toFixed(1).replace('.',',')+' s',{c:'#111',bg:p.rank===1?'#ffd34d':'rgba(255,255,255,.9)',a:Math.min(1,p.flash*1.5)});});
  // Trainer
  const tr={x:13,y:25.2},X=tr.x*K,Y=tr.y*K,r=clamp(K*.8,9,15);
  ctx.fillStyle='#1f2a44';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('T',X,Y+1);
  if(call){const col=COLORS[call.col],age=simT-call.t0;
    if(age<2.2)tag({x:18.2,y:25.2},'„'+col.n.toUpperCase()+'!“',{big:true,bg:col.c,c:col.t,a:age<1.6?1:(2.2-age)/.6});
    tag({x:13,y:1.5},'Kommando: '+col.n,{bg:col.c,c:col.t});}
  else if(started)tag({x:13,y:1.5},'Freies Dribbeln · Kopf hoch',{});
}

/* ---------- Text & UI ---------- */
let lastTxt='';
function updateUI(){
  let st,ti,tx;
  if(!started){st='Dribbling';ti='Farb-Tore-Parcours';tx='▶ Abspielen startet das freie Dribbeln. Mit den Farbtasten rufst du selbst ein Kommando – oder lass „Auto-Kommando“ an.';}
  else if(!call){st='Phase 1';ti='Freies Dribbeln – Kopf hoch!';tx='Alle dribbeln frei im Feld, Ball eng am Fuß. Blick immer wieder nach oben: Wo ist welche Farbe? Wo ist Platz?';}
  else{const col=COLORS[call.col].n,age=simT-call.t0;
    if(call.end!==null){const f=call.order[0];st='Auswertung';ti='Alle durch!';

    else{st='Phase 3';ti='Tempo durchs Tor';tx='Mit Tempo und engen Kontakten durchs '+col.toLowerCase()+'e Tor dribbeln ('+call.done+' von '+call.n+' durch). Danach abbremsen, Ball kontrollieren, Kopf hoch.';}
  }

function start(){started=true;playing=true;}
q('bPlay').onclick=()=>{if(!started){start();return;}playing=!playing;};
q('bRestart').onclick=()=>{init();start();};

q('sN').onchange=()=>{init();};
q('cAuto').onchange=e=>{auto=e.target.checked;if(auto&&!call)nextCallAt=simT+2;};

root.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>manual(+b.dataset.c));

root._export=()=>{
  const gl=[];const its=[];GATES.forEach(g=>{const col=COLORS[g.col].c;[-.8,.8].forEach(o=>its.push({kind:'cone',x:g.x+g.d.x*o,y:g.y+g.d.y*o,c:col}));});

  const p1=players[0];

    lines:[{t:'rect',x:F.x1,y:F.y1,w:F.x2-F.x1,h:F.y2-F.y1},{t:'text',x:19.5,y:23.9,text:'ca. 20 × 20 m'}],
    items:its,actors:acts,times:[0],pos:(k)=>pos(k),ball:()=>p1?{x:p1.bx,y:p1.by}:null,holder:()=>p1?'P'+p1.id:null,
    notes:['Freies Dribbeln im Feld, jeder Spieler mit Ball. Der Trainer ruft eine Farbe (Rot, Blau, Gelb, Weiß) – alle dribbeln so schnell wie möglich durch ein Tor dieser Farbe. Kopf hoch!']});};

}

/* =====================================================================
   PARCOURS-ENGINE (für Slalom und Stationsparcours)
   Mehrere Spieler laufen im Takt nacheinander denselben Parcours.
   Alles ist eine reine Funktion der Zeit T → Schritte & Springen möglich.
   ===================================================================== */
function mountParcours(root,cfg){
root.className='pam';
const W=cfg.W,H=cfg.H;
root.innerHTML=`
  <h2>${cfg.title}</h2>
  <p class="sub">${cfg.sub}</p>
  <div class="stage sq"><canvas data-r="cv"></canvas></div>
  <div class="ov below" data-r="ov">
    <div class="ovStep" data-r="ovStep"></div>
    <div class="ovTitle" data-r="ovTitle"></div>

  </div>
  <div class="steps" data-r="steps"></div>
  <div class="bar">
    <button data-r="bRestart">⟲ Neu</button>
    <button data-r="bPrev">◀ Schritt</button>
    <button data-r="bPlay" class="primary">▶ Abspielen</button>
    <button data-r="bNext">Schritt ▶</button>
    <label>Tempo
      <select data-r="sSpeed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select>
    </label>
  </div>
  <div class="bar">

      <select data-r="sInt">${cfg.intervals.map(v=>`<option value="${v}"${v===cfg.defInterval?' selected':''}>alle ${v} s</option>`).join('')}</select>
    </label>
    ${cfg.laneOpt?`<label>Bahnen <select data-r="sLanes"><option value="1">1 Bahn</option><option value="2">2 Bahnen (Wettlauf)</option></select></label>`:''}
  </div>
  ${exOptsHTML()}
  <div class="bar">
    <label><input type="checkbox" data-r="cFocus" checked> Fokus-Spieler hervorheben</label>
  </div>
  <div class="kbd">Tastatur: Leertaste = Play/Pause · ← → = Schritt · R = Neustart</div>
  <details><summary>Übungsbeschreibung</summary>${cfg.desc}</details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* ---------- Pfade: Catmull-Rom mit Geschwindigkeit pro Abschnitt ---------- */
function buildPath(pts){
  const S=[{t:0,x:pts[0].x,y:pts[0].y}],ph=[],mark={};let t=0;

  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    if(i>0&&p1.ph!==undefined)ph.push({t,ph:p1.ph});
    if(p1.mark)mark[p1.mark]=t;
    if(p1.dw){t+=p1.dw;S.push({t,x:p1.x,y:p1.y});}
    let prev={x:p1.x,y:p1.y};const v=p1.v||2.5;
    for(let k=1;k<=16;k++){const s=k/16,s2=s*s,s3=s2*s;
      const x=.5*((2*p1.x)+(-p0.x+p2.x)*s+(2*p0.x-5*p1.x+4*p2.x-p3.x)*s2+(-p0.x+3*p1.x-3*p2.x+p3.x)*s3);
      const y=.5*((2*p1.y)+(-p0.y+p2.y)*s+(2*p0.y-5*p1.y+4*p2.y-p3.y)*s2+(-p0.y+3*p1.y-3*p2.y+p3.y)*s3);

function pathPos(P,t){
  const S=P.S;if(t<=0)return{x:S[0].x,y:S[0].y};if(t>=P.T){const e=S[S.length-1];return{x:e.x,y:e.y};}
  let lo=0,hi=S.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(S[m].t<=t)lo=m;else hi=m;}
  const a=S[lo],b=S[hi],f=(t-a.t)/((b.t-a.t)||1);return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f)};
}
function polyAt(Q,d){ // Punkt nach Strecke d entlang Polylinie
  for(let i=0;i<Q.length-1;i++){const l=len(sub(Q[i+1],Q[i]));if(d<=l)return lp(Q[i],Q[i+1],d/l);d-=l;}
  const n=Q.length;const dir=norm(sub(Q[n-1],Q[n-2]));return add(Q[n-1],dir,d);
