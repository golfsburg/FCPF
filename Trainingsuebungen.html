      <li>Nur schwacher Fuß, nur Außenseite oder nur Sohle</li>
      <li>Ein Fänger ohne Ball, der Bälle wegspielen darf</li>
      <li>Wettkampf: Wer ist zuletzt durch? → kleine Zusatzaufgabe</li>
    </ul>
  </details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const angDiff=(a,b)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return d;};
const rnd=(a,b)=>a+Math.random()*(b-a);

let players=[],call=null,simT=0,nextCallAt=3,lastCol=-1,playing=false,last=0,speed=1;
let auto=true,showVis=true,showRuns=true,showText=true,raf=0,alive=true,started=false;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

function nearGate(p){return GATES.some(g=>dist(p,g)<2.2);}
function randPt(){let p,i=0;do{p={x:rnd(F.x1+1.5,F.x2-1.5),y:rnd(F.y1+1.5,F.y2-1.5)};i++;}while(nearGate(p)&&i<40);return p;}
function init(){
  const n=+q('sN').value;players=[];
  for(let i=0;i<n;i++){let p,k=0;do{p=randPt();k++;}while(players.some(o=>dist(o,p)<3)&&k<60);
    const h=rnd(-Math.PI,Math.PI);
    players.push({id:i+1,x:p.x,y:p.y,h,state:'free',tg:randPt(),wt:rnd(2,4),ph:rnd(0,6),bx:p.x+Math.cos(h)*.75,by:p.y+Math.sin(h)*.75,trail:[],tt:0,flash:0});}
  call=null;simT=0;nextCallAt=3;lastCol=-1;
}
function callColor(c){
  call={col:c,t0:simT,done:0,n:players.length,order:[],end:null};lastCol=c;
  const load=new Map();
  players.slice().sort((a,b)=>{const da=Math.min(...GATES.filter(g=>g.col===c).map(g=>dist(a,g))),db=Math.min(...GATES.filter(g=>g.col===c).map(g=>dist(b,g)));return da-db;})
  .forEach(p=>{
    let best=null,bc=1e9;
    GATES.filter(g=>g.col===c).forEach(g=>{const cost=dist(p,g)+(load.get(g)||0)*4.5;if(cost<bc){bc=cost;best=g;}});
    load.set(best,(load.get(best)||0)+1);
    const s=dot(sub(p,best),best.n)<0?1:-1;
    p.gate=best;p.A=add(best,best.n,-2.0*s);p.E=add(best,best.n,2.6*s);
    p.state='react';p.react=rnd(.25,.7);p.trail=[{x:p.x,y:p.y}];p.tt=0;p.rank=0;p.time=0;
  });
}
function update(dt){
  simT+=dt;
  if(auto){
    if(!call&&simT>=nextCallAt){let c;do{c=Math.floor(Math.random()*COLORS.length);}while(c===lastCol);callColor(c);}
  }
  if(call&&call.end!==null&&simT-call.end>2.2){call=null;nextCallAt=simT+rnd(2.5,4);}
  players.forEach(p=>{
    let tg,sp,turn=4.2;
    if(p.state==='free'){
      p.wt-=dt;if(dist(p,p.tg)<1.2||p.wt<=0){p.tg=randPt();p.wt=rnd(2.5,4.5);}
      tg=p.tg;sp=1.9;
    }else if(p.state==='react'){
      p.react-=dt;tg=p.A;sp=1.2;turn=6;if(p.react<=0)p.state='go';
    }else if(p.state==='go'){
      tg=p.A;sp=4.3;turn=7;if(dist(p,p.A)<.8)p.state='through';
    }else{
      tg=p.E;sp=4.5;turn=8;
      if(dist(p,p.E)<.7){p.state='free';p.tg=randPt();p.wt=rnd(2.5,4);
        call.done++;p.rank=call.done;p.time=simT-call.t0;p.flash=1.8;call.order.push(p);
        if(call.done>=call.n)call.end=simT;}
    }
    const want=Math.atan2(tg.y-p.y,tg.x-p.x);
    const d=angDiff(p.h,want);p.h+=clamp(d,-turn*dt,turn*dt);
    let vx=Math.cos(p.h)*sp,vy=Math.sin(p.h)*sp;
    players.forEach(o=>{if(o===p)return;const dd=dist(p,o);if(dd<2.1&&dd>.001){const k=(2.1-dd)*2.2;vx+=(p.x-o.x)/dd*k;vy+=(p.y-o.y)/dd*k;}});
    p.x=clamp(p.x+vx*dt,F.x1+.6,F.x2-.6);p.y=clamp(p.y+vy*dt,F.y1+.6,F.y2-.6);
    p.ph+=dt*(sp>3?14:9);
    const bt={x:p.x+Math.cos(p.h)*.75-Math.sin(p.h)*Math.sin(p.ph)*.12,y:p.y+Math.sin(p.h)*.75+Math.cos(p.h)*Math.sin(p.ph)*.12};
    const f=1-Math.exp(-12*dt);p.bx+=(bt.x-p.bx)*f;p.by+=(bt.y-p.by)*f;
    if(p.state==='go'||p.state==='through'||p.state==='react'){p.tt+=dt;if(p.tt>.08){p.tt=0;p.trail.push({x:p.x,y:p.y});}}
    if(p.flash>0)p.flash-=dt;
  });
}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tag(p,txt,o={}){
  const {c='#fff',bg='rgba(10,16,24,.82)',a=1,big=false}=o;
  const fs=big?clamp(K*1.0,14,22):clamp(K*.6,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`${big?800:600} ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+(big?24:12),h=fs+(big?14:9);
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  if(big){ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();}
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
function drawField(){
  ctx.fillStyle='#2a7d3b';ctx.fillRect(0,0,CW,CH);
  const n=10,fw=(F.x2-F.x1)*K;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(F.x1*K+i*fw/n,F.y1*K,fw/n+1,(F.y2-F.y1)*K);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(F.x1*K,F.y1*K,(F.x2-F.x1)*K,(F.y2-F.y1)*K);
  [[F.x1,F.y1],[F.x2,F.y1],[F.x1,F.y2],[F.x2,F.y2]].forEach(([x,y])=>{const X=x*K,Y=y*K,r=clamp(K*.42,5,9);
    ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.85,Y+r*.6);ctx.lineTo(X-r*.85,Y+r*.6);ctx.closePath();ctx.fill();});
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font=`600 ${clamp(K*.45,9,12)}px system-ui,sans-serif`;ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillText('ca. 20 × 20 m',F.x2*K,(F.y2+.25)*K);
}
function drawGate(g,now){
  const col=COLORS[g.col],active=call&&g.col===call.col,dim=call&&!active;
  const c1=add(g,g.d,-.8),c2=add(g,g.d,.8),r=clamp(K*.38,4.5,8);
  ctx.save();ctx.globalAlpha=dim?.35:1;
  if(active){const pr=(r*2.6)*(1+.15*Math.sin(now*8));ctx.fillStyle=col.c;ctx.globalAlpha=.22;
    ctx.beginPath();ctx.arc(g.x*K,g.y*K,pr*1.3,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=col.c;ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(c1.x*K,c1.y*K);ctx.lineTo(c2.x*K,c2.y*K);ctx.stroke();ctx.setLineDash([]);}
  [c1,c2].forEach(c=>{const X=c.x*K,Y=c.y*K;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
    ctx.fillStyle=col.c;ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.9,Y+r*.65);ctx.lineTo(X-r*.9,Y+r*.65);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.stroke();});
  ctx.restore();
}
function vision(p){
  const X=p.x*K,Y=p.y*K,scan=p.state==='react',R=(scan?6:4.5)*K,h=scan?.6:.5;
  ctx.save();ctx.globalAlpha=scan?.5:.22;
  const g=ctx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,R,p.h-h,p.h+h);ctx.closePath();ctx.fill();ctx.restore();
}
function player(p){
  const X=p.x*K,Y=p.y*K,r=clamp(K*.8,9,15),hot=p.state==='go'||p.state==='through';
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(X+Math.cos(p.h)*(r+6),Y+Math.sin(p.h)*(r+6));
  ctx.lineTo(X+Math.cos(p.h+.55)*r*.9,Y+Math.sin(p.h+.55)*r*.9);
  ctx.lineTo(X+Math.cos(p.h-.55)*r*.9,Y+Math.sin(p.h-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c8ef4a';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  ctx.lineWidth=hot?3.5:2;ctx.strokeStyle=hot&&call?COLORS[call.col].c:'#fff';ctx.stroke();
  ctx.fillStyle='#16210a';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.id),X,Y+1);
}
function ball(p){const X=p.bx*K,Y=p.by*K,r=clamp(K*.36,4.5,7);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();}
function draw(){
  if(!CW)return;const now=performance.now()/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  drawField();GATES.forEach(g=>drawGate(g,now));
  if(showRuns&&call)players.forEach(p=>{if(p.trail.length<2)return;
    ctx.save();ctx.strokeStyle=COLORS[call.col].c;ctx.globalAlpha=.85;ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.lineCap='round';ctx.beginPath();
    p.trail.forEach((t,i)=>i?ctx.lineTo(t.x*K,t.y*K):ctx.moveTo(t.x*K,t.y*K));
    if(p.state!=='free')ctx.lineTo(p.x*K,p.y*K);ctx.stroke();ctx.restore();});
  if(showVis)players.forEach(vision);
  players.forEach(player);players.forEach(ball);
  players.forEach(p=>{if(p.state==='react')tag({x:p.x,y:p.y-1.7},'👀',{bg:'rgba(255,255,255,.85)',c:'#111'});
    if(p.flash>0)tag({x:p.x,y:p.y+(p.rank%2?-1.8:1.9)},p.rank+'. · '+p.time.toFixed(1).replace('.',',')+' s',{c:'#111',bg:p.rank===1?'#ffd34d':'rgba(255,255,255,.9)',a:Math.min(1,p.flash*1.5)});});
  // Trainer
  const tr={x:13,y:25.2},X=tr.x*K,Y=tr.y*K,r=clamp(K*.8,9,15);
  ctx.fillStyle='#1f2a44';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`800 ${r}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('T',X,Y+1);
  if(call){const col=COLORS[call.col],age=simT-call.t0;
    if(age<2.2)tag({x:18.2,y:25.2},'„'+col.n.toUpperCase()+'!“',{big:true,bg:col.c,c:col.t,a:age<1.6?1:(2.2-age)/.6});
    tag({x:13,y:1.5},'Kommando: '+col.n,{bg:col.c,c:col.t});}
  else if(started)tag({x:13,y:1.5},'Freies Dribbeln · Kopf hoch',{});
}

/* ---------- Text & UI ---------- */
let lastTxt='';
function updateUI(){
  let st,ti,tx;
  if(!started){st='Dribbling';ti='Farb-Tore-Parcours';tx='▶ Abspielen startet das freie Dribbeln. Mit den Farbtasten rufst du selbst ein Kommando – oder lass „Auto-Kommando“ an.';}
  else if(!call){st='Phase 1';ti='Freies Dribbeln – Kopf hoch!';tx='Alle dribbeln frei im Feld, Ball eng am Fuß. Blick immer wieder nach oben: Wo ist welche Farbe? Wo ist Platz?';}
  else{const col=COLORS[call.col].n,age=simT-call.t0;
    if(call.end!==null){const f=call.order[0];st='Auswertung';ti='Alle durch!';
      tx='Schnellster: Spieler '+f.id+' in '+f.time.toFixed(1).replace('.',',')+' s · Reihenfolge: '+call.order.map(p=>p.id).join(' – ')+'. Weiter frei dribbeln, gleich kommt das nächste Kommando.';}
    else if(age<1.0){st='Phase 2';ti='Kommando: '+col.toUpperCase()+'!';tx='Sofort reagieren: Kopf hoch, das nächste '+col.toLowerCase()+'e Tor suchen – nicht das, wo schon alle hinlaufen.';}
    else{st='Phase 3';ti='Tempo durchs Tor';tx='Mit Tempo und engen Kontakten durchs '+col.toLowerCase()+'e Tor dribbeln ('+call.done+' von '+call.n+' durch). Danach abbremsen, Ball kontrollieren, Kopf hoch.';}
  }
  const key=st+ti+tx;if(key!==lastTxt){lastTxt=key;q('ovStep').textContent=st;q('ovTitle').textContent=ti;q('ovText').textContent=tx;}
  q('ov').classList.toggle('hidden',!showText);
  q('bPlay').textContent=playing?'⏸ Pause':'▶ Abspielen';
  root.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('on',!!call&&+b.dataset.c===call.col));
}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;update(dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
function start(){started=true;playing=true;}
q('bPlay').onclick=()=>{if(!started){start();return;}playing=!playing;};
q('bRestart').onclick=()=>{init();start();};
q('sSpeed').onchange=e=>speed=+e.target.value;
q('sN').onchange=()=>{init();};
q('cAuto').onchange=e=>{auto=e.target.checked;if(auto&&!call)nextCallAt=simT+2;};
q('cVis').onchange=e=>showVis=e.target.checked;
q('cRuns').onchange=e=>showRuns=e.target.checked;
q('cText').onchange=e=>showText=e.target.checked;
function manual(c){if(!started)start();if(!playing)playing=true;callColor(c);}
root.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>manual(+b.dataset.c));
q('bRand').onclick=()=>{let c;do{c=Math.floor(Math.random()*COLORS.length);}while(c===lastCol);manual(c);};
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key>='1'&&e.key<='4')manual(+e.key-1);
  else if(e.key==='r'||e.key==='R'){init();start();}
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
init();resize();raf=requestAnimationFrame(frame);
root._sim={update:dt=>update(dt),call:c=>callColor(c),start,get state(){return{simT,call,players}}};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();
};
}

/* =====================================================================
   PARCOURS-ENGINE (für Slalom und Stationsparcours)
   Mehrere Spieler laufen im Takt nacheinander denselben Parcours.
   Alles ist eine reine Funktion der Zeit T → Schritte & Springen möglich.
   ===================================================================== */
function mountParcours(root,cfg){
root.className='pam';
const W=cfg.W,H=cfg.H;
root.innerHTML=`
  <h2>${cfg.title}</h2>
  <p class="sub">${cfg.sub}</p>
  <div class="stage sq"><canvas data-r="cv"></canvas></div>
  <div class="ov below" data-r="ov">
    <div class="ovStep" data-r="ovStep"></div>
    <div class="ovTitle" data-r="ovTitle"></div>
    <div class="ovText" data-r="ovText"></div>
  </div>
  <div class="steps" data-r="steps"></div>
  <div class="bar">
    <button data-r="bRestart">⟲ Neu</button>
    <button data-r="bPrev">◀ Schritt</button>
    <button data-r="bPlay" class="primary">▶ Abspielen</button>
    <button data-r="bNext">Schritt ▶</button>
    <label>Tempo
      <select data-r="sSpeed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select>
    </label>
  </div>
  <div class="bar">
    <label>Start-Takt
      <select data-r="sInt">${cfg.intervals.map(v=>`<option value="${v}"${v===cfg.defInterval?' selected':''}>alle ${v} s</option>`).join('')}</select>
    </label>
    ${cfg.laneOpt?`<label>Bahnen <select data-r="sLanes"><option value="1">1 Bahn</option><option value="2">2 Bahnen (Wettlauf)</option></select></label>`:''}
  </div>
  <div class="bar">
    <label><input type="checkbox" data-r="cText" checked> Text</label>
    <label><input type="checkbox" data-r="cCourse" checked> Parcours-Linie</label>
    <label><input type="checkbox" data-r="cFocus" checked> Fokus-Spieler hervorheben</label>
  </div>
  <div class="kbd">Tastatur: Leertaste = Play/Pause · ← → = Schritt · R = Neustart</div>
  <details><summary>Übungsbeschreibung</summary>${cfg.desc}</details>`;

const q=n=>root.querySelector('[data-r="'+n+'"]');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const ang=v=>Math.atan2(v.y,v.x);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const fmt=t=>t.toFixed(1).replace('.',',');

/* ---------- Pfade: Catmull-Rom mit Geschwindigkeit pro Abschnitt ---------- */
function buildPath(pts){
  const S=[{t:0,x:pts[0].x,y:pts[0].y}],ph=[],mark={};let t=0;
  if(pts[0].ph!==undefined)ph.push({t:0,ph:pts[0].ph});
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    if(i>0&&p1.ph!==undefined)ph.push({t,ph:p1.ph});
    if(p1.mark)mark[p1.mark]=t;
    if(p1.dw){t+=p1.dw;S.push({t,x:p1.x,y:p1.y});}
    let prev={x:p1.x,y:p1.y};const v=p1.v||2.5;
    for(let k=1;k<=16;k++){const s=k/16,s2=s*s,s3=s2*s;
      const x=.5*((2*p1.x)+(-p0.x+p2.x)*s+(2*p0.x-5*p1.x+4*p2.x-p3.x)*s2+(-p0.x+3*p1.x-3*p2.x+p3.x)*s3);
      const y=.5*((2*p1.y)+(-p0.y+p2.y)*s+(2*p0.y-5*p1.y+4*p2.y-p3.y)*s2+(-p0.y+3*p1.y-3*p2.y+p3.y)*s3);
      t+=Math.hypot(x-prev.x,y-prev.y)/v;S.push({t,x,y});prev={x,y};}
  }
  const lastP=pts[pts.length-1];if(lastP.mark)mark[lastP.mark]=t;
  return{S,T:t,ph,mark};
}
function pathPos(P,t){
  const S=P.S;if(t<=0)return{x:S[0].x,y:S[0].y};if(t>=P.T){const e=S[S.length-1];return{x:e.x,y:e.y};}
  let lo=0,hi=S.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(S[m].t<=t)lo=m;else hi=m;}
  const a=S[lo],b=S[hi],f=(t-a.t)/((b.t-a.t)||1);return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f)};
}
function polyAt(Q,d){ // Punkt nach Strecke d entlang Polylinie
  for(let i=0;i<Q.length-1;i++){const l=len(sub(Q[i+1],Q[i]));if(d<=l)return lp(Q[i],Q[i+1],d/l);d-=l;}
  const n=Q.length;const dir=norm(sub(Q[n-1],Q[n-2]));return add(Q[n-1],dir,d);
}

/* ---------- Setup ---------- */
let lanes=[],interval=cfg.defInterval,N=4,cycle=16,backCache=new Map();
function setup(){
  const nL=cfg.laneOpt?+q('sLanes').value:1;interval=+q('sInt').value;
  lanes=cfg.laneX(nL).map((x0,li)=>{const L=cfg.build(x0);L.li=li;L.run=buildPath(L.runPts);L.Q=L.queue;
    const e=pathPos(L.run,L.run.T);L.backPts=[{x:e.x,y:e.y,v:L.backPts[0].v||2.6}].concat(L.backPts.filter(b=>Math.hypot(b.x-e.x,b.y-e.y)>.05));return L;});
  // Rückweg ohne Endpunkt bauen, um Dauer abzuschätzen
  const est=buildPath(lanes[0].backPts.concat([polyAt(lanes[0].Q,1.3*3)]));
  const runMax=lanes[0].run.T/0.92+(cfg.shot?0.7:0)+est.T;
  N=Math.max(3,Math.ceil((runMax+interval*0.8)/interval));cycle=N*interval;backCache=new Map();
}
const SP=1.3; // Abstand in der Startreihe
function qPos(L,f){return polyAt(L.Q,Math.max(0,f)*SP);}
function runInfo(L,i,T){
  const first=i*interval;if(T<first)return{wait:true,f:(first-T)/interval};
  const k=Math.floor((T-first)/cycle),s=first+k*cycle,tau=T-s;
  const fac=.92+.16*hash(i*31+k*17+L.li*7+3);
  const runEnd=L.run.T/fac,bStart=runEnd+(cfg.shot?0.7:0);
  const key=L.li+':'+i+':'+k;let B=backCache.get(key);
  if(!B){B=buildPath(L.backPts.map(p=>Object.assign({},p)).concat([{x:0,y:0}]));
    // Endpunkt: Platz in der Startreihe zum Zeitpunkt der Ankunft
    let end=qPos(L,(cycle-(bStart+B.T))/interval);
    for(let it=0;it<2;it++){B=buildPath(L.backPts.concat([end]));end=qPos(L,(cycle-(bStart+B.T))/interval);}
    B=buildPath(L.backPts.concat([end]));B.end=end;backCache.set(key,B);if(backCache.size>400)backCache.clear();}
  return{wait:false,k,s,tau,fac,runEnd,bStart,B,bEnd:bStart+B.T,shotDone:runEnd+.55};
}
function posAt(L,i,T){
  const r=runInfo(L,i,T);
  if(r.wait)return qPos(L,r.f);
  if(r.tau<r.runEnd)return pathPos(L.run,r.tau*r.fac);
  if(r.tau<r.bStart)return pathPos(L.run,L.run.T);
  if(r.tau<r.bEnd)return pathPos(r.B,r.tau-r.bStart);
  return qPos(L,(r.s+cycle-T)/interval);
}
function dirAt(L,i,T,fallback){const v=sub(posAt(L,i,T+.08),posAt(L,i,T-.08));return len(v)>.02?norm(v):fallback;}

/* ---------- Zustand ---------- */
let T=0,playing=false,last=0,speed=1,showText=true,showCourse=true,showFocus=true,raf=0,alive=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;
const lastDir={};
function featured(){ // zuletzt gestarteter Spieler der ersten Bahn
  const L=lanes[0];let best=null;
  let newest=null;
  for(let i=0;i<N;i++){const r=runInfo(L,i,T);if(r.wait)continue;
    if(!newest||r.s>newest.r.s)newest={i,r};
    if(r.tau<r.bStart+1.6&&(!best||r.s<best.r.s))best={i,r};}
  return best||newest;
}
function phaseOf(r){ // Phase (Index in cfg.phases) eines Laufs
  if(r.tau>=r.bStart)return cfg.backPh;
  if(cfg.shot&&r.tau>=r.runEnd)return cfg.shotPh;
  const tt=r.tau*r.fac;let ph=lanes[0].run.ph[0].ph;lanes[0].run.ph.forEach(p=>{if(tt>=p.t)ph=p.ph;});return ph;
}
function phaseStartTau(r,ph){
  if(ph===cfg.backPh)return r.bStart;if(cfg.shot&&ph===cfg.shotPh)return r.runEnd;
  const e=lanes[0].run.ph.find(p=>p.ph===ph);return e?e.t/r.fac:0;
}
function timeOf(r){return cfg.timeMark?(lanes[0].run.mark[cfg.timeMark]||lanes[0].run.T)/r.fac:r.runEnd;}
function bestTime(){let best=null;
  lanes.forEach(L=>{for(let i=0;i<N;i++){const first=i*interval;if(T<first)continue;
    const kmax=Math.floor((T-first)/cycle);for(let k=Math.max(0,kmax-3);k<=kmax;k++){const r=runInfo(L,i,first+k*cycle+.001);
      if(first+k*cycle+timeOf(r)<=T){const t=timeOf(r);if(!best||t<best.t)best={t,i,li:L.li};}}}});
  return best;}

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tag(p,txt,o={}){
  const {c='#fff',bg='rgba(10,16,24,.82)',a=1}=o;
  const fs=clamp(K*.55,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();
}
const Hx={
  get K(){return K},ctx,tag,
  grass(x1,y1,x2,y2){ctx.fillStyle='#2a7d3b';ctx.fillRect(0,0,CW,CH);const n=10,h=(y2-y1)*K;
    for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(x1*K,y1*K+i*h/n,(x2-x1)*K,h/n+1);}
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.strokeRect(x1*K,y1*K,(x2-x1)*K,(y2-y1)*K);},
  cone(x,y,col='#ff8a1f',s=1){const X=x*K,Y=y*K,r=clamp(K*.4,4.5,8)*s;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r*.9,Y+r*.65);ctx.lineTo(X-r*.9,Y+r*.65);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();},
  pole(x,y){const X=x*K,Y=y*K,r=clamp(K*.28,3.5,6);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+3,Y+3,r*1.3,r,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.strokeStyle='#1a1a1a';ctx.lineWidth=Math.max(1.5,r*.45);ctx.beginPath();ctx.arc(X,Y,r*.55,0,7);ctx.stroke();},
  dummy(x,y,a=0){ctx.save();ctx.translate(x*K,y*K);ctx.rotate(a);const w=1.8*K,h=Math.max(5,.55*K);
    ctx.fillStyle='rgba(0,0,0,.3)';rr(-w/2+2,-h/2+3,w,h,h/2);ctx.fill();ctx.fillStyle='#ff7a1a';rr(-w/2,-h/2,w,h,h/2);ctx.fill();
    ctx.strokeStyle='#7a2e00';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();},
  miniGoal(x,y,w){const x1=(x-w/2)*K,x2=(x+w/2)*K,Y=y*K,b=(y-1)*K;ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x1,b,x2-x1,Y-b);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;for(let xx=x-w/2+.5;xx<x+w/2;xx+=.5){ctx.beginPath();ctx.moveTo(xx*K,b);ctx.lineTo(xx*K,Y);ctx.stroke();}
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,Y);ctx.lineTo(x1,b);ctx.lineTo(x2,b);ctx.lineTo(x2,Y);ctx.stroke();ctx.lineCap='butt';},
  balls(x,y,n=3){for(let i=0;i<n;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((x+i*.6)*K,(y+(i%2)*.4)*K,Math.max(3,K*.28),0,7);ctx.fill();}}
};
function pathStroke(P,o){const {col='#fff',a=.25,w=2,dash=null,wavy=false}=o;
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();
  let dist=0;P.S.forEach((s,i)=>{let x=s.x,y=s.y;if(wavy&&i>0&&i<P.S.length-1){const pv=P.S[i-1],nx=P.S[i+1],d=norm(sub(nx,pv));dist+=len(sub(s,pv));const k=Math.sin(dist/1.2*Math.PI*2)*.22;x+=-d.y*k;y+=d.x*k;}
    i?ctx.lineTo(x*K,y*K):ctx.moveTo(x*K,y*K);});ctx.stroke();ctx.restore();}
function player(p,lbl,face,o={}){
  const {ring=null,a=1}=o;const X=p.x*K,Y=p.y*K,r=clamp(K*.75,8,14);
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(X+Math.cos(face)*(r+6),Y+Math.sin(face)*(r+6));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=o.fill||'#c8ef4a';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  ctx.fillStyle='#16210a';ctx.font=`800 ${r*(lbl.length>1?.75:1)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);ctx.restore();
}
function ball(p,a=1){const X=p.x*K,Y=p.y*K,r=clamp(K*.34,4,7);ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X+1.5,Y+2,r,r*.8,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();ctx.restore();}
function draw(){
  if(!CW)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  cfg.drawField(Hx,lanes);
  if(showCourse)lanes.forEach(L=>{pathStroke(L.run,{a:.32,wavy:true});
    if(cfg.shot)pathStroke({S:[pathPos(L.run,L.run.T),L.shotTo]},{col:'#ffd34d',a:.35,dash:[5,6]});
    pathStroke(buildPath(L.backPts.concat([qPos(L,N-1)])),{a:.22,dash:[2,6],w:1.6});});
  const F=featured();
  lanes.forEach(L=>{
    for(let i=0;i<N;i++){
      const p=posAt(L,i,T),r=runInfo(L,i,T),qd=norm(sub(L.Q[0],L.Q[1]));
      const d=dirAt(L,i,T,lastDir[L.li+':'+i]||qd);lastDir[L.li+':'+i]=d;
      const waiting=r.wait||r.tau>=r.bEnd;const face=waiting?ang(qd):ang(d);
      const isF=showFocus&&L.li===0&&F&&F.i===i;
      const lbl=(lanes.length>1?(L.li?'B':'A'):'')+(i+1);
      // Ball
      let bp=null,ba=1;
      if(!r.wait&&r.tau<r.runEnd)bp=add(p,d,.7);
      else if(cfg.shot&&!r.wait&&r.tau<r.runEnd+2.6){const sp=add(pathPos(L.run,L.run.T),dirAt(L,i,r.s+r.runEnd-.1,qd),.7);
        const u=clamp((r.tau-r.runEnd)/.55,0,1);bp=lp(sp,L.shotTo,1-Math.pow(1-u,2));ba=r.tau>r.runEnd+1.8?(r.runEnd+2.6-r.tau)/.8:1;}
      else if(cfg.backBall)bp=add(p,waiting?qd:d,.7);
      player(p,lbl,face,{ring:isF?'#ffd34d':null,a:waiting&&!isF?.85:1});
      if(bp)ball(bp,ba);
      // Stoppuhr
      if(!r.wait){const tt=timeOf(r);
        if(r.tau<tt&&(isF||lanes.length>1))tag({x:p.x,y:p.y-1.6},'⏱ '+fmt(r.tau),{bg:'rgba(10,16,24,.85)'});
        else if(r.tau>=tt&&r.tau<tt+2.4&&(isF||lanes.length>1))tag({x:p.x,y:p.y-1.6},'✓ '+fmt(tt)+' s',{c:'#111',bg:'#ffd34d'});
        if(isF&&cfg.cue){const ph=phaseOf(r),cu=cfg.cue[ph];if(cu&&r.tau<r.bStart)tag({x:p.x,y:p.y+1.7},cu,{c:'#111',bg:'rgba(255,255,255,.92)'});}
        if(cfg.shot&&r.tau>=r.runEnd+.5&&r.tau<r.runEnd+1.6&&(isF||lanes.length>1))tag(add(L.shotTo,{x:0,y:2}),'⚽ TOR!',{c:'#111',bg:'#ffd34d'});}
    }
  });
}

/* ---------- UI ---------- */
const PH=cfg.phases;
const steps=q('steps');
PH.forEach((p,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=(i+1)+' · '+p.label;c.dataset.i=i;
  c.onclick=()=>{playing=false;jumpTo(i)};steps.appendChild(c);});
function jumpTo(ph){const F=featured();if(!F){T=0;return;}setT(F.r.s+phaseStartTau(F.r,ph)+.02);}
let lastKey='';
function updateUI(){
  const F=featured();let ph=0,st='',ti,tx;
  if(F){ph=phaseOf(F.r);const P=PH[ph];ti=P.title;tx=P.text;
    st='Spieler '+(lanes.length>1?'A':'')+(F.i+1)+' · Schritt '+(ph+1)+' von '+PH.length;}
  const b=bestTime();
  if(!playing&&T===0){st='Parcours';ti=cfg.title;tx='▶ Abspielen startet den Parcours. Die Spieler starten im Takt nacheinander, jeder mit Stoppuhr.';}
  const extra=b?' · Bestzeit: '+(lanes.length>1?(b.li?'B':'A'):'')+(b.i+1)+' mit '+fmt(b.t)+' s':'';
  const key=st+ti+tx+extra;
  if(key!==lastKey){lastKey=key;q('ovStep').textContent=st+extra;q('ovTitle').textContent=ti;q('ovText').textContent=tx;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',!!F&&ci===ph&&(playing||T>0));c.classList.toggle('done',!!F&&ci<ph);});}
  q('ov').classList.toggle('hidden',!showText);
  q('bPlay').textContent=playing?'⏸ Pause':'▶ Abspielen';
}
function setT(t){T=Math.max(0,t);}
function frame(ts){
  if(!alive)return;
  if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}
  last=ts;draw();updateUI();raf=requestAnimationFrame(frame);
}
q('bPlay').onclick=()=>{playing=!playing;};
q('bRestart').onclick=()=>{setT(0);playing=true;};
q('bPrev').onclick=()=>{playing=false;const F=featured();if(!F){setT(0);return;}const ph=phaseOf(F.r),st=phaseStartTau(F.r,ph);
  if(F.r.tau-st>.4)jumpTo(ph);else if(ph>0)jumpTo(ph-1);else setT(Math.max(0,F.r.s-interval+.02));};
q('bNext').onclick=()=>{playing=false;const F=featured();if(!F){setT(.02);return;}const ph=phaseOf(F.r);
  if(ph<PH.length-1)jumpTo(ph+1);else setT(F.r.s+interval+.02);};
q('sSpeed').onchange=e=>speed=+e.target.value;
q('sInt').onchange=()=>{setup();setT(0);};
if(cfg.laneOpt)q('sLanes').onchange=()=>{setup();setT(0);};
q('cText').onchange=e=>showText=e.target.checked;
q('cCourse').onchange=e=>showCourse=e.target.checked;
q('cFocus').onchange=e=>showFocus=e.target.checked;
function onKey(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}
  else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();
  else if(e.key==='r'||e.key==='R')q('bRestart').click();
}
document.addEventListener('keydown',onKey);
function resize(){
  CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
let ro=null;
if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);
setup();resize();raf=requestAnimationFrame(frame);
root._sim={setT,get T(){return T},get N(){return N},get cycle(){return cycle},featured,posAt:(li,i,t)=>posAt(lanes[li],i,t),lanes:()=>lanes};
return function destroy(){
  alive=false;cancelAnimationFrame(raf);
  document.removeEventListener('keydown',onKey);
  window.removeEventListener('resize',resize);
  if(ro)ro.disconnect();
};
}

function mountSlalom(root){
  const POLES=[28,26.5,25,23.5,22,20.5,19];
  return mountParcours(root,{
    title:'Slalom-Parcours mit Abschluss',
    sub:'Enge Ballführung durch 7 Stangen, nach der letzten Stange beschleunigen und aufs Minitor abschließen. Danach zurück und hinten anstellen.',

    laneX:n=>n===2?[7,17]:[12],
    build:x0=>{
      const run=[{x:x0,y:31.2,v:2.6,ph:0},{x:x0-.2,y:29.6,v:2.2}];
      POLES.forEach((y,i)=>run.push({x:x0+(i%2?1.05:-1.05),y,v:2.1}));
      run[2].ph=0;
      run.push({x:x0+.1,y:17.4,v:4.4,ph:1},{x:x0+.3,y:11.6,v:4.8});
      return{runPts:run,shotTo:{x:x0-.8,y:2.9},

        queue:[{x:x0,y:31.2},{x:x0,y:34.4},{x:x0+3.4,y:34.6}],poles:POLES.map(y=>({x:x0,y}))};
    },
    drawField:(h,lanes)=>{h.grass(1,3.2,23,35.4);
      lanes.forEach(L=>{const x0=L.runPts[0].x;h.miniGoal(x0,3.2,3);L.poles.forEach(p=>h.pole(p.x,p.y));
        h.cone(x0-.9,31.2,'#3d6bff');h.cone(x0+.9,31.2,'#3d6bff');h.cone(x0-1.2,11.6,'#ffffff',.8);h.cone(x0+1.8,11.6,'#ffffff',.8);

        if(lanes.length>1)h.tag({x:x0,y:5.0},L.li?'Bahn B':'Bahn A',{bg:'rgba(10,16,24,.7)'});});

      h.tag({x:x0+(lanes.length>1?0:-4.6),y:lanes.length>1?16:23.5},'7 Stangen · 1,5 m',{bg:'rgba(10,16,24,.7)'});

    },
    cue:{0:'Enge Kontakte',1:'Tempo!',2:'Abschluss'},
    phases:[
      {label:'Slalom',title:'Slalom durch die Stangen',text:'Enge Ballführung: kleine Kontakte mit Innen- und Außenseite, Körper zwischen Ball und Stange, Schwerpunkt tief. Kopf zwischendurch hoch.'},
      {label:'Tempo',title:'Beschleunigen nach der letzten Stange',text:'Ball nach der letzten Stange etwas weiter vorlegen und Tempo aufnehmen – in Richtung Schusslinie.'},
      {label:'Abschluss',title:'Abschluss aufs Minitor',text:'Vor dem Schuss kurz hochschauen, Standbein neben den Ball, flach und platziert abschließen.'},
      {label:'Zurück',title:'Zurück & anstellen',text:'Außen zurück zur Startreihe joggen und hinten anstellen. Der Nächste startet im Takt.'}],
    desc:`<h3>Organisation</h3><ul><li>7 Stangen (oder Hütchen) in einer Linie, je ca. 1,5 m Abstand</li><li>Start ca. 3 m vor der ersten Stange, Schusslinie ca. 6 m nach der letzten Stange</li><li>Minitor ca. 8–9 m hinter der Schusslinie, Bälle am Start</li><li>Optional: zwei Bahnen nebeneinander als Wettlauf</li></ul>

const q=n=>root.querySelector('[data-r="'+n+'"]');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lp=(p,r,t)=>({x:lerp(p.x,r.x,t),y:lerp(p.y,r.y,t)});
const sub=(p,r)=>({x:p.x-r.x,y:p.y-r.y}), len=v=>Math.hypot(v.x,v.y);
const norm=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l}};
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const perp=v=>({x:-v.y,y:v.x});
const ang=v=>Math.atan2(v.y,v.x);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

const cub=(a,c1,c2,b,t)=>{const u=1-t;return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}};

const ACT=Object.assign({},V.own,V.opp);
const isOpp=k=>k in V.opp;
const LBL={TW:'TW',IL:'IL',IR:'IR',LV:'LV',RV:'RV',Z6:'6',Z8:'8',S1:'S1',S2:'S2'};
/* Läufe & Ballführungen (Ballführung = Lauf mit Ball) */
const runs=[];
V.runs.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1},o||{})));
V.carries.forEach(([w,to,t0,t1,o])=>runs.push(Object.assign({w,to,t0,t1,carry:1},o||{})));
runs.sort((a,b)=>a.t0-b.t0);
{const cur={};Object.keys(ACT).forEach(k=>cur[k]=ACT[k]);runs.forEach(r=>{r.from=cur[r.w];cur[r.w]=r.to;});}
function runPt(r,t){if(r.c1)return cub(r.from,r.c1,r.c2,r.to,t);if(r.k)return quad(r.from,r.k,r.to,t);return lp(r.from,r.to,t);}
function actorPos(k,T){let p=ACT[k];
  for(const r of runs){if(r.w!==k)continue;if(T<=r.t0)break;if(T<r.t1)return runPt(r,ease(seg(T,r.t0,r.t1)));p=r.to;}
  return p;}
function runningAt(k,T){return runs.find(r=>r.w===k&&T>r.t0&&T<r.t1)}
function foot(k,T){const p=actorPos(k,T),v=sub(actorPos(k,T+.05),actorPos(k,T-.05));return add(p,len(v)>.01?norm(v):{x:0,y:-1},.8);}
/* Ball-Ereignisse */
const passes=V.passes.map(([f,to,t0,t1,lbl,o])=>{const pt=typeof to!=='string',a=actorPos(f,t0),b=pt?to:actorPos(to,t1);
  return Object.assign({type:'pass',f,to:pt?null:to,t0,t1,lbl,s:add(a,norm(sub(b,a)),.8),e:pt?b:add(b,norm(sub(a,b)),.9)},o||{});});
const events=passes.concat(runs.filter(r=>r.carry).map(r=>({type:'carry',w:r.w,t0:r.t0,t1:r.t1}))).sort((a,b)=>a.t0-b.t0);
const evStart=ev=>ev.type==='pass'?ev.s:foot(ev.w,ev.t0+.06);
const evEnd=ev=>ev.type==='pass'?ev.e:foot(ev.w,ev.t1-.06);
function ballAt(T){
  if(T<events[0].t0){const s=evStart(events[0]);return T<.6?V.ball:lp(V.ball,s,ease(seg(T,.6,events[0].t0)));}
  let i=0;for(let k=0;k<events.length;k++)if(T>=events[k].t0)i=k;
  const ev=events[i];
  if(T<ev.t1)return ev.type==='pass'?lp(ev.s,ev.e,ev.lob?seg(T,ev.t0,ev.t1):1-Math.pow(1-seg(T,ev.t0,ev.t1),1.35)):foot(ev.w,T);
  const n=events[i+1];if(n)return lp(evEnd(ev),evStart(n),ease(seg(T,ev.t1,n.t0)));
  return evEnd(ev);}
function liftAt(T){const p=passes.find(p=>p.lob&&T>=p.t0&&T<p.t1);return p?Math.sin(Math.PI*seg(T,p.t0,p.t1)):0;}
function holderAt(T){let h='TW';for(const ev of events){if(T<ev.t0)break;if(ev.type==='pass')h=T>=ev.t1?ev.to:null;else if(T<=ev.t1||h===ev.w)h=ev.w;}return h;}

const PH=V.ph,TEND=V.TEND;
let T=0,playing=false,last=0,speed=1,showText=true,showOpp=true,showRuns=true,raf=0,alive=true;
const cv=q('cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,CW=0,CH=0;

/* ---------- Zeichnen ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowHead(X,Y,an,w){const h=Math.max(8,w*3.2);ctx.beginPath();ctx.moveTo(X,Y);
  ctx.lineTo(X-h*Math.cos(an-.45),Y-h*Math.sin(an-.45));ctx.lineTo(X-h*Math.cos(an+.45),Y-h*Math.sin(an+.45));ctx.closePath();ctx.fill();}
function line(p,r,o={}){const {c='#fff',w=2.6,a=1,head=false,dash=null}=o;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(p.x*K,p.y*K);ctx.lineTo(r.x*K,r.y*K);ctx.stroke();ctx.setLineDash([]);
  if(head&&len(sub(r,p))*K>4)arrowHead(r.x*K,r.y*K,ang(sub(r,p)),w);ctx.restore();}
function runLine(r,t1,o={}){const {col='#7fd1ff',w=2,al=1,dash=[5,6],head=false,wavy=false}=o;if(t1<=0)return;
  ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  if(!wavy)ctx.setLineDash(dash);ctx.beginPath();let dist=0,prev=runPt(r,0);
  for(let i=0;i<=48;i++){const t=t1*i/48,p=runPt(r,t);if(i)dist+=len(sub(p,prev));let x=p.x,y=p.y;
    if(wavy&&i>0&&i<48){const d=norm(sub(runPt(r,Math.min(1,t+.01)),runPt(r,Math.max(0,t-.01)))),k=Math.sin(dist/1.3*Math.PI*2)*.3;x+=-d.y*k;y+=d.x*k;}
    prev=p;i?ctx.lineTo(x*K,y*K):ctx.moveTo(x*K,y*K);}
  ctx.stroke();ctx.setLineDash([]);
  if(head){const p=runPt(r,t1),p0=runPt(r,Math.max(0,t1-.05));arrowHead(p.x*K,p.y*K,ang(sub(p,p0)),w);}
  ctx.restore();}
function tag(p,txt,o={}){const {c='#fff',bg='rgba(10,16,24,.82)',a=1}=o;
  const fs=clamp(K*.95,10,13);ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font=`600 ${fs}px system-ui,sans-serif`;const w=ctx.measureText(txt).width+12,h=fs+9;
  const X=clamp(p.x*K-w/2,3,CW-w-3),Y=clamp(p.y*K-h/2,3,CH-h-3);
  ctx.fillStyle=bg;rr(X,Y,w,h,h/2);ctx.fill();ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X+w/2,Y+h/2+.5);ctx.restore();}
function drawField(){
  const n=12;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#2f8f43':'#349a49';ctx.fillRect(0,i*CH/n,CW,CH/n+1);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;const L=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1*K,y1*K);ctx.lineTo(x2*K,y2*K);ctx.stroke();};
  ctx.strokeRect(1*K,2*K,(W-2)*K,(H-4)*K);L(1,32,W-1,32);
  ctx.beginPath();ctx.arc(22.5*K,32*K,6*K,0,7);ctx.stroke();
  [[2,1],[H-2,-1]].forEach(([gy,dir])=>{
    const by=dir>0?gy:gy-12,ty=dir>0?gy:gy-5;
    ctx.strokeRect(8.5*K,by*K,28*K,12*K);ctx.strokeRect(15.5*K,ty*K,14*K,5*K);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(22.5*K,(gy+dir*9)*K,Math.max(2,K*.2),0,7);ctx.fill();
    const g1=20*K,g2=25*K,gy0=gy*K,gb=(gy-dir*1.2)*K;ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(g1,Math.min(gy0,gb),g2-g1,Math.abs(gy0-gb));
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g1,gy0);ctx.lineTo(g1,gb);ctx.lineTo(g2,gb);ctx.lineTo(g2,gy0);ctx.stroke();ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;});
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=`700 ${clamp(K*.85,9,12)}px system-ui,sans-serif`;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('↑ Spielrichtung',1.8*K,33.6*K);
}
function player(p,lbl,face,o={}){const {fill='#c8ef4a',txt='#16210a',ring=null,a=1}=o;
  const X=p.x*K,Y=p.y*K,r=clamp(K*1.15,8,14);ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(X+2,Y+3,r,r*.85,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(X+Math.cos(face)*(r+6),Y+Math.sin(face)*(r+6));
  ctx.lineTo(X+Math.cos(face+.55)*r*.9,Y+Math.sin(face+.55)*r*.9);ctx.lineTo(X+Math.cos(face-.55)*r*.9,Y+Math.sin(face-.55)*r*.9);ctx.closePath();ctx.fill();
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=ring?3.5:2;ctx.strokeStyle=ring||'#fff';ctx.stroke();
  if(lbl){ctx.fillStyle=txt;ctx.font=`800 ${r*(lbl.length>1?.8:1)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,X,Y+1);}
  ctx.restore();}
function drawBall(p,h=0){const X=p.x*K,Y0=p.y*K,r0=clamp(K*.55,4.5,7),r=r0*(1+.6*h),Y=Y0-h*3.2*K;
  ctx.fillStyle='rgba(0,0,0,'+(.35-.15*h)+')';ctx.beginPath();ctx.ellipse(X+1.5+h*4,Y0+2,r0*(1-.25*h),r0*.8*(1-.25*h),0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,r*.38,0,7);ctx.fill();}

  if(!CW)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);

    runs.filter(r=>!isOpp(r.w)).forEach(r=>runLine(r,1,{al:.22,wavy:!!r.carry,col:r.carry?'#fff':'#7fd1ff'}));}
  runs.forEach(r=>{if(T<=r.t0)return;const opp=isOpp(r.w);if(opp&&!showOpp)return;const t=ease(seg(T,r.t0,r.t1));
    if(r.carry)runLine(r,t,{col:'#fff',w:2,al:.9,wavy:true});
    else runLine(r,t,{col:opp?'#ff9a9d':'#7fd1ff',w:opp?1.6:2.2,al:opp?.55:.9,head:t>=.98&&!opp,dash:opp?[3,5]:[5,6]});
    if(r.lbl&&T<r.t1+.4)tag(add(runPt(r,.6),{x:0,y:1.9}),r.lbl,{c:'#05263a',bg:'#7fd1ff'});});
  passes.forEach((p,i)=>{if(T<p.t0)return;const done=T>=p.t1;
    line(p.s,done?p.e:ballAt(T),{w:p.shot?3.2:2.8,c:p.shot||p.lob?'#ffd34d':'#fff',dash:p.lob?[7,6]:null,a:passes[i+1]&&T>=passes[i+1].t0?.5:1,head:done});
    if(T<p.t1+.6)tag(add(lp(p.s,p.e,.5),perp(norm(sub(p.e,p.s))),2.0),p.lbl,p.shot||p.lob?{c:'#111',bg:'#ffd34d'}:{});
    if(p.shot&&T>=p.t1&&T<p.t1+1.5)tag(add(p.e,{x:0,y:5}),'⚽ TOR!',{c:'#111',bg:'#ffd34d',a:.75+.25*Math.sin(performance.now()/160)});});
  const ball=ballAt(T),hold=holderAt(T);
  Object.keys(ACT).forEach(k=>{const opp=isOpp(k);if(opp&&!showOpp)return;
    const p=actorPos(k,T),run=runningAt(k,T);let f=ang(sub(ball,p));
    if(run&&!run.carry&&seg(T,run.t0,run.t1)<.75)f=ang(sub(runPt(run,1),p));if(run&&run.carry)f=ang(sub(runPt(run,Math.min(1,seg(T,run.t0,run.t1)+.1)),p));
    if(len(sub(ball,p))<.3)f=-Math.PI/2;
    player(p,opp?'':LBL[k],f,opp?{fill:k==='GT'?'#a12d33':'#e5484d',txt:'#fff'}:{ring:hold===k?'#ffd34d':null});});
  drawBall(ball,liftAt(T));
}

/* ---------- UI ---------- */
const phaseIdx=t=>{let i=0;for(let k=0;k<PH.length;k++)if(t>=PH[k].t-1e-6)i=k;return i};
const steps=q('steps');
PH.forEach((p,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=(i>0&&i<PH.length-1?i+' · ':'')+p.label;c.dataset.i=i;
  c.onclick=()=>{playing=false;setT(PH[i].t+.001)};steps.appendChild(c);});
let lastKey=-1;
function updateUI(){const i=phaseIdx(T),p=PH[i];
  if(i!==lastKey){lastKey=i;q('ovStep').textContent=V.name+(i>0&&i<PH.length-1?' · Schritt '+i+' von '+(PH.length-2):'');
    q('ovTitle').textContent=p.title;q('ovText').textContent=p.text;
    [...steps.children].forEach(c=>{const ci=+c.dataset.i;c.classList.toggle('on',ci===i);c.classList.toggle('done',ci<i);});}
  q('ov').classList.toggle('hidden',!showText);q('rT').value=T;
  q('bPlay').textContent=playing?'⏸ Pause':(T>=TEND?'⟲ Nochmal':'▶ Abspielen');}
function setT(t){if(t>=TEND){t=TEND;playing=false;}T=Math.max(0,t);}
function frame(ts){if(!alive)return;if(playing){const dt=Math.min(.05,(ts-last)/1000)*speed;setT(T+dt);}last=ts;draw();updateUI();raf=requestAnimationFrame(frame);}
q('bPlay').onclick=()=>{if(T>=TEND){setT(0);playing=true;return}playing=!playing;};
q('bRestart').onclick=()=>{setT(0);playing=true;};
q('bPrev').onclick=()=>{playing=false;const i=phaseIdx(T);const tgt=(T-PH[i].t>.3)?PH[i].t:PH[Math.max(0,i-1)].t;setT(tgt+.001);};
q('bNext').onclick=()=>{playing=false;const i=phaseIdx(T);setT(i<PH.length-1?PH[i+1].t+.001:TEND);};
q('rT').oninput=e=>{playing=false;setT(+e.target.value);};
q('sSpeed').onchange=e=>speed=+e.target.value;
q('cText').onchange=e=>showText=e.target.checked;
q('cOpp').onchange=e=>showOpp=e.target.checked;
q('cRuns').onchange=e=>showRuns=e.target.checked;
root.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v!==vk&&SPZ_VARIANTS[v]&&typeof openExercise==='function')openExercise('spielzug-'+v.toLowerCase());});
function onKey(e){if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();q('bPlay').click();}else if(e.key==='ArrowRight')q('bNext').click();
  else if(e.key==='ArrowLeft')q('bPrev').click();else if(e.key==='r'||e.key==='R')q('bRestart').click();}
document.addEventListener('keydown',onKey);
function resize(){CW=cv.parentElement.clientWidth;if(!CW)return;CH=CW*H/W;K=CW/W;DPR=window.devicePixelRatio||1;
  cv.style.height=CH+'px';cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);}
let ro=null;if(window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement);}
window.addEventListener('resize',resize);resize();raf=requestAnimationFrame(frame);
root._sim={setT,holderAt,ballAt,actorPos};
return function destroy(){alive=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',onKey);window.removeEventListener('resize',resize);if(ro)ro.disconnect();};
}

/* ===================== Start ===================== */
(function init(){
  try{
  let fromHash='';try{fromHash=location.hash.slice(1);}catch(e){}
  const id=EXERCISES.some(e=>e.id===fromHash)?fromHash:(store('lastEx')||EXERCISES[0].id);
  openExercise(EXERCISES.some(e=>e.id===id)?id:EXERCISES[0].id);
  }catch(err){
    viewEl.innerHTML='<div class="soonview"><h2>Fehler beim Start</h2><p>'+String(err&&err.message||err)+'</p></div>';
  }
})();
</script>
